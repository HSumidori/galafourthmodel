<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Galgame Player</title>
<style>
/* ==========================================================================
   0. 主题变量 / 尺寸变量
   --cg-* 由 JS 依据 meta.theme 覆盖；其余为布局尺度，用 clamp + dvh 做响应式
   ========================================================================== */
:root{
  --cg-primary:#ff8fb1;
  --cg-accent:#8fb1ff;
  --cg-bg:#101425;
  --cg-primary-soft:rgba(255,143,177,.20);
  --cg-accent-soft:rgba(143,177,255,.20);
  --cg-ink:#f2f4ff;
  --cg-ink-dim:rgba(233,238,255,.68);
  --cg-panel:rgba(10,13,26,.72);
  --cg-panel-strong:rgba(9,11,22,.92);
  --cg-stroke:rgba(255,255,255,.14);

  --cg-app-h:100vh;
  --cg-app-h:100dvh;
  --cg-pad-t:env(safe-area-inset-top,0px);
  --cg-pad-b:env(safe-area-inset-bottom,0px);
  --cg-pad-l:env(safe-area-inset-left,0px);
  --cg-pad-r:env(safe-area-inset-right,0px);

  --cg-font-base:16px;
  --cg-dialog-font:19px;
  --cg-title-font:clamp(30px,7.6vw,58px);
  --cg-sprite-h:52vh;
  --cg-sprite-bottom:18vh;
  --cg-sprite-w:min(38vw,340px);
  --cg-dialog-pad:18px 22px;
  --cg-radius:16px;
}
/* 字号档位（设置面板写入 data-fontsize） */
html[data-fontsize="small"]{ --cg-dialog-font:16px; --cg-font-base:15px; }
html[data-fontsize="medium"]{ --cg-dialog-font:19px; --cg-font-base:16px; }
html[data-fontsize="large"]{ --cg-dialog-font:23px; --cg-font-base:17px; }

/* ==========================================================================
   1. 基础重置
   ========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--cg-bg); }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:var(--cg-font-base);
  color:var(--cg-ink);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button{ font:inherit; color:inherit; cursor:pointer; }
button:disabled{ cursor:not-allowed; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.22); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

#app{
  position:relative;
  width:100%;
  height:var(--cg-app-h);
  overflow:hidden;
  background:var(--cg-bg);
}
.hidden{ display:none !important; }
/* 屏幕层：同一时刻只显示一层（title / game / ending） */
.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding:calc(var(--cg-pad-t) + 10px) calc(var(--cg-pad-r) + 12px)
          calc(var(--cg-pad-b) + 10px) calc(var(--cg-pad-l) + 12px);
}
.layer{ position:absolute; inset:0; pointer-events:none; }
.layer > *{ pointer-events:auto; }

/* ==========================================================================
   2. 标题画面
   ========================================================================== */
#title-screen{
  /* 上下分离：标题靠顶、按钮靠底，中间整块留给封面 */
  justify-content:space-between;
  gap:clamp(8px,1.6vh,20px);
  text-align:center;
  overflow:hidden;
  padding:clamp(14px,3vh,38px) clamp(14px,3vw,36px);
  background:
    radial-gradient(120% 80% at 12% 0%,var(--cg-primary-soft),transparent 60%),
    radial-gradient(110% 90% at 88% 100%,var(--cg-accent-soft),transparent 62%),
    var(--cg-bg);
}
.title-aurora{
  position:absolute; inset:-20%;
  background:
    radial-gradient(closest-side,var(--cg-primary-soft),transparent 70%) 18% 22%/46% 46% no-repeat,
    radial-gradient(closest-side,var(--cg-accent-soft),transparent 70%) 82% 74%/52% 52% no-repeat;
  filter:blur(8px);
  animation:aurora 18s ease-in-out infinite alternate;
}
@keyframes aurora{
  from{ transform:translate3d(-2%,-1%,0) scale(1); }
  to{ transform:translate3d(3%,2%,0) scale(1.08); }
}
.title-card{
  position:relative; z-index:1;
  width:100%; max-width:min(920px,96vw);
  margin:0 auto;
  flex:1 1 auto; min-height:0;
  overflow-y:auto;
  display:flex; flex-direction:column; justify-content:space-between;
  gap:clamp(10px,2vh,26px);
  padding:0;
  /* 面板完全透明。文字可读性交给上下两条渐变带（.cover-scrim），
     **中间整块封面不加任何蒙版**——之前用"椭圆压暗"，结果就是照片中央糊着一团脏印子。 */
  background:none;
  border:0;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}
.title-head, .title-bottom{
  display:flex; flex-direction:column; align-items:center;
  gap:clamp(6px,1.2vh,14px);
}
/* 文字压在照片上时必须靠外圈暗影撑出对比（不再有整块蒙版兜底） */
.title-main{ text-shadow:0 2px 6px rgba(0,0,0,.92),0 6px 22px rgba(0,0,0,.82),0 16px 50px rgba(0,0,0,.62); }
.title-sub, .title-synopsis{ text-shadow:0 1px 4px rgba(0,0,0,.95),0 2px 14px rgba(0,0,0,.85); }
.title-tags .tag{ text-shadow:0 1px 3px rgba(0,0,0,.8); }
/* 有封面时把标题渐变整体提亮：原来的粉/蓝中间调会融进树冠一类中间调背景里 */
#title-screen.has-cover .title-main{
  background:linear-gradient(100deg,#fff 6%,color-mix(in srgb,var(--cg-primary) 58%,#fff) 46%,color-mix(in srgb,var(--cg-accent) 62%,#fff) 96%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
#title-screen.has-cover .title-foot{ text-shadow:0 1px 4px rgba(0,0,0,.95),0 2px 12px rgba(0,0,0,.9); }
/* 简介/副标题原本用 --cg-ink-dim（本来就压暗），压在照片的亮部根本读不清。
   有封面时统一提亮，配合深色光晕。 */
#title-screen.has-cover .title-synopsis,
#title-screen.has-cover .title-sub{
  color:rgba(240,244,255,.94);
  text-shadow:0 1px 3px rgba(0,0,0,.98),0 2px 8px rgba(0,0,0,.92),0 4px 20px rgba(0,0,0,.8);
}
#title-screen.has-cover .title-foot{ color:rgba(226,232,250,.86); }
/* 标题画面上按钮要有自己的底色，否则压在亮封面上会糊掉。
   注意要排除 .btn-main —— 上面这条选择器优先级比 .btn-main 高，
   不排除的话会把"开始游戏"的主色渐变盖成一块深灰（实测踩过）。 */
.title-buttons .btn:not(.btn-main){ background:rgba(14,16,28,.58); border-color:rgba(255,255,255,.24); }
.title-buttons .btn:not(.btn-main):hover:not(:disabled){ background:rgba(26,30,48,.76); }
.title-buttons .btn-ghost:not(.btn-main){ background:rgba(14,16,28,.46); }
.title-main{
  margin:0;
  font-size:var(--cg-title-font);
  line-height:1.12;
  letter-spacing:.04em;
  font-weight:800;
  background:linear-gradient(100deg,#fff 8%,var(--cg-primary) 46%,var(--cg-accent) 96%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  text-shadow:0 6px 30px rgba(0,0,0,.35);
}
.title-sub{
  margin:0; font-size:clamp(12px,1.6vw,15px);
  letter-spacing:.28em; text-transform:uppercase; color:var(--cg-ink-dim);
}
.title-synopsis{
  margin:0; max-width:46ch;
  font-size:clamp(13px,1.5vw,15px); line-height:1.75; color:var(--cg-ink-dim);
}
.title-tags{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.tag{
  font-size:12px; padding:3px 10px; border-radius:999px;
  border:1px solid color-mix(in srgb,var(--cg-primary) 45%,transparent);
  background:var(--cg-primary-soft); color:var(--cg-ink);
}
/* 按钮横向排列：原来 6 个竖排要占 326px 高，是"标题画面占页面太大"的主因。
   现在一行排开、放不下自动换行，竖向只占 1~2 行。 */
.title-buttons{
  display:flex; flex-direction:row; flex-wrap:wrap;
  justify-content:center; align-items:center;
  gap:8px 10px;
  width:auto; max-width:min(680px,94vw);
  margin-top:clamp(4px,1vh,12px);
}
.title-buttons .btn{ flex:0 1 auto; min-width:104px; min-height:44px; padding:10px 16px; }
.title-buttons .btn-main{ min-width:136px; }
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:46px; padding:11px 18px;
  border-radius:14px; border:1px solid var(--cg-stroke);
  background:rgba(255,255,255,.07);
  color:var(--cg-ink); font-size:16px; letter-spacing:.06em;
  transition:transform .14s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.btn:hover:not(:disabled){ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3); }
.btn:active:not(:disabled){ transform:scale(.97); }
.btn:disabled{ opacity:.42; }
.btn-main{
  background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent));
  border-color:transparent; color:#16182a; font-weight:700;
  box-shadow:0 10px 26px color-mix(in srgb,var(--cg-primary) 32%,transparent);
}
.btn-main:hover:not(:disabled){ filter:brightness(1.08); background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent)); }
.btn-ghost{ background:rgba(255,255,255,.04); }
.btn-sm{ min-height:36px; padding:6px 12px; font-size:13px; border-radius:10px; letter-spacing:.02em; }
.title-foot{ position:relative; z-index:1; font-size:12px; color:var(--cg-ink-dim); opacity:.85; }
.title-warn{
  position:relative; z-index:1; max-width:min(560px,90vw);
  font-size:13px; line-height:1.7; color:#ffd9a3;
  border:1px dashed rgba(255,200,130,.5); border-radius:12px;
  background:rgba(255,180,90,.10); padding:10px 14px;
}

/* ==========================================================================
   3. 游戏画面：背景 / 立绘 / 对话框
   ========================================================================== */
#game-screen{ padding:0; }
.bg-layer{ position:absolute; inset:0; background:var(--cg-bg); }
.bg{
  position:absolute; inset:0;
  background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:0; transition:opacity .62s ease;
}
.bg.active{ opacity:1; }
.bg-vignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 24%,transparent 42%,rgba(0,0,0,.30) 100%);
}
.sprite-layer{ position:absolute; inset:0; pointer-events:none; }
.sprite-slot{
  position:absolute; bottom:calc(var(--cg-sprite-bottom) + var(--cg-pad-b));
  width:var(--cg-sprite-w); height:var(--cg-sprite-h);
  opacity:0; transform:translateY(34px) scale(.95);
  transition:opacity .38s ease,transform .38s cubic-bezier(.22,.68,.24,1);
  will-change:opacity,transform;
}
/* 选项阶段：立绘略微压暗后退，让选项成为视觉焦点 */
.sprite-layer{ transition:filter .28s ease; }
#game-screen[data-phase="choice"] .sprite-layer{ filter:blur(2px) brightness(.82); }
.sprite-slot.in{ opacity:1; transform:none; }
.sprite-slot.leaving{ opacity:0; transform:translateY(20px) scale(.97); }
.sprite-slot[data-pos="left"]{ left:calc(2vw + var(--cg-pad-l)); }
.sprite-slot[data-pos="center"]{ left:50%; margin-left:calc(var(--cg-sprite-w) / -2); }
.sprite-slot[data-pos="right"]{ right:calc(2vw + var(--cg-pad-r)); }
.sprite-inner{ position:relative; width:100%; height:100%; }
/* 渐变占位：把 gradient 里的颜色切成竖条格子，避免 innerHTML 内联 style 里出现逗号问题 */
.sprite-grain{ position:absolute; inset:0; display:flex; border-radius:inherit; overflow:hidden; }
.sprite-grain > i{ flex:1 1 0; }
.sprite-img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; object-position:bottom center;
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.5));
}
.sprite-slot[data-pos="right"] .sprite-img{ transform:scaleX(-1); }
.sprite-placeholder{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:46% 46% 20% 20% / 30% 30% 12% 12%;
  border:1px solid rgba(255,255,255,.26);
  box-shadow:inset 0 -34px 60px rgba(0,0,0,.22),0 16px 38px rgba(0,0,0,.36);
  overflow:hidden;
}
/* 立绘占位徽记：emoji 叠在柔和光晕上，让占位更像“角色”而不是一块纯色 */
.sprite-emoji{
  position:relative; z-index:2;
  display:grid; place-items:center;
  width:clamp(92px,15vh,164px); height:clamp(92px,15vh,164px);
  border-radius:50%;
  font-size:clamp(46px,8.4vh,92px); line-height:1;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.55) 60%,rgba(255,255,255,0));
  box-shadow:0 10px 34px rgba(0,0,0,.22),0 0 0 10px rgba(255,255,255,.14);
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.28));
  animation:bob 3.6s ease-in-out infinite alternate;
}
@keyframes bob{ from{ transform:translateY(-6px); } to{ transform:translateY(6px); } }
.sprite-name{
  position:absolute; z-index:3;
  left:50%; bottom:-4px; transform:translateX(-50%);
  font-size:12px; padding:2px 10px; border-radius:999px; white-space:nowrap;
  background:rgba(6,8,18,.6); border:1px solid var(--cg-stroke); color:var(--cg-ink-dim);
}

/* 对话框 */
.dialogue-box{
  position:absolute; z-index:30;
  left:calc(var(--cg-pad-l) + 2vw); right:calc(var(--cg-pad-r) + 2vw);
  bottom:calc(var(--cg-pad-b) + 1.5vh);
  min-height:min(30vh,230px);
  padding:var(--cg-dialog-pad);
  display:flex; flex-direction:column; justify-content:flex-end;
  border-radius:var(--cg-radius);
  border:1px solid var(--cg-stroke);
  background:linear-gradient(180deg,rgba(13,17,32,.95),rgba(7,9,18,.985));
  backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  box-shadow:0 18px 48px rgba(0,0,0,.5);
  cursor:pointer;
}
.dialogue-box::before{
  content:""; position:absolute; left:0; right:0; top:-1px; height:2px;
  background:linear-gradient(90deg,transparent,var(--cg-primary),transparent);
  opacity:.7; border-radius:2px;
}
.speaker-name{
  align-self:flex-start;
  margin:-6px 0 8px;
  padding:3px 14px;
  font-size:calc(var(--cg-dialog-font) * .84);
  font-weight:700; letter-spacing:.08em;
  border-radius:999px;
  background:var(--cg-primary-soft);
  border:1px solid color-mix(in srgb,var(--cg-primary) 55%,transparent);
  color:var(--cg-primary);
}
.dialogue-text{
  flex:1; min-height:3.4em;
  font-size:calc(var(--cg-dialog-font) * 1.12);
  line-height:1.78; letter-spacing:.02em;
  white-space:pre-wrap; word-break:break-word;
  overflow-y:auto; max-height:34vh;
}
.dialogue-box[data-narration="1"] .dialogue-text{
  font-style:italic; color:#d9e2ff; opacity:.95;
  text-align:center; padding:0 6%;
}
.dialogue-box[data-narration="1"]{ min-height:min(24vh,190px); }
.advance-mark{
  position:absolute; right:16px; bottom:10px;
  font-size:15px; color:var(--cg-primary); opacity:0;
  transition:opacity .2s ease;
}
.advance-mark.on{ opacity:1; animation:nudge 1.1s ease-in-out infinite; }
@keyframes nudge{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(4px); } }
.dialogue-box.dialogue-echo{ pointer-events:none; }
.dialogue-box.dialogue-echo .advance-mark{ display:none; }

/* 选项 */
/* 选项列表：默认浮在画面中部（横屏/桌面），并由 JS 写入 --choice-lift 精确避开对话框 */
#choice-list{
  position:absolute; z-index:40;
  left:50%; top:50%;
  transform:translate(-50%,calc(-50% - var(--choice-lift,0px)));
  width:min(560px,86vw);
  display:flex; flex-direction:column; align-items:stretch; gap:10px;
  pointer-events:none;
  animation:choiceIn .26s ease both;
}
@keyframes choiceIn{ from{ opacity:0; } to{ opacity:1; } }
.choice-prompt{
  text-align:center; font-size:clamp(13px,1.6vw,16px); color:var(--cg-ink);
  padding:8px 14px; border-radius:12px;
  background:rgba(5,7,15,.9); border:1px solid var(--cg-stroke);
  box-shadow:0 10px 26px rgba(0,0,0,.42);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.choice-btn{
  pointer-events:auto;
  position:relative;
  padding:13px 16px;
  border-radius:13px; border:1px solid rgba(255,255,255,.24);
  background:linear-gradient(120deg,rgba(18,22,42,.97),rgba(9,11,24,.98));
  color:var(--cg-ink); text-align:center; font-size:clamp(14px,1.7vw,16px);
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  transition:transform .15s ease,border-color .2s ease,background .2s ease;
}
.choice-btn:hover{
  transform:translateY(-2px);
  border-color:var(--cg-primary);
  background:linear-gradient(120deg,color-mix(in srgb,var(--cg-primary) 30%,rgba(9,11,24,.98)),rgba(9,11,24,.98));
}
.choice-btn:active{ transform:scale(.985); }
.choice-btn .choice-hint{
  display:block; margin-top:5px;
  font-size:12px; color:var(--cg-ink-dim);
}
.choice-btn .choice-idx{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:20px; height:20px; line-height:20px; border-radius:50%;
  font-size:11px; text-align:center; color:var(--cg-ink-dim);
  border:1px solid var(--cg-stroke);
}

/* 选项阶段的对话框：只作氛围提示，避免与选项文字重复 */
#dialogue-box[data-choice="1"]{ opacity:.5; min-height:min(20vh,150px); pointer-events:none; }
#dialogue-box[data-choice="1"] .advance-mark{ display:none; }
#dialogue-box[data-choice="1"] .dialogue-text{
  font-size:calc(var(--cg-dialog-font) * .92); color:var(--cg-ink-dim); text-align:center;
}

/* 快捷工具栏 */
.quick-bar{
  position:absolute; z-index:35;
  right:calc(var(--cg-pad-r) + 10px); top:calc(var(--cg-pad-t) + 8px);
  display:flex; gap:6px;
}
.quick-btn{
  width:38px; height:38px; border-radius:11px;
  display:grid; place-items:center; font-size:16px;
  border:1px solid var(--cg-stroke); background:rgba(8,10,20,.6);
  color:var(--cg-ink); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.quick-btn:hover{ background:rgba(255,255,255,.16); }
.quick-btn.on{
  background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent));
  color:#14162a; font-weight:700; border-color:transparent;
}
.chapter-chip{
  position:absolute; z-index:35;
  left:calc(var(--cg-pad-l) + 12px); top:calc(var(--cg-pad-t) + 10px);
  font-size:12px; padding:5px 12px; border-radius:999px;
  background:rgba(8,10,20,.6); border:1px solid var(--cg-stroke); color:var(--cg-ink-dim);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
/* v3：左上角音乐栏（与章节点并排，窄屏自动换行到下一行，不遮挡内容） */
#bgm-bar{
  position:absolute; z-index:36;
  left:calc(var(--cg-pad-l) + 12px); top:calc(var(--cg-pad-t) + 10px);
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  max-width:calc(100% - 120px); pointer-events:none;
}
#bgm-bar > *{ pointer-events:auto; }
/* 章节点有内容时（JS 打上 data-has-chapter），音乐栏换到第二行，两者不重叠 */
#game-screen[data-has-chapter="1"] #bgm-bar{ top:calc(var(--cg-pad-t) + 44px); }
.bgm-btn{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  font-size:16px; border:1px solid var(--cg-stroke); background:rgba(8,10,20,.6);
  color:var(--cg-ink); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.bgm-btn.on{ border-color:color-mix(in srgb,var(--cg-primary) 60%,transparent); box-shadow:0 0 14px color-mix(in srgb,var(--cg-primary) 30%,transparent); }
.bgm-btn.muted{ opacity:.72; }
.bgm-title{
  max-width:min(38vw,220px); height:28px; padding:0 12px; border-radius:999px;
  font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border:1px solid var(--cg-stroke); background:rgba(8,10,20,.6); color:var(--cg-ink-dim);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.bgm-title.hidden{ display:none; }
/* 音量滑块 */
.slider-wrap{ display:flex; align-items:center; gap:10px; flex:0 1 190px; justify-content:flex-end; }.slider{
  -webkit-appearance:none; appearance:none; flex:1 1 auto; height:22px; background:transparent;
  min-width:110px; cursor:pointer;
}
.slider::-webkit-slider-runnable-track{ height:6px; border-radius:999px; background:rgba(255,255,255,.16); }
.slider::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:16px; height:16px; margin-top:-5px;
  border-radius:50%; background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent));
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.slider::-moz-range-track{ height:6px; border-radius:999px; background:rgba(255,255,255,.16); }
.slider::-moz-range-thumb{
  width:16px; height:16px; border:0; border-radius:50%;
  background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent));
}
.slider-val{ flex:0 0 30px; text-align:right; font-size:12px; color:var(--cg-ink-dim); }
.bgm-now{ font-size:13px; color:var(--cg-ink); max-width:58%; text-align:right; word-break:break-all; }
.toast{
  position:absolute; z-index:80; left:50%; top:calc(var(--cg-pad-t) + 16px);
  transform:translate(-50%,-14px);
  padding:9px 18px; border-radius:999px;
  font-size:13px; background:rgba(8,10,20,.92); border:1px solid var(--cg-stroke);
  color:var(--cg-ink); opacity:0; pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
}
.toast.on{ opacity:1; transform:translate(-50%,0); }

/* ==========================================================================
   4. 结局画面
   ========================================================================== */
#ending-screen{
  align-items:center; justify-content:center;
  gap:16px; text-align:center; overflow-y:auto;
}
.ending-card{
  width:min(640px,90vw);
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:clamp(24px,4.4vh,44px) clamp(20px,4vw,40px);

  background:linear-gradient(180deg,rgba(10,13,26,.86),rgba(6,8,18,.94));

  animation:endingIn .7s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes endingIn{ from{ opacity:0; transform:translateY(26px) scale(.97); } to{ opacity:1; transform:none; } }
.ending-kind{

  padding:4px 14px; border-radius:999px;
  border:1px solid var(--cg-kind-color,var(--cg-primary));

}

#ending-screen[data-kind="normal"]{ --cg-kind-color:#8fb1ff; }
#ending-screen[data-kind="bad"]{ --cg-kind-color:#ff7b8a; }
.ending-title{
  margin:0; font-size:clamp(24px,4.6vw,40px); line-height:1.2; font-weight:800;
  color:var(--cg-kind-color,var(--cg-ink));
  text-shadow:0 8px 30px color-mix(in srgb,var(--cg-kind-color,var(--cg-primary)) 30%,transparent);
}
.ending-text{ margin:0; max-width:44ch; font-size:clamp(14px,1.7vw,17px); line-height:1.85; color:var(--cg-ink-dim); }
.ending-cond{
  max-width:46ch; font-size:12.5px; line-height:1.8; color:var(--cg-ink);
  padding:8px 14px; border-radius:12px;
  border:1px dashed color-mix(in srgb,var(--cg-kind-color,var(--cg-primary)) 55%,transparent);
  background:color-mix(in srgb,var(--cg-kind-color,var(--cg-primary)) 10%,transparent);
}
.ending-vars{ font-size:12px; color:var(--cg-ink-dim); opacity:.85; white-space:pre-wrap; }
.ending-actions{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:6px; }

/* ==========================================================================
   5. 模态面板（设置 / 图鉴 / 存档 / 历史）
   ========================================================================== */
.modal{
  position:absolute; inset:0; z-index:60;
  display:flex; align-items:center; justify-content:center;
  padding:calc(var(--cg-pad-t) + 12px) 14px calc(var(--cg-pad-b) + 12px);

  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  animation:fadeIn .18s ease both;
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.panel{
  width:min(620px,94vw); max-height:86vh;
  display:flex; flex-direction:column;
  border-radius:18px; border:1px solid var(--cg-stroke);

  box-shadow:0 26px 70px rgba(0,0,0,.6);
  animation:panelIn .24s cubic-bezier(.2,.7,.2,1) both;

.panel-head{

}
.panel-title{ margin:0; font-size:17px; letter-spacing:.08em; }
.panel-body{ padding:16px 18px; overflow-y:auto; }
.panel-foot{
  padding:12px 18px; border-top:1px solid var(--cg-stroke);
  display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;
}
.field{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 0; border-bottom:1px dashed rgba(255,255,255,.10);
}
.field:last-child{ border-bottom:0; }
.field-label{ font-size:14px; color:var(--cg-ink); display:flex; flex-direction:column; gap:3px; }
.field-note{ font-size:11.5px; color:var(--cg-ink-dim); }
.seg{ display:flex; gap:4px; padding:3px; border-radius:11px; background:rgba(255,255,255,.06); border:1px solid var(--cg-stroke); flex-wrap:wrap; justify-content:flex-end; }
.seg-btn{
  padding:6px 12px; border-radius:8px; border:0; background:transparent;
  color:var(--cg-ink-dim); font-size:13px; transition:all .16s ease;
}
.seg-btn.on{ background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent)); color:#14162a; font-weight:700; }
.switch{
  width:52px; height:28px; border-radius:999px; border:1px solid var(--cg-stroke);
  background:rgba(255,255,255,.10); position:relative; transition:background .2s ease; flex:0 0 auto;
}
.switch::after{
  content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
  background:#fff; transition:transform .2s ease;
}
.switch.on{ background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent)); }
.switch.on::after{ transform:translateX(24px); }
.slot-list{ display:flex; flex-direction:column; gap:10px; }
.slot{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px 14px; border-radius:14px;
  border:1px solid var(--cg-stroke); background:rgba(255,255,255,.045);
}
.slot-info{ flex:1 1 190px; min-width:150px; }
.slot-name{ font-size:14px; margin-bottom:3px; }
.slot-meta{ font-size:11.5px; color:var(--cg-ink-dim); line-height:1.5; }
.slot.empty .slot-name{ color:var(--cg-ink-dim); }
.slot-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.gallery-item{
  padding:14px; border-radius:14px; border:1px solid var(--cg-stroke);
  background:rgba(255,255,255,.05); min-height:104px;
  display:flex; flex-direction:column; gap:8px;
}
.gallery-item.locked{ opacity:.55; border-style:dashed; }
.gallery-item[data-kind="true"]{ --cg-kind-color:#ffd166; }
.gallery-item[data-kind="good"]{ --cg-kind-color:#7ee2a8; }
.gallery-item[data-kind="normal"]{ --cg-kind-color:#8fb1ff; }
.gallery-item[data-kind="bad"]{ --cg-kind-color:#ff7b8a; }
.gallery-kind{ font-size:11px; letter-spacing:.18em; color:var(--cg-kind-color,var(--cg-ink-dim)); }
.gallery-title{ font-size:15px; font-weight:700; }
.gallery-text{ font-size:12.5px; color:var(--cg-ink-dim); line-height:1.65; }
.gallery-date{ margin-top:auto; font-size:11px; color:var(--cg-ink-dim); opacity:.8; }
.history-list{ display:flex; flex-direction:column; gap:12px; }
.history-entry{ padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.07); }
.history-who{ font-size:12.5px; font-weight:700; margin-bottom:5px; letter-spacing:.05em; }
.history-who.narr{ color:var(--cg-ink-dim); font-style:italic; }
.history-text{ font-size:14px; line-height:1.75; color:var(--cg-ink); white-space:pre-wrap; word-break:break-word; }
.empty-tip{ text-align:center; color:var(--cg-ink-dim); font-size:13.5px; padding:24px 10px; line-height:1.8; }
.var-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.var-table th,.var-table td{ text-align:left; padding:6px 8px; border-bottom:1px solid rgba(255,255,255,.08); }
.var-table th{ color:var(--cg-ink-dim); font-weight:500; }

/* ==========================================================================
   5.1 v2 新增：封面图 / 好感度面板 / 旋转提示
   ========================================================================== */

/* --- 封面图（标题画面背景，叠加暗色渐变保证文字可读） --- */
#cover-image{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background-position:center center; background-size:cover; background-repeat:no-repeat;
  opacity:0; transition:opacity .5s ease;
}
#cover-image.on{ opacity:1; }
#title-screen.has-cover .title-aurora{ opacity:.35; }
/* 封面遮罩 = 上下两条渐变带。
   注意**中间必须完全透明**：之前用一层椭圆把中央压暗，用户的原话是
   "看不清封面、黑黢黢的很脏"——照片中央糊一团暗色看上去就是脏印子。
   现在只有顶部（标题）和底部（简介+按钮）两端有渐变，封面主体不加任何蒙版。 */
.cover-scrim{
  position:absolute; inset:0; z-index:0; pointer-events:none; display:none;
  background:
    linear-gradient(180deg,
      rgba(6,8,18,.80) 0%,
      rgba(6,8,18,.62) 10%,
      rgba(6,8,18,.30) 22%,
      rgba(6,8,18,.08) 32%,
      rgba(6,8,18,0) 40%),
    linear-gradient(0deg,
      rgba(6,8,18,.90) 0%,
      rgba(6,8,18,.82) 11%,
      rgba(6,8,18,.68) 22%,
      rgba(6,8,18,.50) 33%,
      rgba(6,8,18,.26) 43%,
      rgba(6,8,18,.06) 51%,
      rgba(6,8,18,0) 58%);
}
/* 简介压在照片上时最多 2 行：再长会顶到渐变较浅的区域，既读不清又占地方 */
.title-synopsis{
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
#title-screen.has-cover .cover-scrim{ display:block; }

.aff-noromance{
  margin-top:8px; font-size:12.5px; letter-spacing:.02em;
  color:var(--cg-ink-dim);
  border:1px dashed color-mix(in srgb,var(--cg-ink-dim) 45%,transparent);
  border-radius:10px; padding:6px 10px; display:inline-block;
}
.aff-noromance-row{ opacity:.9; }

/* --- 好感度面板 --- */
.aff-list{ display:flex; flex-direction:column; gap:14px; }
.aff-row{
  display:flex; gap:14px; align-items:stretch;
  padding:12px; border-radius:16px;
  border:1px solid var(--cg-stroke);
  background:linear-gradient(120deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
}
.aff-portrait{
  position:relative; flex:0 0 auto;
  width:104px; height:132px; border-radius:14px; overflow:hidden;
  background:rgba(0,0,0,.28); border:1px solid var(--cg-stroke);
}
.aff-portrait .sprite-inner{ position:absolute; inset:0; }
.aff-portrait .sprite-img{ object-position:center top; }
.aff-portrait .sprite-placeholder{ border-radius:12px; }
.aff-portrait .sprite-emoji{
  width:clamp(46px,8vh,72px); height:clamp(46px,8vh,72px);
  font-size:clamp(24px,4.4vh,40px); box-shadow:0 6px 18px rgba(0,0,0,.24),0 0 0 6px rgba(255,255,255,.12);
}
.aff-portrait .sprite-name{ display:none; }
.aff-portrait-nav{
  position:absolute; inset:auto 0 0 0; z-index:4;
  display:flex; align-items:center; justify-content:space-between; gap:4px;
  padding:3px 4px; background:linear-gradient(180deg,transparent,rgba(4,6,14,.82));
}
.aff-portrait-nav button{
  min-width:26px; height:24px; border-radius:8px; border:1px solid var(--cg-stroke);
  background:rgba(8,10,20,.7); color:var(--cg-ink); font-size:12px; line-height:1;
}
.aff-portrait-nav button:disabled{ opacity:.35; }
.aff-portrait-nav .aff-sprite-name{ font-size:10.5px; color:var(--cg-ink-dim); }
.aff-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:8px; }
.aff-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.aff-name{ font-size:16px; font-weight:700; }
.aff-role{
  font-size:11.5px; padding:2px 9px; border-radius:999px;
  border:1px solid var(--cg-stroke); background:rgba(255,255,255,.07); color:var(--cg-ink-dim);
}
.aff-profile{ font-size:12.5px; line-height:1.65; color:var(--cg-ink-dim); }
.aff-meter-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.aff-meter-label{ font-size:12px; color:var(--cg-ink-dim); }
.aff-meter-value{ font-size:14px; font-weight:700; letter-spacing:.02em; }
.aff-meter-value small{ font-size:11px; font-weight:400; color:var(--cg-ink-dim); margin-left:3px; }
.aff-bar{
  position:relative; height:12px; border-radius:999px; overflow:hidden;
  background:rgba(255,255,255,.10); border:1px solid var(--cg-stroke);
}
.aff-bar > i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--cg-primary),var(--cg-accent));
  box-shadow:0 0 14px color-mix(in srgb,var(--cg-primary) 45%,transparent);
  transition:width .45s cubic-bezier(.25,.7,.3,1);
}
.aff-foot-note{ margin-top:12px; font-size:11.5px; color:var(--cg-ink-dim); line-height:1.7; }

/* --- 手机竖屏旋转提示（非阻塞，可关闭） --- */
#rotate-hint{
  position:fixed; z-index:70; display:none;
  left:calc(var(--cg-pad-l) + 10px); right:calc(var(--cg-pad-r) + 10px);
  bottom:calc(var(--cg-pad-b) + 10px);
  flex-direction:column; gap:6px;
  padding:11px 13px; border-radius:14px;
  border:1px solid var(--cg-stroke);
  background:rgba(8,10,20,.92);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 14px 36px rgba(0,0,0,.5);
  animation:slideUp .28s ease both;
}
@keyframes slideUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
#rotate-hint .rot-row{ display:flex; align-items:center; gap:8px; }
#rotate-hint .rot-row b{ font-size:13.5px; }
#rotate-hint .rot-icon{ font-size:19px; flex:0 0 auto; animation:rotSpin 2.6s ease-in-out infinite; }
@keyframes rotSpin{ 0%,60%{ transform:rotate(0); } 80%,100%{ transform:rotate(90deg); } }
#rotate-hint .rot-note{ margin:0; font-size:12px; line-height:1.55; color:var(--cg-ink-dim); }
#rotate-hint .rot-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.rot-btn{
  flex:1 1 auto; min-height:36px; padding:7px 12px; border-radius:10px; font-size:12.5px;
  border:1px solid var(--cg-stroke); background:rgba(255,255,255,.08); color:var(--cg-ink);
  white-space:nowrap;
}
.rot-btn-main{
  border-color:transparent; font-weight:700; color:#14162a;
  background:linear-gradient(120deg,var(--cg-primary),var(--cg-accent));
}
/* 仅在「手机竖屏（窄屏）」显示，横屏或宽屏自动隐藏，无需 JS 参与 */
@media (orientation:portrait) and (max-width:520px){
  #rotate-hint:not(.dismissed){ display:flex; }
  /* 竖屏空间紧张：提示条收紧为「标题行 + 按钮行」，避免压住对话台词 */
  #rotate-hint{ padding:8px 10px; gap:6px; }
  #rotate-hint .rot-row b{ font-size:12.5px; }
  #rotate-hint .rot-icon{ font-size:16px; }
  #rotate-hint .rot-note{ display:none; }
  .rot-btn{ min-height:32px; padding:5px 10px; font-size:12px; }
}
/* 竖屏且屏幕很矮时：提示条再缩小一档，优先保证台词可读 */
@media (orientation:portrait) and (max-width:520px) and (max-height:700px){
  #rotate-hint .rot-row{ display:none; }
  #rotate-hint{ padding:7px 9px; }
}

/* ==========================================================================
   6. 响应式：竖屏 / 横屏 / 窄屏 / 平板 / 桌面
   统一通过 CSS 变量覆盖尺寸，避免各组件重复写媒体查询
   ========================================================================== */

/* --- 横屏（手机横屏、平板横屏、桌面矮窗口）：对话框变矮、立绘变矮 --- */
@media (orientation:landscape) and (max-height:620px){
  :root{
    --cg-sprite-h:48vh;
    --cg-sprite-bottom:8vh;
    --cg-sprite-w:min(26vw,250px);
    --cg-dialog-pad:12px 20px;
    --cg-dialog-font:17px;
  }
  .dialogue-box{ min-height:min(34vh,180px); max-height:52vh; }
  .dialogue-text{ min-height:2.6em; max-height:26vh; font-size:calc(var(--cg-dialog-font) * 1.06); }
  .dialogue-box[data-narration="1"]{ min-height:min(26vh,140px); }
  .sprite-emoji{ font-size:clamp(44px,15vh,110px); }
  .title-card{ max-height:calc(var(--cg-app-h) - 16px); padding:8px 16px; }
  /* 横屏矮屏：按钮一行放得下就一行，放不下才换行 */
  .title-buttons{ max-width:min(760px,94vw); gap:6px 8px; }
  .title-buttons .btn{ flex:0 1 auto; min-width:88px; min-height:38px; padding:7px 12px; font-size:14px; }
  .title-main{ font-size:clamp(20px,3.2vw,30px); }
  .title-synopsis{ display:none; }        /* 矮屏优先保证按钮和标题可见 */
  #title-screen{ gap:6px; }
  .ending-card{ padding:18px 22px; }
}

/* --- 手机竖屏（≤430px）：立绘居中偏上，对话框占满宽度 --- */
@media (orientation:portrait) and (max-width:430px){
  :root{
    --cg-sprite-h:42vh;
    --cg-sprite-bottom:26vh;   /* 抬高立绘：脸在选项之上，身体与对话框自然衔接 */
    --cg-dialog-pad:14px 16px;
    --cg-dialog-font:17px;
  }
  .sprite-slot{ --cg-sprite-w:min(60vw,270px); }
  .sprite-slot[data-pos="left"]{ left:calc(4vw + var(--cg-pad-l)); }
  .sprite-slot[data-pos="right"]{ right:calc(4vw + var(--cg-pad-r)); }
  .sprite-slot[data-pos="center"]{ margin-left:calc(min(60vw,270px) / -2); }
  .sprite-emoji{ font-size:clamp(56px,10vh,104px); }
  .dialogue-box{ left:calc(var(--cg-pad-l) + 8px); right:calc(var(--cg-pad-r) + 8px); min-height:min(34vh,220px); }
  .dialogue-text{ max-height:38vh; }
  .quick-btn{ width:34px; height:34px; font-size:15px; }
  #choice-list{ width:min(94vw,520px); gap:10px; }
  .choice-btn{ padding:12px 14px; }
  .panel{ width:96vw; max-height:90vh; }
  .gallery-grid{ grid-template-columns:repeat(auto-fill,minmax(136px,1fr)); }
  .title-card{ width:94vw; padding:12px 14px; }
  .title-buttons{ max-width:94vw; gap:6px 7px; }
  /* 小屏要挤出封面净空：按钮压扁一档 */
  .title-buttons .btn{ min-width:0; flex:1 1 41%; min-height:35px; padding:6px 9px; font-size:13px; }
  .title-buttons .btn-main{ flex-basis:100%; }
  .title-head{ gap:5px; }
  .title-synopsis{ font-size:12.5px; line-height:1.6; }
}

/* --- 平板（768×1024 等）：立绘略大，对话框居中限宽 --- */
@media (min-width:600px) and (max-width:900px){
  :root{ --cg-sprite-h:54vh; --cg-sprite-bottom:18vh; }
  .sprite-slot{ --cg-sprite-w:min(34vw,300px); }
  .dialogue-box{ left:calc(var(--cg-pad-l) + 4vw); right:calc(var(--cg-pad-r) + 4vw); }
}

/* --- 窄高竖屏（如 375×667）：字号与留白更紧凑 --- */
@media (orientation:portrait) and (max-height:700px){
  .dialogue-box{ min-height:min(32vh,200px); }
  .dialogue-text{ max-height:30vh; }
  #title-screen{ justify-content:flex-start; padding-top:calc(var(--cg-pad-t) + 18px); }
}

/* --- 超宽桌面：内容居中不拉散 --- */
@media (min-width:1400px){
  :root{ --cg-sprite-h:56vh; --cg-sprite-bottom:14vh; }
  .sprite-slot{ --cg-sprite-w:min(26vw,360px); }
  .dialogue-box{ left:calc(var(--cg-pad-l) + max(2vw,(100vw - 1280px) / 2)); right:calc(var(--cg-pad-r) + max(2vw,(100vw - 1280px) / 2)); }
}

/* --- 低高度横屏（折叠屏 / 桌面矮窗）：进一步压缩 --- */
@media (orientation:landscape) and (max-height:430px){
  /* 立绘压到对话框之上，避免被对话框硬切 */
  :root{ --cg-sprite-h:52vh; --cg-sprite-bottom:19vh; --cg-sprite-w:min(30vw,230px); --cg-dialog-font:15px; }
  .dialogue-box{ min-height:0; padding:10px 16px; bottom:calc(var(--cg-pad-b) + 6px); }
  .dialogue-text{ min-height:2.2em; max-height:22vh; }
  .chapter-chip{ display:none; }
  .sprite-emoji{ font-size:clamp(38px,12vh,80px); }
}

/* --- 触屏设备：按钮加大，去掉 hover 抖动 --- */
@media (hover:none){
  .choice-btn:hover{ transform:none; }
  .quick-btn{ width:42px; height:42px; }
}

/* --- 动效偏好：尊重系统「减少动态效果」 --- */
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.06s !important; }
  .title-aurora{ animation:none; }
}

/* --- 左下角署名：海鸟umidori制作 ---
   放在对话框左下角的「内边距空档」里：对话框 padding 为 18px 22px，
   最后一行文字的下沿在框底往上 18px 处，所以这条 11px 小字不会压到台词。
   z-index 31：高于对话框(30)、低于弹窗(60)；pointer-events:none 绝不挡点击。 */
.brand-tag{
  position:absolute;
  z-index:31;
  left:calc(var(--cg-pad-l) + 12px);
  bottom:calc(var(--cg-pad-b) + 4px);
  font-size:11px;
  line-height:1.2;
  letter-spacing:.06em;
  color:rgba(228,234,255,.62);
  text-shadow:0 1px 4px rgba(0,0,0,.85);
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
  white-space:nowrap;
}
.brand-tag b{ color:rgba(255,143,177,.85); font-weight:600; }
@media (max-width:480px){
  .brand-tag{ font-size:10px; left:calc(var(--cg-pad-l) + 10px); bottom:calc(var(--cg-pad-b) + 3px); }
}
/* 竖屏手机上旋转提示条(z-index:70, fixed)也贴在底部，会盖住署名。
   把它抬高 12px 给署名让位——两者都在底部左下角，必须错开。 */
@media (max-width:520px) and (orientation:portrait){
  #rotate-hint{ bottom:calc(var(--cg-pad-b) + 24px); }
  .brand-tag{ bottom:calc(var(--cg-pad-b) + 4px); }
  /* 标题画面的按钮也在底部，会被提示条压住 —— 给标题画面留出提示条的高度 */
  #title-screen{ padding-bottom:104px; }
}
/* 横屏矮屏：对话框贴底(6px)且内边距只有 10px，署名会压到台词，
   所以这里给对话框多留 14px 底部内边距，把署名安置进空出来的位置。 */
@media (max-height:500px){
  .brand-tag{ bottom:calc(var(--cg-pad-b) + 7px); font-size:10px; }
  .dialogue-box{ padding-bottom:24px; }
}


/* ══════════════ 独立插图（cg） ══════════════ */
#cg-view{ position:fixed; inset:0; z-index:880; display:grid; place-items:center;
  background:rgba(4,6,12,.94); cursor:pointer; }
#cg-view.hidden{ display:none; }
#cg-view img{ max-width:100vw; max-height:100vh; object-fit:contain; display:block;
  box-shadow:0 20px 70px rgba(0,0,0,.7); animation:cgIn .35s ease-out; }
@keyframes cgIn{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:none; } }
.cg-caption{ position:absolute; left:0; right:0; bottom:5%; text-align:center; padding:0 8%;
  color:#ffe9b8; font-size:15px; text-shadow:0 2px 10px rgba(0,0,0,.9); }
.cg-caption.hidden{ display:none; }
.cg-hint{ position:absolute; right:3%; bottom:3%; color:rgba(255,255,255,.55); font-size:13px;
  animation:cgPulse 1.8s ease-in-out infinite; }
@keyframes cgPulse{ 50%{ opacity:.35; } }

/* 不可攻略但影响结局的角色，数值条旁边挂个小标签 */
.aff-tag{ margin-left:6px; padding:1px 6px; border-radius:99px; font-style:normal; font-size:11px;
  background:rgba(255,209,102,.18); color:#ffd166; border:1px solid rgba(255,209,102,.4); }
/* ══════════════ 小游戏：赛跑 ══════════════ */
#minigame{ position:fixed; inset:0; z-index:900; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  background:radial-gradient(circle at 50% 26%, #1d2444, #080b15 72%); }
#minigame.hidden{ display:none; }
.mg-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px;
  font-size:14px; letter-spacing:.05em; }
.mg-title{ font-weight:700; color:#ffe08a; }
.mg-lap{ color:#cfe0ff; font-variant-numeric:tabular-nums; }
/* 三圈进度：跑完的点亮成金色，当前圈的那颗在跳，没到的暗着 */
.mg-laps{ display:flex; align-items:center; gap:10px; }
.mg-lapdot{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.32);
  background:transparent; transition:background .25s, border-color .25s, transform .25s; }
.mg-lapdot.done{ background:#ffd166; border-color:#ffd166; box-shadow:0 0 10px rgba(255,209,102,.7); }
.mg-lapdot.now{ border-color:#ffd166; animation:mgLapPulse 1s ease-in-out infinite; }
@keyframes mgLapPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.32); opacity:.65; } }
.mg-body{ position:relative; display:grid; place-items:center; min-height:0; overflow:hidden; }
.mg-stage{ position:relative; height:min(100%,82vh); aspect-ratio:779/1000; }
.mg-track{ width:100%; height:100%; object-fit:contain; display:block;
  border-radius:16px; box-shadow:0 18px 60px rgba(0,0,0,.55); }
.mg-runner{ position:absolute; width:16%; transform:translate(-50%,-50%); will-change:left,top;
  pointer-events:none; }
.mg-runner.hidden{ display:none; }
.mg-runner img{ width:100%; display:block; filter:drop-shadow(0 5px 10px rgba(0,0,0,.5)); }
.mg-runner.tired img{ filter:drop-shadow(0 5px 10px rgba(0,0,0,.5)) saturate(.7) brightness(.92); }
.mg-runner.tired{ width:23%; }          /* 躺姿那张是宽横图，同宽度会显得又细又小 */
.mg-runner.phase2{ width:18%; }         /* 忍者那张本身构图更"高"，稍微放大一点才压得住场 */
.mg-runner.phase2 img{ filter:drop-shadow(0 0 16px rgba(168,92,255,.85)); }
.mg-runner.winner{ animation:mgWin .55s ease-out 3; }
@keyframes mgWin{ 50%{ transform:translate(-50%,-108%) scale(1.18); } }
.mg-cutin{ position:absolute; z-index:50; left:0; right:0; bottom:-2%; display:flex; align-items:flex-end;
  justify-content:center; pointer-events:none; opacity:0; transform:translateY(34px);
  transition:opacity .35s ease, transform .35s ease; }
.mg-cutin.hidden{ display:none; }
.mg-cutin.show{ opacity:1; transform:none; }
.mg-cutin img{ width:min(600px,74vw); filter:drop-shadow(0 12px 34px rgba(0,0,0,.65)); }
.mg-cutin-text{ position:absolute; bottom:6%; padding:6px 14px; border-radius:99px;
  background:rgba(8,11,21,.78); border:1px solid rgba(255,255,255,.16);
  color:#ffe6a8; font-size:14px; white-space:nowrap; }
.mg-result{ position:absolute; z-index:60; inset:0; display:grid; place-items:center; background:rgba(6,9,18,.74); }
.mg-result.hidden{ display:none; }
.mg-card{ text-align:center; padding:26px 32px; border-radius:18px;
  background:rgba(16,20,37,.96); border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 70px rgba(0,0,0,.6); }
.mg-card-title{ font-size:13px; letter-spacing:.4em; color:#9fb0d8; }
.mg-card-who{ margin:10px 0 18px; font-size:24px; font-weight:700; color:#ffe08a; }
.mg-foot{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px 16px 16px; }
.mg-hint{ color:#9fb0d8; font-size:13px; }
.mg-bar{ width:min(420px,78vw); height:8px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
.mg-bar i{ display:block; height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg,#ffd166,#ff7ab6); transition:width .08s linear; }
@media (max-width:700px){ .mg-runner{ width:17%; } .mg-head{ font-size:13px; } }

eholder":{"emoji":"👤","gradient":"linear-gradient(160deg, hsl(94 80% 82%), hsl(154 70% 62%))"},"romanceable":false,"affectionKey":"affection.gangzi","affectionLabel":"好感度","showAffection":true,"spriteScale":1,"spriteX":0,"spriteY":0},{"id":"houzi","name":"猴子","color":"#9fd47f","role":"三区兄弟","profile":"三区最瘦的那个，风大的时候会被吹到隔壁学校去。最大的爱好是挑衅刚子。","sprites":{"default":"assets/a-4944432b3eb86e3c.webp"},"placeholder":{"emoji":"👤","gradient":"linear-gradient(160deg, hsl(94 80% 82%), hsl(154 70% 62%))"},"romanceable":false,"affectionKey":"affection.houzi","affectionLabel":"好感度","showAffection":true,"spriteScale":1,"spriteX":0,"spriteY":0},{"id":"lizhuren","name":"李主任","color":"#c9a0ff","role":"教导主任","profile":"永远在笑。他不吼人，不拍桌子，只会说「来我办公室坐坐」。","sprites":{"s2":"assets/a-f8a6225b09142854.webp"},"placeholder":{"emoji":"👤","gradient":"linear-gradient(160deg, hsl(141 80% 82%), hsl(201 70% 62%))"},"romanceable":false,"affectionKey":"","affectionLabel":"","spriteScale":1,"spriteX":0,"spriteY":0},{"id":"me","name":"我","color":"#e8e8f0","role":"三区第三个人","profile":"无名，无性别指向。爱张罗，闲不住，吐槽是习惯。","sprites":{},"placeholder":{"emoji":"👤","gradient":"linear-gradient(160deg, hsl(47 80% 82%), hsl(107 70% 62%))"},"romanceable":false,"affectionKey":"","affectionLabel":"","spriteScale":1.6,"spriteX":0,"spriteY":0,"noStage":true},{"id":"passerby","name":"路人","color":"#9aa0aa","role":"路过的人","profile":"操场上的选手、走廊上的同学、医务点前的学生。","sprites":{"s1":"assets/a-e674f24ebb06cb10.webp"},"placeholder":{"emoji":"🧍","gradient":"linear-gradient(160deg,#cfd6e2,#8e97a8)"},"romanceable":false,"affectionKey":"","affectionLabel":"","spriteScale":1,"spriteX":0,"spriteY":0},{"id":"jiahao","name":"嘉豪","color":"#ff6a6a","role":"二班的","profile":"隔壁班的短跑选手。话不多，笑起来很欠揍。跑起来像换了个人。","sprites":{"default":"assets/a-857844be6b16f7ae.webp","special":"assets/a-b6461b72a3488026.webp","s3":"assets/a-c2b1c7b11224f458.webp","s4":"assets/a-16ec9fc22c5f3b55.webp"},"placeholder":{"emoji":"👤","gradient":"linear-gradient(160deg, hsl(94 80% 82%), hsl(154 70% 62%))"},"romanceable":false,"affectionKey":"","affectionLabel":"","spriteScale":1,"spriteX":0,"spriteY":0},{"id":"jianghainiao","name":"酱海鸟","color":"#8fd6ff","role":"李杰的父亲","profile":"黑皮夹克，领子永远立着。话少，做事一板一眼，偶尔冒出一句让人没法接的。","sprites":{"default":"assets/a-41c475c56b2f2c24.webp"},"placeholder":{"emoji":"👤","gradient":"linear-gradient(160deg, hsl(141 80% 82%), hsl(201 70% 62%))"},"romanceable":false,"affectionKey":"","affectionLabel":"","spriteScale":1,"spriteX":0,"spriteY":0},{"id":"char11","name":"张校长","color":"#ff8fb1","role":"校长","profile":"","sprites":{"s1":"assets/a-143b0d51d1f46307.webp"},"placeholder":{"emoji":"👤","gradient":"linear-gradient(160deg,#ffd7e6,#b28cff)"},"romanceable":false,"affectionKey":"","affectionLabel":"","spriteScale":1,"spriteX":0,"spriteY":0},{"id":"char12","name":"张贵妃","color":"#ff8fb1","role":"路人","profile":"","sprites":{"s1":"assets/a-485b6c3f1c7fa479.webp"},"placeholder":{"emoji":"👤","gradient":"linear-gradient(160deg,#ffd7e6,#b28cff)"},"romanceable":false,"affectionKey":"","affectionLabel":"","spriteScale":1,"spriteX":0,"spriteY":0}],"backgrounds":[{"id":"classroom","name":"教室","css":"linear-gradient(180deg, hsl(0 55% 78%), hsl(40 45% 55%))","image":"assets/a-7985136e8533db9b.jpg"},{"id":"playground","name":"操场","css":"linear-gradient(180deg, hsl(67 55% 78%), hsl(107 45% 55%))","image":"assets/a-7402ce08b1fe7583.jpg"},{"id":"corridor","name":"走廊","css":"linear-gradient(180deg, hsl(134 55% 78%), hsl(174 45% 55%))","image":"assets/a-d881faa92b93917f.jpg"},{"id":"office","name":"教务处","css":"linear-gradient(180deg, hsl(201 55% 78%), hsl(241 45% 55%))","image":"assets/a-22ebe26bd32ee620.jpg"},{"id":"rooftop","name":"天台","css":"linear-gradient(180deg, hsl(268 55% 78%), hsl(308 45% 55%))","image":"assets/a-1bf4035ffae77ae3.jpg"},{"id":"gate","name":"学校大门","css":"linear-gradient(180deg, hsl(335 55% 78%), hsl(15 45% 55%))","image":"assets/a-1c51dfc9fc324a22.jpg"},{"id":"road","name":"放学路上","css":"linear-gradient(180deg, hsl(42 55% 78%), hsl(82 45% 55%))","image":"assets/a-9a5515e3f27bbff8.jpg"},{"id":"lakeside","name":"三区空地","css":"linear-gradient(180deg, hsl(109 55% 78%), hsl(149 45% 55%))","image":"assets/a-8136e61188c5b4a7.jpg"},{"id":"canteen","name":"食堂","css":"linear-gradient(180deg,#ffd9a8,#b87a3e)","image":"assets/a-976232cd9d908a35.jpg"},{"id":"restaurant","name":"校旁小饭馆","css":"linear-gradient(180deg,#ffcf9e,#7d4f33)","image":"assets/a-e51a327369de579a.jpg"}],"scenes":[{"id":"0-1","chapter":1,"name":"开战","background":"classroom","bgm":"assets/a-3f84367b70b00c06.m4a","lines":[{"type":"narration","text":"早自习前的教室。有的人在抄作业，有的人在补觉。"},{"type":"narration","text":"三组最后排，今天的战争已经打响了。"},{"type":"dialogue","speaker":"gangzi","text":"猴子你刚才说什么？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"我说牛魔了我说，扫码了天天抄我作业，每天晚上不知道干嘛去了","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那咋了，受着呗。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"受你麻痹","pose":"left","sprite":"default","enter":false,"exit":true,"voice":"assets/a-4f04eea3a7be3882.mp3"},{"type":"narration","text":"刚子是我们三区兄弟里体积最大的一位。中等个头，横向发展得很有诚意。"},{"type":"narration","text":"他有双重人格。"},{"type":"narration","text":"平时那个没心没肺 天天活的跟个扎啤似的"},{"type":"narration","text":"另一个人格……"},{"type":"narration","text":"也是个扎啤"},{"type":"narration","text":"这就是我每天早上要面对的。别人家的高中生活是青春疼痛文学，我的是动物世界。"},{"type":"dialogue","speaker":"houzi","text":"天天就叫人受着受着 那你胖着呗","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"猴子是咱几个最瘦的那个。风大的时候我总担心他被吹到隔壁学校去。"},{"type":"narration","text":"他最大的爱好是挑衅刚子，最大的成就也是挑衅刚子。"},{"type":"dialogue","speaker":"gangzi","text":"我看你是又想被我调教了","pose":"center","sprite":"default","enter":false,"exit":true,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"停。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我把手按在两人中间的桌子上。"},{"type":"dialogue","speaker":"me","text":"比划可以。先立规矩——输的人今天中午给对方打饭，打满","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"先把规矩立住了 路才能越走越宽","pose":"center","sprite":"default","enter":true,"exit":false},{"type":"dialogue","speaker":"houzi","text":"这死猪饭卡刷的我烧心","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那咋了，受着呗。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"两人同时伸手来抓我。就在这时候，教室后门传来一声不轻不重的咳嗽。"},{"type":"dialogue","speaker":"zhouyong","text":"吵什么。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"周勇。我们的班主任。衬衫扣子永远扣到最上面那颗。"},{"type":"narration","text":"脸上的表情长期维持在你们这群人真是够了但我懒得说。"},{"type":"narration","text":"他走进来，没看刚子和猴子，先把讲台上歪掉的粉笔盒摆正了。"},{"type":"dialogue","speaker":"zhouyong","text":"早自习还没开始。你们还有几分钟，决定是继续吵，还是把昨天的物理卷子拿出来。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"老师，是他先——","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"zhouyong","text":"我没问谁先。我问你们打算干什么。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"houzi","text":"……拿卷子。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"嗯。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他点点头，转身往外走。走到门口停了一下。"},{"type":"dialogue","speaker":"zhouyong","text":"刚子，你昨天在走廊跑步的事，我当没看见。下次要跑，别在我值班的时候跑。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"哎！谢谢老师！","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"这就是周勇。他不会说你们别吵了，他只会让你自己觉得再吵下去很没意思。"},{"type":"narration","text":"他也不会真抓你，只要你不越过那条线。线在哪他说了算，"},{"type":"narration","text":"但你别贴上去，他就当你是空气。"},{"type":"narration","text":"据说十班是全年级最乱的角落。真正的乱，是周勇默许范围内的乱。这人把睁一只眼闭一只眼练成了艺术。"},{"type":"narration","text":"那我就在他闭眼的时候，多干点正事。"},{"type":"narration","text":"刚子和猴子果然乖乖掏出了卷子。"},{"type":"narration","text":"同时，前排传来一声极轻的、东西落桌的声音。"},{"type":"narration","text":"那是包薯片。悄无声息地出现在我桌角。"},{"type":"narration","text":"递它的人正襟危坐，头都没回。"},{"type":"dialogue","speaker":"lijie","text":"……看什么看。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"me","text":"我还没说话呢。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你呼吸声太大了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"narration","text":"李杰，我的前桌。班级最嫩之人，对待所有人都一副表情。"},{"type":"narration","text":"说话像带刺的玫瑰——但那是玫瑰啊，刺下面是花瓣的。"},{"type":"narration","text":"比如现在这包薯片，番茄味，是他上周随口说过还行的口味。"},{"type":"narration","text":"他从来不承认自己在照顾人。他觉得那是顺手。你要是道谢，他说谁给你了，掉你桌上的。"},{"type":"narration","text":"你要是不道谢，他能用后背对着你整天，后背上写着几个大字：我很在意。"},{"type":"narration","text":"我把薯片塞进抽屉，压着嗓子说了句。"},{"type":"dialogue","speaker":"me","text":"谢了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……嗯。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"narration","text":"他没回头。但翻书的声音突然变得很大声。"},{"type":"narration","text":"耳朵红没红我没看清。反正他在装，我装作没看出来。这人真该去学一门叫人话的外语。"},{"type":"narration","text":"教室前门被推开。穿着运动鞋、抱着教案、走路带风的那位进来了。"},{"type":"dialogue","speaker":"duxiaokui","text":"Good morning 各位——！","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-2697302e926b56fb.mp3"},{"type":"narration","text":"杜小葵，我们的英语老师。四十七八岁，头发总是有点乱，笑起来眼睛弯弯的。"},{"type":"narration","text":"他往讲台上一站，整个教室的空气都松了一格。"},{"type":"dialogue","speaker":"duxiaokui","text":"今天讲虚拟语气。虚拟语气是什么？就是如果我昨天背了单词，我今天就不用站在这儿了 ——这个句式，就叫虚拟语气。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-ef37ae5807e2d022.mp3"},{"type":"dialogue","speaker":"houzi","text":"老师，那如果我没抄刚子的作业我就不会错五个，算吗？","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"算。而且时态用得不对——你昨天要是真没抄，你错的是八个，不是五个。","pose":"left","sprite":"default","enter":false,"exit":true,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"全班笑了。刚子笑得最大声，笑着笑着想起来猴子抄的是他的，"},{"type":"narration","text":"笑声卡在半路，变成一声很像鸭子叫的嘎。"},{"type":"dialogue","speaker":"duxiaokui","text":"好了好了。三区的三位，今天下课来办公室走一趟，我给你们仨的作文各写了评语，你们会喜欢的。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-3511105bdbc1e7d1.mp3"},{"type":"narration","text":"杜老师的你们会喜欢，通常意味着你们会被公开处刑。但他每次都留了余地，让处刑变成了段子。这种分寸感，说实话我在很多大人身上都没见过。"},{"type":"choice","prompt":"接话吗？","options":[{"text":"老师，那抄作业的时态，是不是该用过去完成时？","goto":"0-1-c1","ending":"","effects":{"affection.duxiaokui":5}},{"text":"低头装死。","goto":"0-1-c2","ending":"","effects":{"affection.duxiaokui":0}}]}],"next":"1-1","bgmName":"日常","bgmLoop":true},{"id":"1-1","chapter":1,"name":"李杰不想出汗","background":"classroom","bgm":"assets/a-a17f7ec9fc74d413.m4a","lines":[{"type":"narration","text":"运动会还有两周。周勇把报名表往讲台上一放，"},{"type":"narration","text":"用一种我知道你们不会主动的语气开口。"},{"type":"dialogue","speaker":"zhouyong","text":"表格在讲台上。每人至少报一项。不报的，我给你们安排——你们不会想知道我安排什么。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"houzi","text":"老师，安排什么啊？","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"绕操场捡垃圾。穿志愿者的红马甲。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"houzi","text":"那挺好 还有新衣服穿 也算包分配了","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"欸 不对 那不行 我先报个一百米吧","pose":"center","sprite":"default","enter":true,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"你跑一百？真的假的？","pose":"center","sprite":"default","enter":true,"exit":false},{"type":"narration","text":"周勇点点头走了。"},{"type":"narration","text":"报名表传到我这儿。中距离那一栏还空着。"},{"type":"narration","text":"全班最没人报的项目。不长不短，又累又难看，跑完像被人从洗衣机里掏出来。"},{"type":"narration","text":"我回头看了一眼后排。刚子和猴子正在为接力赛的最后一棒吵。"},{"type":"narration","text":"吵着吵着，刚子突然安静了。"},{"type":"narration","text":"这两秒很关键。这人每次人格切换前，都会先安静一下。"},{"type":"dialogue","speaker":"gangzi","text":"……行。接力给你。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"啊？","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"我去跑三千米。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"教室安静了一下。"},{"type":"narration","text":"善良人格上线了。这个人格的特点是：上一秒还在跟你抢外卖下一秒就能帮你舔盘子"},{"type":"narration","text":"切换人格切换自如啊"},{"type":"dialogue","speaker":"houzi","text":"这？这死猪是切换人格了？","pose":"center","sprite":"default","enter":true,"exit":false},{"type":"dialogue","speaker":"houzi","text":"合着平时一直占主导的是邪恶人格啊？？","pose":"center","sprite":"default","enter":true,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"反正也没人报。我跑得慢，正好磨时间。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"你疯了？那是绕着操场跑到腿断。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那咋了，受着呗。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"会赢吗？刚老师","pose":"center","sprite":"default","enter":true,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"会赢的。","pose":"center","sprite":"default","enter":true,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"我正打算填个跳远蒙混过关，前排传来一声非常刻意的叹气。"},{"type":"dialogue","speaker":"lijie","text":"中距离那栏还没人报。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"跟我没关系。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"我也没说跟你有关系啊？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……我就是陈述事实。其实也不是很想和你一起跑....","pose":"center","sprite":"angry","enter":false,"exit":false,"voice":"assets/a-ecff5e94753f951e.mp3"},{"type":"narration","text":"他没回头，但肩膀绷着。"},{"type":"dialogue","speaker":"lijie","text":"反正我不报。跑步会出汗。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"李杰讨厌出汗。讨厌到体育课宁愿被记旷课也不想跑。这事全班都知道。所以那栏空了好几天。"},{"type":"choice","prompt":"怎么跟李杰说？","options":[{"text":"那你陪我去跑跑呗，我自己不敢。","goto":"1-1b","ending":"","effects":{"affection.lijie":10}},{"text":"行，那我自己报。反正你也不敢。","goto":"1-1a","ending":"","effects":{"affection.lijie":12}},{"text":"算了，不为难你。","goto":"1-1c","ending":"","effects":{}},{"text":"直接报个跳远，装作没听见。","goto":"1-1d","ending":"","effects":{"flags.avoid_lijie":true}}]}],"bgmName":"校园","bgmLoop":true},{"id":"1-1a","chapter":1,"name":"选 B","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"我拿起笔，笔尖悬在那栏上面。"},{"type":"dialogue","speaker":"me","text":"行，那我自己报。反正你也不敢。我懂。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李杰翻书的手停了。"},{"type":"dialogue","speaker":"lijie","text":"……你说什么？","pose":"center","sprite":"surprised","enter":false,"exit":false,"voice":"assets/a-52575f4ec56edbf4.mp3"},{"type":"dialogue","speaker":"me","text":"我说我懂。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你懂什么了？","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"我懂你怕出汗。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李杰转过身来。这是他今天头一回正眼看我。"},{"type":"dialogue","speaker":"lijie","text":"我报。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"啊？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我说我报。中距离，我报。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"narration","text":"我把笔递过去。他一把抢过去，在那一栏写下自己的名字，"},{"type":"narration","text":"用力大到纸都快破了。"},{"type":"dialogue","speaker":"lijie","text":"看什么看。我只是……不想让班级少个人。","pose":"center","sprite":"angry","enter":false,"exit":false,"voice":"assets/a-ecff5e94753f951e.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你嗯什么。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"没什么。谢了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"谁要你谢。","pose":"center","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-5ff67056909ea42f.mp3"},{"type":"narration","text":"他把报名表拍给前排，转回去的时候明显在装镇定。"},{"type":"narration","text":"明明递零食给我的时候那么自然，自己跳进中距离这个坑反而绷不住了。这人真的很好懂。但你要是说出来，他能跟你绝交好几天。"}],"next":"1-2"},{"id":"1-1b","chapter":1,"name":"选 A：就一圈","background":"playground","bgm":null,"lines":[{"type":"set","effects":{"affection.lijie":10,"flags.lijie_training":true}},{"type":"dialogue","speaker":"me","text":"那你陪我去跑跑呗，我自己不敢。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……不去。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"dialogue","speaker":"me","text":"为什么。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"跑步会出汗。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"我知道。所以我说的是跑跑。走走也行。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……走走？","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"你陪我去操场走一圈，我认认路。这总行吧。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他沉默了几秒。"},{"type":"dialogue","speaker":"lijie","text":"就一圈。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"就一圈。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"那天傍晚，我们绕着操场走了三圈。"},{"type":"narration","text":"李杰一路在骂我。"},{"type":"dialogue","speaker":"lijie","text":"你连起跑线在哪都不知道，你还报中距离。你知道跑完不能立刻坐下吗。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"不知道。你教我啊。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……我凭什么教你。","pose":"center","sprite":"angry","enter":false,"exit":false,"voice":"assets/a-45effb846779d9b9.mp3"},{"type":"dialogue","speaker":"me","text":"那你陪我绕圈圈快半个小时了都","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他没接话，但脚步慢了下来。"},{"type":"narration","text":"走到后面，他忽然开口。"},{"type":"dialogue","speaker":"lijie","text":"……明天早上，早点到。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"dialogue","speaker":"me","text":"干嘛？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我带你跑两次。就两次。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"你不是怕出汗？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我怕你跑死在操场上，然后全校都知道是我前桌。","pose":"center","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"narration","text":"就一圈，变成三圈。不教，变成明天早上见。这人说话从来不算数——因为他每次说的都比做的小。"},{"type":"narration","text":"后续李杰线的部分场景会提前解锁。"}],"next":"1-2"},{"id":"1-1c","chapter":1,"name":"选 C：算了，不为难你","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"算了。他讨厌出汗这事全班都知道，逼他没意思。"},{"type":"dialogue","speaker":"me","text":"行，那我自己报。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……嗯。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"narration","text":"他没回头。整个下午也没再说话。"},{"type":"narration","text":"放学的时候，我看见他在报名表前面站了一会儿。"},{"type":"narration","text":"他拿起笔，又放下了。然后走了。"},{"type":"narration","text":"第二天早上，中距离那栏还是空的。"},{"type":"narration","text":"但李杰的桌角，多了瓶没开封的运动饮料。"},{"type":"narration","text":"他自己买的。他大概是打算报的，最后还是没报。我昨天要是再多说句话就好了。"},{"type":"choice","prompt":"补救一下？","options":[{"text":"早自习前跟他说昨天是我多嘴","goto":"1-1c-c","ending":"","effects":{"affection.lijie":10}},{"text":"什么都不说，把那瓶饮料推回他桌上","goto":"1-1d","ending":"","effects":{"affection.lijie":5}},{"text":"就这样吧。","goto":"1-1d","ending":"","effects":{"flags.avoid_lijie":true}}]}],"next":"1-2"},{"id":"1-1d","chapter":1,"name":"选 D：报跳远","background":"classroom","bgm":null,"lines":[{"type":"set","effects":{"flags.avoid_lijie":true}},{"type":"narration","text":"我拿起笔，在跳远那栏写上了自己的名字。"},{"type":"dialogue","speaker":"lijie","text":"……","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"me","text":"怎么了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"没什么。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"narration","text":"他转回去了。那天他一次都没回头。"},{"type":"narration","text":"下午体育课，我在沙坑边上练跳远，跳了一身沙子。"},{"type":"narration","text":"回教室的时候，桌角上多了包湿纸巾。"},{"type":"narration","text":"中距离那栏最后还是空的。李杰也没报。我们俩谁都没提这件事，但谁都知道对方在想什么。这大概就是前桌关系——隔着张桌子的距离，什么都看得见，什么都不说。"},{"type":"narration","text":"后续李杰的对话会变冷淡，需要更多好感度才能推进。"}],"next":"1-2"},{"id":"1-2","chapter":1,"name":"运动会那天","background":"playground","bgm":null,"lines":[{"type":"narration","text":"运动会那天，天气好得不讲道理。"},{"type":"narration","text":"主席台上，周勇坐在那儿，脸比天气还冷。"},{"type":"dialogue","speaker":"char11","text":"咳咳 我简单说两句啊 同学们不要急 我说完运动会就开始","pose":"center","sprite":"s1","enter":true,"exit":false},{"type":"narration","text":"接着 张校长喋喋不休的讲了快一个小时 从自己的半部辛酸史 一部四中传开始讲起"},{"type":"dialogue","speaker":"me","text":"牛魔的 这校长是买来的吧？话这么多？","pose":"center","sprite":"default","enter":true,"exit":false},{"type":"dialogue","speaker":"char11","text":"欸 这位小同学我听见你说的了 你还真别说我这校长还真是买来的 我得跟你讲讲我有史以来最伟大的一次投资.....","pose":"center","sprite":"s1","enter":true,"exit":false},{"type":"narration","text":"又讲了一个小时"},{"type":"dialogue","speaker":"houzi","text":"你看周老师那个表情，不知道的以为咱们班倒扣分了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"周勇每年运动会都这个表情。不喊加油，不鼓掌，坐着，像在监考。但去年运动会结束，我们班每个人的抽屉里都多了瓶运动饮料。没人知道是谁放的。也没人问。"},{"type":"narration","text":"中距离检录。李杰站在起跑线上，脸黑得像要下雨。"},{"type":"dialogue","speaker":"lijie","text":"……看什么看。","pose":"left","sprite":"angry","enter":false,"exit":true,"voice":"assets/a-ecff5e94753f951e.mp3"},{"type":"narration","text":"我什么都没做。但我还是朝他挥了挥手。他瞪得更凶了。值了。"},{"type":"narration","text":"我站到看台最前面，把班旗从猴子手里拿过来。"},{"type":"dialogue","speaker":"me","text":"十班的，喊起来。李杰——加油！","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"看台先是稀稀拉拉跟了几声，然后越来越整齐。"},{"type":"narration","text":"发令枪响。李杰起跑很慢，跑在倒数。跑了半程还是倒数。"},{"type":"narration","text":"后半程他的脚步开始乱。看台上有人喊加油，他连头都没抬。"},{"type":"narration","text":"然后在最后的弯道——他突然加速了。"},{"type":"narration","text":"接连超过去。最后那截直道，他跑到了第二。"},{"type":"narration","text":"冲过终点线他没停，直接拐到操场边的水龙头底下，把头伸过去冲了半天。"},{"type":"narration","text":"走过看台的时候，他头发湿透了，T恤贴在身上，喘得连话都说不利索。"},{"type":"dialogue","speaker":"lijie","text":"……看什么看。汗出了，名次也拿了。满意了？","pose":"left","sprite":"angry","enter":false,"exit":true,"voice":"assets/a-52fc57ae02bbf672.mp3"},{"type":"dialogue","speaker":"me","text":"我挺满意的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你满意什么。你什么都没干。","pose":"left","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"我给你留了瓶水。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他愣了一下，看向我手里的水瓶。然后伸手接过去，拧开，一口气喝了半瓶。"},{"type":"dialogue","speaker":"lijie","text":"……下次买冰的。","pose":"left","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"dialogue","speaker":"me","text":"行。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"还有，我不是为了你跑的。","pose":"left","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"嗯，我知道。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你知道什么你知道。","pose":"left","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"narration","text":"他一边说，一边把剩下半瓶水，很自然地放进了我书包的侧袋里。"},{"type":"narration","text":"这人。真的是。行吧，我认了。反正我乐意。"},{"type":"narration","text":"下午。三千米，刚子上场。这是全场最累的那个项目。"},{"type":"narration","text":"他站在起跑线上做了几次深呼吸。猴子在旁边给他扇风，扇得比谁都用力。"},{"type":"dialogue","speaker":"houzi","text":"行了行了别紧张。跑不动就走，走不动我背你。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"你妈的 三千米谁给我报的？？？","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"不就是你自己吗？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"啊？哦 那咋了，受着呗。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"枪响。前几圈刚子跑在中间。再往后他开始掉。"},{"type":"narration","text":"看台上有人开始笑。"},{"type":"narration","text":"然后，最后一圈。"},{"type":"narration","text":"刚子抬起头来了。"},{"type":"narration","text":"那个眼神——不是刚子的。"},{"type":"narration","text":"来了。刚子动用自己全身脂肪块开始烧血加速了!!!"},{"type":"narration","text":"刚子的步频突然变了，又碎又快，像一台被人踩了油门的割草机。"},{"type":"narration","text":"他从倒数，一路往前超。"},{"type":"narration","text":"然后他开始说话。对着被他超过的每个人说话。"},{"type":"dialogue","speaker":"gangzi","text":"借过！","pose":"right","sprite":"default","enter":false,"exit":false,"voice":"assets/a-ac64baa748f6e161.mp3","spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"char12","text":"我去？猪突猛进？？","pose":"center","sprite":"s1","enter":true,"exit":true},{"type":"dialogue","speaker":"gangzi","text":"别看我啊，看路。摔了我可不负责。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-ac64baa748f6e161.mp3","spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"char12","text":"快去请嘉豪大帝！！！","pose":"center","sprite":"s1","enter":true,"exit":true},{"type":"dialogue","speaker":"gangzi","text":"那咋了，受着呗。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"全场先是安静，然后爆笑。连主席台上几个老师都没绷住。"},{"type":"narration","text":"只有周勇没笑。"},{"type":"narration","text":"他还是那个表情，但手指在膝盖上敲了敲。"},{"type":"narration","text":"那几下敲击翻译过来大概是：这胖子，真行。"},{"type":"narration","text":"刚子最后以前几名的成绩冲线。"},{"type":"narration","text":"冲过终点他扶着膝盖喘了半天，再抬起头的时候，眼神又变回了那个憨憨的样子。"},{"type":"dialogue","speaker":"gangzi","text":"我……我跑完了？","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"我怎么闻到了烤猪香？","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"哎哟我的腿……哎哟……我刚刚是不是说了什么？","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-ee2bb1ad3279bc48.mp3","spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"你让别人借过","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"……","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"全场都笑了。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"……我牛大了。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-ee2bb1ad3279bc48.mp3","spriteScale":1.2,"spriteY":0},{"type":"narration","text":"刚子坐在跑道边的草地上，两条腿伸得笔直，像两根不属于他的东西。"},{"type":"narration","text":"这时候，看台那边走过来一个人。"},{"type":"narration","text":"个子不高，红色运动外套，走路松松垮垮的，像刚睡醒。"},{"type":"dialogue","speaker":"jiahao","text":"刚才是你在跑三千米？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.6,"spriteY":20},{"type":"dialogue","speaker":"gangzi","text":"……咋了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"jiahao","text":"二班的，嘉豪。一千五刚跑完，没跑爽。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.6,"spriteY":20},{"type":"dialogue","speaker":"jiahao","text":"咱俩练练？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.6,"spriteY":20},{"type":"narration","text":"刚子抬头看了他一眼，又低头看了看自己的腿。"},{"type":"dialogue","speaker":"gangzi","text":"……三圈？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"jiahao","text":"三圈。跑不跑。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.6,"spriteY":20},{"type":"narration","text":"我摇了摇头。刚子站了起来。"},{"type":"dialogue","speaker":"gangzi","text":"那咋了。受着呗。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"我去？？刚老师会赢吗？","pose":"center","sprite":"default","enter":true,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"会赢的","pose":"center","sprite":"default","enter":true,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"cg","image":"assets/a-568336d4a02907e7.webp","caption":"尽管来吧"},{"type":"minigame","config":{"title":"三圈加赛","laps":3,"duration":26000,"hint":"连打 空格 / 点击 —— 给刚子加速（至于结果……你懂的）","track":"assets/a-239f1c5f64223414.jpg","cutinAt":0.8,"cutinText":"刚子：……不行了……真不行了……","winnerName":"嘉豪","tiredFromLap":2,"runners":[{"id":"gz","name":"刚子","run":"assets/a-5359484a1e4c4238.webp","tired":"assets/a-293ffde9451b24d7.webp","sfx":"assets/a-3b0a689b76b48ae6.m4a"},{"id":"jh","name":"嘉豪","run":"assets/a-94778ca0f4789e73.webp","phase2":"assets/a-5fb542f3083c1f6e.webp","sfx":"assets/a-11b34879b84a55a7.m4a"}],"cx":49.87,"cy":49.85,"laneRx":42.97,"laneRy":44.5}},{"type":"narration","text":"嘉豪冲过终点线的时候，刚子还在弯道上。"},{"type":"narration","text":"他是真的跑不动了。那两条腿像各挂了袋水泥。"},{"type":"dialogue","speaker":"jiahao","text":"我大概一辈子不会忘记你吧 刚子","pose":"center","sprite":"special","enter":true,"exit":false,"spriteScale":1.6,"spriteY":20},{"type":"dialogue","speaker":"gangzi","text":"……你、你是不是换了个人。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"jiahao","text":"什么换人。我一直是我。","pose":"center","sprite":"s4","enter":false,"exit":false,"spriteScale":1.6,"spriteY":20},{"type":"dialogue","speaker":"jiahao","text":"你只是怕了","pose":"center","sprite":"s4","enter":true,"exit":true,"spriteScale":1.6,"spriteY":20},{"type":"narration","text":"他摆摆手走了，红色外套在太阳底下晃了两下就不见了。"},{"type":"narration","text":"刚子仰面躺在跑道上，看着天，喘了很久。"},{"type":"dialogue","speaker":"gangzi","text":"这tm啥阴","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"你只是怕了","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"这tm谁不怕？？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"choice","prompt":"这一刻你去哪？","options":[{"text":"去给刚子递水。","goto":"1-2b","ending":"","effects":{"affection.gangzi":15,"affection.houzi":10}},{"text":"去李杰那边。","goto":"1-2c","ending":"","effects":{"affection.lijie":12}},{"text":"去主席台给周勇递水。","goto":"1-2d","ending":"","effects":{"affection.zhouyong":15}},{"text":"去找杜小葵。","goto":"1-2e","ending":"","effects":{"affection.duxiaokui":15}}]}]},{"id":"1-2a","chapter":1,"name":"不管选谁：杜小葵的运动服","background":"playground","bgm":null,"lines":[{"type":"narration","text":"不管你去哪儿，都会经过这么一幕。"},{"type":"narration","text":"英语老师杜小葵，穿着一身明显是临时买的、袖口标签还没剪的运动服，"},{"type":"narration","text":"混在拉拉队里，拿着充气棒，正在用英文给听不太懂的男生加油。"},{"type":"dialogue","speaker":"duxiaokui","text":"Come on! You can do it! 快跑啊兄弟你后面有人！","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-4110cbc54ebbdde0.mp3"},{"type":"dialogue","speaker":"passerby","text":"老师你哪位？！","pose":"left","sprite":"s1","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"我是你英语老师！你作文还没交！","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-2697302e926b56fb.mp3"},{"type":"dialogue","speaker":"passerby","text":"……我这就跑快点。","pose":"left","sprite":"s1","enter":false,"exit":false},{"type":"narration","text":"那个男生最后拿了名次。杜小葵在看台上跳起来，比他本人还高兴。"},{"type":"narration","text":"很少有老师会在运动会这天完全变成学生。更少有老师，明明被教务处点名过几次仪容不整，还照样这么干。"},{"type":"narration","text":"主席台上的周勇，目光从杜小葵身上扫过去，又若无其事地移回秩序册上。"},{"type":"narration","text":"……我好像看到了什么，又好像什么都没看到。"}],"next":"1-3"},{"id":"1-2b","chapter":1,"name":"去给刚子递水","background":"playground","bgm":null,"lines":[{"type":"narration","text":"我拎着水挤到终点线。"},{"type":"dialogue","speaker":"me","text":"刚子，水。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"哎哟……谢了兄弟。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"他接过水，仰头灌了，然后打了个很响的嗝。"},{"type":"dialogue","speaker":"houzi","text":"你打嗝能不能背对着人。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那咋了，受着呗。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"……","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他嘴上嫌弃，手却伸过去扶住了刚子的胳膊。"},{"type":"dialogue","speaker":"houzi","text":"走，我搀你去阴凉地儿。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"谁要你搀。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"那你别晃。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"刚子确实在晃。他扶着猴子走了。"},{"type":"narration","text":"这俩人吵了一整个高中，但真到要搀的时候，谁也没推辞。我站在后面看着，忽然有点羡慕。"}],"next":"1-2a"},{"id":"1-2c","chapter":1,"name":"去李杰那边","background":"playground","bgm":null,"lines":[{"type":"narration","text":"我在看台上找到了李杰。他已经换回校服，头发还是湿的。"},{"type":"dialogue","speaker":"me","text":"给你。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……我不要。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"narration","text":"我把水塞到他手里。"},{"type"
