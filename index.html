    stopTypewriter();
    Runtime.type.full = full;
    Runtime.type.shown = 0;
    el.dtext.textContent = '';
    const ms = instant ? 0 : speedMs();
    if (!full) { finishType(); return; }
    if (ms <= 0) { el.dtext.textContent = full; Runtime.type.shown = full.length; finishType(); return; }
    Runtime.type.done = false;
    el.mark.classList.remove('on');
    // 先同步写出首字，保证任何时刻读取 dialogue-text 都能看到内容随时间增长
    Runtime.type.shown = 1;
    el.dtext.textContent = full.slice(0, 1);
    let last = performance.now();
    let acc = 0;
    const step = (now) => {
      const dt = now - last; last = now;
      acc += dt;
      const n = Math.floor(acc / ms);
      if (n > 0) {
        acc -= n * ms;
        Runtime.type.shown = Math.min(full.length, Runtime.type.shown + n);
        el.dtext.textContent = full.slice(0, Runtime.type.shown);
        if (Runtime.type.shown >= full.length) { finishType(); return; }
      }
      Runtime.type.raf = requestAnimationFrame(step);
    };
    Runtime.type.raf = requestAnimationFrame(step);
  }
  function finishType() {
    stopTypewriter();
    Runtime.type.shown = Runtime.type.full.length;
    Runtime.type.done = true;
    el.dtext.textContent = Runtime.type.full;
    el.mark.classList.add('on');
    scheduleAuto();
  }
  /** 若正在打字则先补全，返回是否发生过“补全” */
  function completeTypeIfNeeded() {
    if (Runtime.type.done) return false;
    finishType();
    return true;
  }

  function setSpeaker(ch) {
    if (!ch) { el.speaker.classList.add('hidden'); el.speaker.textContent = ''; return; }
    el.speaker.classList.remove('hidden');
    el.speaker.textContent = ch.name;
    el.speaker.style.color = ch.color;
    el.speaker.style.borderColor = hexToRgba(ch.color, 0.55);
    el.speaker.style.background = hexToRgba(ch.color, 0.16);
  }

  /** 渲染一条 narration / dialogue */
  function renderTextLine(line) {
    const type = str(line.type, '');
    if (type === 'narration') {
      el.dbox.setAttribute('data-narration', '1');
      setSpeaker(null);
      return str(line.text, '');
    }
    if (type !== 'dialogue') {
      // 未知类型：不进入对话流程（由 execLine 跳过）
      el.dbox.setAttribute('data-narration', '0');
      setSpeaker(null);
      return str(line.text, '');
    }
    el.dbox.setAttribute('data-narration', '0');
    const chId = str(line.speaker, '');
    const ch = State.data.charMap[chId] || null;
    setSpeaker(ch || { id: chId || 'unknown', name: chId || '???', color: State.data.meta.theme.accent });

    const pos = POSITIONS.indexOf(str(line.pose, 'center')) >= 0 ? str(line.pose, 'center') : 'center';
    // 没写 sprite 就沿用该角色当前的表情（不在台上才回退到第一张）。
    // 别退化成 `line.sprite || 'default'`：那会让所有没写 sprite 的台词都显示第一张图。
    const key = str(line.sprite, '') || currentSpriteKeyOf(chId) || 'default';
    if (line.exit === true) {
      // v3：exit = 「这一句照常出场并显示立绘，说完之后再退场」
      // 本句先把角色画到 pose 槽位，再登记"翻到下一句时从所有槽位移除"
      if (ch && ch.noStage !== true) {
        stagePlace(pos, ch, key, line, true);
        queueDeferredExit(ch.id);
      }
      // 极端数据：exit 但没有可用的 speaker（没有立绘信息）→ 不做任何舞台操作，
      // 直接由下一句的结算逻辑接管（不报错、不乱移除别人的立绘）
    } else if (ch && ch.noStage !== true) {
      // v3：移动而非复制；目标槽被占则原占用者退场；行级变换覆盖角色默认值
      stagePlace(pos, ch, key, line, true);
    }
    // 注意上面两处都要判 noStage：第一人称主角（「我」）在数据里没有立绘，
    // 一旦被摆上台就会走"没有立绘 → emoji 占位符"的兜底路径，
    // 于是纯旁白视角里凭空多出一个紫色人影。角色数据带 noStage 时直接跳过摆位。
    // v3：角色语音（播新的前先停旧的，不重叠）。
    // 编辑器预览回放前面的行时不播语音，否则一打开预览就会响一串。
    return str(line.text, '');
  }

  /* ---------------------------- 选项渲染 ---------------------------- */
  function renderChoice(line) {
    // 过滤掉非法选项，并把“过滤后的列表”存起来，保证下标与点击结果一致
    const all = arr(line.options).filter((o) => o && typeof o === 'object');
    // v2：require 不满足的选项直接不显示
    const options = all.filter((o) => {
      const req = normalizeConditions(o.require, 'choice.require');
      return !req.length || evalConditions(req).ok;
    });
    State.choiceOptions = options;
    const prompt = str(line.prompt, '');
    el.choiceList.innerHTML = '';
    if (prompt) {
      const p = document.createElement('div');
      p.className = 'choice-prompt';
      p.textContent = prompt;
      el.choiceList.appendChild(p);
    }
    const hiddenCount = all.length - options.length;
    options.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'choice-btn';
      b.type = 'button';
      b.setAttribute('data-choice-index', String(i));
      const hint = str(o.hint, '');
      b.innerHTML = `<span class="choice-idx">${i + 1}</span>${esc(str(o.text, '选项 ' + (i + 1)))}`
        + (hint ? `<span class="choice-hint">${esc(hint)}</span>` : '');
      b.addEventListener('click', (ev) => { ev.stopPropagation(); pickChoice(i); });
      el.choiceList.appendChild(b);
    });
    if (!options.length) {
      const tip = document.createElement('button');
      tip.className = 'choice-btn';
      tip.type = 'button';
      tip.textContent = hiddenCount
        ? `（${hiddenCount} 个选项条件不满足，点击继续）`
        : '（本行没有可用选项，点击继续）';
      tip.setAttribute('data-choice-skip', '1');
      tip.addEventListener('click', (ev) => {
        ev.stopPropagation();
        el.dbox.removeAttribute('data-choice');
        hideChoice();
        State.phase = 'line';
        State.pendingChoice = null;
        State.lineIdx++;
        execLine();
      });
      el.choiceList.appendChild(tip);
    }
    el.choiceList.classList.remove('hidden');
    requestAnimationFrame(positionChoiceList);
  }

  /**
   * 让选项列表尽量落在“立绘之下的空档”里：
   * 若居中位置会压到对话框，就整体上移到对话框上沿之上（同时避免顶出画面）
   */
  function positionChoiceList() {
    if (el.choiceList.classList.contains('hidden')) return;
    el.choiceList.style.setProperty('--choice-lift', '0px');
    const app = el.app.getBoundingClientRect();
    const listH = el.choiceList.offsetHeight;
    const dboxTop = el.dbox.getBoundingClientRect().top - app.top;
    const centerTop = (app.height - listH) / 2;
    const margin = 14;
    let lift = 0;
    if (centerTop + listH > dboxTop - margin) lift = (centerTop + listH) - (dboxTop - margin);
    const maxLift = centerTop - 44;              // 顶部至少留出 44px（章节点/工具条）
    if (maxLift > 0) lift = Math.min(lift, maxLift);
    el.choiceList.style.setProperty('--choice-lift', Math.max(0, Math.round(lift)) + 'px');
  }
  function hideChoice() {
    el.choiceList.classList.add('hidden');
    el.choiceList.innerHTML = '';
    State.choiceOptions = [];
    el.dbox.removeAttribute('data-choice');
    el.gameScreen.removeAttribute('data-phase');
  }

  /* ---------------------------- 结局渲染 ---------------------------- */
  function renderEnding(endingIdOrData, matched) {
    const d = State.data;
    let e = null;
    if (endingIdOrData && typeof endingIdOrData === 'object') e = endingIdOrData;
    else e = d.endingMap[str(endingIdOrData, '')] || null;
    if (!e) {
      e = { id: str(endingIdOrData, 'unknown'), title: '未知结局', text: '数据中找不到该结局定义。', kind: 'normal', condition: [] };
    }
    State.endedId = e.id;
    State.endingVarsSnapshot = clone(State.vars) || {};
    // 记录图鉴
    State.gallery[e.id] = { at: Date.now(), title: e.title };
    Persist.writeGallery();
    // 展示
    el.endingScreen.setAttribute('data-kind', e.kind);
    el.endingKind.textContent = ({ true: 'True End', good: 'Good End', normal: 'Normal End', bad: 'Bad End' })[e.kind] || 'Ending';
    el.endingTitle.textContent = e.title;
    el.endingText.textContent = e.text;
    // v2：回显触发条件（byCondition 时显示命中的条件；直接指定时显示该结局的 condition）
    const conds = e.condition || [];
    const shown = arr(matched).length ? arr(matched)
      : conds.map((c) => ({ var: c.var, op: c.op, value: c.value, actual: (c.var in State.vars) ? State.vars[c.var] : 0 }));
    if (shown.length) {
      el.endingCond.classList.remove('hidden');
      el.endingCond.textContent = '触发条件：' + shown.map((c) => condText(c, true)).join(' 且 ');
    } else {
      el.endingCond.classList.add('hidden');
      el.endingCond.textContent = '';
    }
    const keys = Object.keys(State.endingVarsSnapshot);
    if (keys.length) {
      el.endingVars.classList.remove('hidden');
      el.endingVars.textContent = '变量：' + keys.sort().map((k) => `${k}=${fmtVar(State.endingVarsSnapshot[k])}`).join(' · ');
    } else {
      el.endingVars.classList.add('hidden');
      el.endingVars.textContent = '';
    }
    fadeOutAllAudio();   // 结局画面不该还响着上一幕的音乐
    State.phase = 'ending';
    clearAutoTimers();
    stopTypewriter();
    hideChoice();
    showScreen('ending');
    updateAutoButton();
    // 结局后清空自动存档，避免“继续游戏”回到已结束的流程
    LS.del(KEY.autosave);
    refreshContinueButton();
  }
  function fmtVar(v) {
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(Math.round(v * 1000) / 1000);
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return str(v, '');
  }

  /* ---------------------------- 模态面板 ---------------------------- */
  function closeModal() {
    State.modal = null;
    State.uiLocked = false;
    el.modalRoot.innerHTML = '';
    updateAutoButton();
  }
  function openModal(name, titleText, bodyHTML, footButtons) {
    State.modal = name;
    State.uiLocked = true;
    clearAutoTimers();
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.setAttribute('data-modal', name);
    const foot = (footButtons || []).map((b, i) =>
      `<button class="btn ${b.main ? 'btn-main' : 'btn-ghost'} btn-sm" data-foot-index="${i}">${esc(b.label)}</button>`).join('');
    wrap.innerHTML = `<div class="panel" data-testid="panel-${esc(name)}" role="dialog" aria-label="${esc(titleText)}">
        <div class="panel-head">
          <h3 class="panel-title">${esc(titleText)}</h3>
          <button class="btn btn-ghost btn-sm" data-modal-close="1">关闭</button>
        </div>
        <div class="panel-body">${bodyHTML}</div>
        ${foot ? `<div class="panel-foot">${foot}</div>` : ''}
      </div>`;
    el.modalRoot.innerHTML = '';
    el.modalRoot.appendChild(wrap);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) closeModal(); });
    wrap.querySelector('[data-modal-close]').addEventListener('click', closeModal);
    (footButtons || []).forEach((b, i) => {
      const btn = wrap.querySelector(`[data-foot-index="${i}"]`);
      if (btn && typeof b.onClick === 'function') btn.addEventListener('click', () => b.onClick());
    });
    if (typeof (footButtons || []).onMount === 'function') footButtons.onMount(wrap);
    return wrap;
  }

  /* 通用分段选择器 HTML */
  function segHTML(field, options, current) {
    return `<div class="seg" data-seg="${esc(field)}">${options.map((o) =>
      `<button class="seg-btn${o.value === current ? ' on' : ''}" data-seg-field="${esc(field)}" data-seg-value="${esc(o.value)}">${esc(o.label)}</button>`
    ).join('')}</div>`;
  }

  /* ==========================================================================
   * 模块 5 · Engine —— effects / 行执行 / 跳转
   * ========================================================================== */
  const FALLBACK_BG = { id: '__fallback__', name: '未知背景', css: '', image: null };

  /** effects 语义：number 累加；boolean / string 赋值；key 含 . 表示命名空间变量 */
  function applyEffects(effects) {
    const e = obj(effects);
    Object.keys(e).forEach((k) => {
      const v = e[k];
      if (typeof v === 'number' && Number.isFinite(v)) {
        const cur = State.vars[k];
        State.vars[k] = (typeof cur === 'number' && Number.isFinite(cur) ? cur : 0) + v;
      } else if (typeof v === 'boolean' || typeof v === 'string') {
        State.vars[k] = v;
      } else if (v === null) {
        State.vars[k] = null;
      } else {
        State.vars[k] = clone(v); // 其他类型（数组/对象）整体赋值，保持数据不丢
      }
    });
  }

  function currentScene() { return State.data.sceneMap[State.sceneId] || null; }

  /** 该场景里"说过话"的角色 id 集合（用于进场景时的舞台清理） */
  function speakersOfScene(sc) {
    const set = new Set();
    if (!sc) return set;
    sc.lines.forEach((l) => {
      if (!l || typeof l !== 'object') return;
      if (str(l.type, '') !== 'dialogue') return;
      if (l.exit === true) return;                       // 只退场不说话的不算
      const id = str(l.speaker, '');
      if (id) set.add(id);
    });
    return set;
  }

  /**
   * v3 舞台清理：进入新场景时，把"不在该场景里说话"的角色从所有槽位移除。
   * 同时处理槽位冲突：清理后若同一槽位被多人占据（理论上不会），保留先出现的。
   * opts.keep = true 时跳过（读档按快照精确恢复，不受自动清理影响）
   */
  function pruneStageForScene(sc) {
    const keep = speakersOfScene(sc);
    const removed = [];
    POSITIONS.forEach((p) => {
      const e = spriteEntry(p);
      if (e && !keep.has(e.charId)) { removed.push(e.charId); removeSprite(p, true); }
    });
    return removed;
  }

  /** 进入场景（含背景切换 + 舞台清理 + 背景音 + 可选自动存档） */
  function enterScene(sceneId, lineIdx, opts) {
    opts = obj(opts);
    const sc = State.data.sceneMap[sceneId] || null;
    if (!sc) return false;
    clearAutoTimers();
    stopTypewriter();
    State.sceneId = sc.id;
    State.sceneIdx = State.data.scenes.indexOf(sc);
    State.lineIdx = int(lineIdx, 0);
    if (!State.visitedOrder.length || State.visitedOrder[State.visitedOrder.length - 1] !== sc.id) State.visitedOrder.push(sc.id);
    // v3：进入新场景时移除"不在该场景里说话"的角色，避免上一幕的人一直挂着
    if (opts.keepStage !== true) {
      // 上一幕尚未结算的 exit 在这里立即结算（人会随换场消失）
      flushDeferredExit(false);
      clearDeferredExit();
      pruneStageForScene(sc);
    }
    // v3：场景背景音
    playBgm(sc);
    // 先用场景背景落地；若落点这一行带 background 覆盖，立即切过去（读档落在覆盖行上也正确）
    Runtime.bgScene = sc.background;
    const bg = applyBackground(sc.background);
    State.bgId = bg ? bg.id : sc.background;
    const landLine = sc.lines[int(lineIdx, 0)];
    if (landLine && typeof landLine === 'object' && str(landLine.background, '')) applyLineBackground(landLine);
    el.chapterChip.textContent = sc.name;
    el.chapterChip.classList.toggle('hidden', !sc.name);
    el.gameScreen.setAttribute('data-has-chapter', sc.name ? '1' : '0');
    if (opts.autosave !== false) autoSave();
    return true;
  }

  /** 行签名（已读 / 存档用） */
  function lineSignature(line, idx) {
    const t = str(line && line.type, '');
    const txt = str(line && line.text, '');
    return lineHash(State.sceneId, typeof idx === 'number' ? idx : State.lineIdx, t + ':' + txt + ':' + str(line && line.endingId, ''));
  }

  /** 执行当前行；set / 未知类型会自动向前推进 */
  /* ══════════════════════════ 小游戏：赛跑 ══════════════════════════
   *
   * 一段剧情之后插进来的小游戏。三条设计原则：
   *
   *  1. **结果由脚本决定，玩家只影响过程**。刚子的位置 = 脚本曲线 + 玩家加成，
   *     而加成上限（默认 0.10 圈）远小于两条曲线之间的差距，怎么按都改变不了名次。
   *     这里要的是"努力了但没用"的喜剧效果，不是真做一个竞技游戏。
   *  2. **俯视跑道 + 直立角色**。素材里的操场是俯视的，但角色是侧面照；
   *     把侧面照按切线旋转会看起来像倒立，所以角色保持直立、只沿椭圆路径平移，
   *     再用一点上下颠动当跑动。
   *  3. 音效循环播放 + playbackRate 跟着速度走 —— 素材本身就是"跑步音效"，
   *     变速循环听起来就是步频在变。
   */
  const MG_DEFAULT_GAP = [
    [0.00, 0.00], [0.08, -0.10], [0.20, 0.02], [0.32, 0.10],
    [0.46, 0.06], [0.58, -0.14], [0.72, -0.10], [0.80, 0.26], [1.00, 0.80],
  ];

  const MiniGame = {
    active: false, ended: false, cfg: null,
    runners: {}, audios: {}, raf: 0, t0: 0, last: 0,
    boost: 0, hold: false, phase2: false, tired: false, tail: 0,
  };

  /** 分段线性插值：pts 是 [t, 值] 的有序数组 */
  function mgLerp(pts, t) {
    if (!pts || !pts.length) return 0;
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (t <= pts[i][0]) {
        const a = pts[i - 1], b = pts[i];
        const k = (b[0] - a[0]) ? (t - a[0]) / (b[0] - a[0]) : 0;
        return a[1] + (b[1] - a[1]) * k;
      }
    }
    return pts[pts.length - 1][1];
  }

  /**
   * 椭圆跑道上的一点（laps 可为小数、可超过 1 —— cos/sin 自带周期）。
   *
   * **rx / ry 的单位是「舞台宽/高的百分比」，不是小数比例。**
   * 这里就是 `cx + rx * cos`，传 0.40 只会偏移 0.4% —— 两个角色会全部堆在画面正中间。
   * 默认 cx/cy 是按素材图实测出来的红色跑道中心线。
   */
  function mgTrackPoint(laps, rx, ry, cx, cy) {
    const a = laps * Math.PI * 2 - Math.PI / 2;   // 0 圈 = 正上方（起跑线），顺时针
    return {
      x: (cx == null ? 47.7 : cx) + rx * Math.cos(a),
      y: (cy == null ? 50.1 : cy) + ry * Math.sin(a),
    };
  }

  function mgStartAudio(key, src) {
    if (!src) return;
    try {
      audioInit();
      const a = new Audio();
      a.src = src;
      a.loop = true;
      a.playbackRate = 1;
      applyMgVolume(a);
      safePlay(a, 'voice');
      MiniGame.audios[key] = a;
    } catch { /* 播不了就静默跑，不影响游戏 */ }
  }
  function applyMgVolume(a) {
    const base = State.audio.mute ? 0 : (State.audio.voiceVolume != null ? State.audio.voiceVolume : 0.9);
    try { a.volume = Math.max(0, Math.min(1, base * 0.5)); } catch { /* ignore */ }
  }
  function mgStopAudio() {
    for (const k of Object.keys(MiniGame.audios)) {
      try { MiniGame.audios[k].pause(); MiniGame.audios[k].src = ''; } catch { /* ignore */ }
      delete MiniGame.audios[k];
    }
  }


  /**
   * 独立插图：一张大图盖满画面，点一下（或空格）继续。
   *
   * 跟"立绘"和"背景"都不同 —— 它不参与舞台摆位，就是单纯地给一段剧情插一张大图
   * （比如刚子觉醒的那格漫画），看完继续走剧本。
   */
  function showCg(line) {
    const src = str(line.image, '');
    if (!src) { State.lineIdx++; execLine(); return; }      // 没图就跳过，别把剧情卡死
    State.cg = true;
    State.phase = 'cg';
    el.cgImage.src = src;
    const cap = str(line.caption, '');
    if (cap) { el.cgCaption.textContent = cap; el.cgCaption.classList.remove('hidden'); }
    else { el.cgCaption.classList.add('hidden'); el.cgCaption.textContent = ''; }
    el.cgView.classList.remove('hidden');
  }

  function closeCg() {
    if (!State.cg) return;
    State.cg = false;
    el.cgView.classList.add('hidden');
    el.cgImage.removeAttribute('src');
    State.lineIdx++;
    execLine();
  }
  function startMinigame(line) {
    const raw = line.config || {};
    const cfg = {
      laps: Number(raw.laps) || 3,
      duration: Number(raw.duration) || 26000,
      track: raw.track || '',
      gap: Array.isArray(raw.gap) && raw.gap.length ? raw.gap : MG_DEFAULT_GAP,
      boostMax: raw.boostMax != null ? Number(raw.boostMax) : 0.10,
      boostGain: raw.boostGain != null ? Number(raw.boostGain) : 0.022,
      holdGain: raw.holdGain != null ? Number(raw.holdGain) : 0.15,
      decay: raw.decay != null ? Number(raw.decay) : 0.14,
      cutinAt: raw.cutinAt != null ? Number(raw.cutinAt) : 0.80,
      cutinText: raw.cutinText || '',
      title: raw.title || '赛跑',
      hint: raw.hint || '连打 空格 / 点击 给刚子加速',
      tiredFromLap: raw.tiredFromLap != null ? Number(raw.tiredFromLap) : 2,
      // 跑道中心与半径（百分比）。默认值按素材图实测：cx 47.7 / cy 50.1 / 中心线 rx 39.5 / ry 44.9
      cx: raw.cx != null ? Number(raw.cx) : 49.87,
      cy: raw.cy != null ? Number(raw.cy) : 49.85,
      laneRx: raw.laneRx != null ? Number(raw.laneRx) : 42.97,
      laneRy: raw.laneRy != null ? Number(raw.laneRy) : 44.5,
      winnerName: raw.winnerName || '嘉豪',
      gz: (raw.runners || []).find((r) => r.id === 'gz') || {},
      jh: (raw.runners || []).find((r) => r.id === 'jh') || {},
    };
    MiniGame.cfg = cfg;
    MiniGame.active = true; MiniGame.ended = false; MiniGame.phase2 = false; MiniGame.tired = false;
    MiniGame.boost = 0; MiniGame.hold = false; MiniGame.tail = 0;

    el.mgRoot.classList.remove('hidden');
    el.mgTitle.textContent = cfg.title;
    el.mgHint.textContent = cfg.hint;
    el.mgTrack.src = cfg.track;
    el.mgCutin.classList.add('hidden');
    el.mgCutin.classList.remove('show');
    el.mgResult.classList.add('hidden');
    el.mgLap.textContent = `第 1 / ${cfg.laps} 圈`;
  // 圈的进度点：laps 个圆点，跑完一个点亮一个
  el.mgLaps.innerHTML = '';
  MiniGame.dots = [];
  for (let i = 0; i < cfg.laps; i++) {
    const d = document.createElement('i');
    d.className = 'mg-lapdot';
    d.dataset.testid = 'mg-lapdot';
    el.mgLaps.appendChild(d);
    MiniGame.dots.push(d);
  }
    el.mgBoost.style.width = '0%';
    el.mgCutinImg.src = cfg.gz.tired || '';

    for (const [k, r] of [['gz', cfg.gz], ['jh', cfg.jh]]) {
      const node = el.mgSlot[k];
      node.classList.remove('hidden', 'tired', 'phase2', 'winner');
      node.querySelector('img').src = r.run || '';
      MiniGame.runners[k] = { node };
    }

    mgStartAudio('gz', cfg.gz.sfx);
    mgStartAudio('jh', cfg.jh.sfx);

    MiniGame.t0 = performance.now();
    MiniGame.last = MiniGame.t0;
    cancelAnimationFrame(MiniGame.raf);
    MiniGame.raf = requestAnimationFrame(mgFrame);
  }

  /** 玩家的一次输入：立刻给一点加成（连打累积，比按住更有效） */
  function mgBump() {
    if (!MiniGame.active || MiniGame.ended) return;
    MiniGame.boost = Math.min(MiniGame.cfg.boostMax, MiniGame.boost + MiniGame.cfg.boostGain);
  }

  function mgFrame(now) {
    if (!MiniGame.active) return;
    const cfg = MiniGame.cfg;
    const dt = Math.min(0.05, (now - MiniGame.last) / 1000);
    MiniGame.last = now;
    const t = Math.min(1, (now - MiniGame.t0) / cfg.duration);

    // 加成：按住缓慢累积、连打立刻加一点，松手衰减。
    // 上限 boostMax 保证无论怎么按都翻不了盘 —— 这是这个游戏的核心设定。
    if (MiniGame.hold && !MiniGame.ended) MiniGame.boost = Math.min(cfg.boostMax, MiniGame.boost + dt * cfg.holdGain);
    else MiniGame.boost = Math.max(0, MiniGame.boost - dt * cfg.decay);

    const jhLaps = cfg.laps * (0.65 * t + 0.35 * t * t);          // 嘉豪：匀速带一点后段加速
    const gzLaps = Math.max(0, jhLaps - mgLerp(cfg.gap, t) + MiniGame.boost);

    if (!MiniGame.tired && gzLaps >= cfg.tiredFromLap) {           // 刚子进最后一圈 → 精疲力竭立绘
      MiniGame.tired = true;
      MiniGame.runners.gz.node.querySelector('img').src = cfg.gz.tired || cfg.gz.run || '';
      MiniGame.runners.gz.node.classList.add('tired');
    }
    if (!MiniGame.phase2 && t >= cfg.cutinAt) {                    // 嘉豪进第二阶段 + 特写
      MiniGame.phase2 = true;
      MiniGame.runners.jh.node.querySelector('img').src = cfg.jh.phase2 || cfg.jh.run || '';
      MiniGame.runners.jh.node.classList.add('phase2');
      if (cfg.cutinText) el.mgCutinText.textContent = cfg.cutinText;
      el.mgCutin.classList.remove('hidden');
      requestAnimationFrame(() => el.mgCutin.classList.add('show'));
    }

    // 刚子内道、嘉豪外道（中心线半径的 0.92 / 1.06）
    mgDraw('gz', gzLaps, cfg.laneRx * 0.90, cfg.laneRy * 0.90, cfg.cx, cfg.cy);
    mgDraw('jh', jhLaps, cfg.laneRx * 1.08, cfg.laneRy * 1.08, cfg.cx, cfg.cy);

    const lapNow = Math.min(cfg.laps, Math.floor(gzLaps) + 1);
  el.mgLap.textContent = `第 ${lapNow} / ${cfg.laps} 圈`;
  // 用**嘉豪**的圈数点亮：他是领跑的，进度条跟着他走才符合"比赛进行到哪了"
  const lead = Math.min(cfg.laps, Math.floor(Math.max(jhLaps, gzLaps)) + 1);
  (MiniGame.dots || []).forEach((d, i) => {
    d.classList.toggle('done', i + 1 < lead || (i + 1 === lead && Math.max(jhLaps, gzLaps) >= cfg.laps));
    d.classList.toggle('now', i + 1 === lead && Math.max(jhLaps, gzLaps) < cfg.laps);
  });
    el.mgBoost.style.width = `${Math.round(MiniGame.boost / cfg.boostMax * 100)}%`;

    const spd = 0.9 + (MiniGame.boost / Math.max(0.001, cfg.boostMax)) * 0.5;
    if (MiniGame.audios.gz) MiniGame.audios.gz.playbackRate = MiniGame.tired ? 0.75 : spd;
    if (MiniGame.audios.jh) MiniGame.audios.jh.playbackRate = MiniGame.phase2 ? 1.35 : 1;

    if (t >= 1) {                                                  // 嘉豪冲线 → 尾声
      MiniGame.tail += dt;
      if (MiniGame.audios.gz) MiniGame.audios.gz.playbackRate = Math.max(0.5, MiniGame.audios.gz.playbackRate - dt);
      if (MiniGame.tail > 2.6) { finishMinigame(); return; }
    }
    MiniGame.raf = requestAnimationFrame(mgFrame);
  }

  function mgDraw(key, laps, rx, ry, cx, cy) {
    const r = MiniGame.runners[key];
    if (!r) return;
    const p = mgTrackPoint(laps, rx, ry, cx, cy);
    const bob = Math.sin(laps * Math.PI * 2 * 14) * 1.2;           // 跑动颠簸
    r.node.style.left = p.x + '%';
    r.node.style.top = (p.y + bob * 0.4) + '%';
    // 下半圈的人盖住上半圈：用 top 当伪 z 序（跑道是俯视的，谁靠近镜头谁在上）
    r.node.style.zIndex = String(p.y > 50 ? 8 : 20);
  }

  function finishMinigame() {
    if (MiniGame.ended) return;
    MiniGame.ended = true;
    cancelAnimationFrame(MiniGame.raf);
    mgStopAudio();
    if (MiniGame.runners.jh) MiniGame.runners.jh.node.classList.add('winner');
    el.mgResultWho.textContent = MiniGame.cfg.winnerName;
    el.mgResult.classList.remove('hidden');
  }

  function closeMinigame() {
    if (!MiniGame.active) return;
    MiniGame.active = false;
    el.mgRoot.classList.add('hidden');
    el.mgCutin.classList.remove('show');
    el.mgCutin.classList.add('hidden');
    mgStopAudio();
    cancelAnimationFrame(MiniGame.raf);
    State.minigame = false;
    State.lineIdx++;
    execLine();
  }
  function execLine() {
    const sc = currentScene();
    if (!sc) { fatal('当前场景不存在，已返回标题'); return; }
    if (State.lineIdx < 0) State.lineIdx = 0;
    if (State.lineIdx >= sc.lines.length) { nextScene(); return; }
    if (++State.steps > 20000) { fatal('剧本执行步数异常，已停止'); return; }

    const line = sc.lines[State.lineIdx] || {};
    State.currentLine = line;
    const type = str(line.type, '');

    // v3：上一句登记的 exit 在这个时候才结算 —— 保证"说 exit 那句时人还在台上"
    flushDeferredExit(false);
    // v2 行级背景覆盖：非 ending 的行在渲染前先确定背景（含淡入淡出切换）
    if (type !== 'ending') applyLineBackground(line);
    // v3：clear:true 清空舞台上的所有立绘
    if (type !== 'ending' && line.clear === true) clearSprites();

    if (type === 'narration' || type === 'dialogue') {
      State.phase = 'line';
      hideChoice();
      // v4：翻页就处理语音 —— 有新语音就播、没有就把上一句掐掉。
      // 放在这个总入口、而不是 renderTextLine 的对话分支里：
      // 旁白走的是同一条渲染路径的另一个分支，只改对话分支的话，
      // 从对话翻到旁白时上一句会一直念下去（实测就是这样）。
      if (!Runtime.previewing) playVoice(str(line.voice, ''));
      const text = renderTextLine(line);
      const sig = lineSignature(line, State.lineIdx);
      const isRead = State.readSet.has(sig);
      if (!isRead) { State.readSet.add(sig); Persist.writeRead(); }
      pushHistory(line, text);
      const instant = isRead && State.settings.skipRead;
      typeText(text, instant);
      return;
    }

    if (type === 'cg') {
      showCg(line);
      return;
    }
    if (type === 'minigame') {
      // 小游戏：整块浮层接管画面，跑完（或点「继续剧情」）才回到剧本。
      // 期间 State.minigame 为真，advance() 会拒绝推进，避免后面的行被漏过去。
      State.phase = 'minigame';
      State.minigame = true;
      startMinigame(line);
      return;
    }
    if (type === 'set') {
      applyEffects(line.effects);
      if (State.settings.skipRead) { skipForward(); return; }
      State.lineIdx++;
      setTimeout(() => { if (State.phase === 'line' || State.phase === 'choice') execLine(); }, 0);
      return;
    }
    if (type === 'choice') {
      State.phase = 'choice';
      State.pendingChoice = line;
      State.lineIdx = State.lineIdx; // 存档仍停在本行
      renderChoiceFor(line);
      autoSave();
      return;
    }
    if (type === 'ending') {
      // v2：byCondition → 按 endings[] 顺序取第一个条件全满足的结局
      if (line.byCondition === true) {
        const picked = resolveEndingByCondition();
        if (picked.ending) { renderEnding(picked.ending, picked.matched); return; }
        toast('没有任何结局定义，已返回标题');
        backToTitle('剧本没有定义任何结局');
        return;
      }
      const eid = str(line.endingId, '');
      renderEnding(State.data.endingMap[eid] || { id: eid || 'unknown', title: '未知结局', text: 'endingId 未在 endings 中定义。', kind: 'normal' });
      return;
    }
    // 未知 line 类型：直接跳过
    State.lineIdx++;
    setTimeout(() => { if (State.phase === 'line' || State.phase === 'choice') execLine(); }, 0);
  }

  /**
   * v2 条件结局判定：
   *  1) 按 endings[] 顺序取第一个「有 condition 且全部满足」的结局
   *  2) 都不满足 → 取第一个没有 condition 的结局
   *  3) 仍没有 → endings[0]
   * 返回 { ending, matched }（matched 为命中的条件明细，供结局画面回显）
   */
  function resolveEndingByCondition() {
    const list = State.data.endings;
    if (!list.length) return { ending: null, matched: [] };
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.condition.length) continue;
      const r = evalConditions(e.condition);
      if (r.ok) return { ending: e, matched: r.results };
    }
    for (let i = 0; i < list.length; i++) {
      if (!list[i].condition.length) return { ending: list[i], matched: [] };
    }
    return { ending: list[0], matched: [] };
  }

  function renderChoiceFor(line) {
    // 选项文字由 #choice-list 呈现；对话框只保留“请选择”氛围提示，避免文字重复
    el.dbox.setAttribute('data-narration', '0');
    el.dbox.setAttribute('data-choice', '1');
    setSpeaker(null);
    typeText('请选择…', true);
    el.gameScreen.setAttribute('data-phase', 'choice');
    renderChoice(line);
  }

  /**
   * 解析场景的 next 字段，返回下一个场景 id（没有则返回空串）。
   * 支持两种写法：
   *   next: "sceneId"                        直接跳
   *   next: [{ require:[...], goto:"id" }, …] 依次判定条件，取第一个满足的；
   *                                           没有 require 的那条当作兜底
   * 这样分支场景才能接回主线（否则只能靠数组顺序，多个分支接同一个下场的
   * 情况根本表达不了），结局分档也靠它。
   */
  function resolveNext(sc) {
    const nx = sc && sc.next;
    if (!nx) return '';
    if (typeof nx === 'string') return str(nx, '');
    if (Array.isArray(nx)) {
      for (const rule of nx) {
        if (!rule || typeof rule !== 'object') continue;
        const g = str(rule.goto, '');
        if (!g) continue;
        if (!Array.isArray(rule.require) || !rule.require.length) return g;   // 兜底
        if (evalConditions(normalizeConditions(rule.require, 'scene.next')).ok) return g;
      }
    }
    return '';
  }

  /** 前往下一个场景（当前场景行耗尽） */
  function nextScene() {
    const d = State.data;
    const idx = State.sceneIdx;
    const here = d.scenes[idx];
    // 1) 场景自己写了 next —— 优先，用它接分支 / 分档
    const forced = resolveNext(here);
    if (forced && forced !== here.id) {
      if (enterScene(forced, 0)) { execLine(); return; }
      console.warn('[galgame] next 指向的场景不存在：', forced);
    }
    // 2) 顺延到数组里的下一个场景
    if (idx + 1 < d.scenes.length) {
      enterScene(d.scenes[idx + 1].id, 0);
      execLine();
      return;
    }
    // 没有显式 ending：用最后一个可用结局收尾
    if (d.endings.length) { renderEnding(d.endings[0]); return; }
    fatal('剧本已结束，但没有定义任何 ending。');
  }

  /** 推进：补全文字 → 下一行 */
  function advance() {
    if (State.uiLocked || State.modal) return;
    if (State.cg) { closeCg(); return; }        // 插图显示中：点击 = 关掉插图并继续
    if (State.minigame) return;                 // 小游戏进行中不推进剧情
    if (State.phase === 'choice') return;      // 选项阶段必须点击选项
    if (State.phase === 'ending') return;
    if (State.phase !== 'line') return;
    clearAutoTimers();
    if (completeTypeIfNeeded()) return;        // 文本未打完：先补全
    State.lineIdx++;
    execLine();
  }

  /** 跳过模式下连续推进（用于 set 与已读快速跳过） */
  function skipForward() {
    let guard = 0;
    while (guard++ < 400) {
      const sc = currentScene();
      if (!sc || State.lineIdx >= sc.lines.length) { nextScene(); return; }
      const line = sc.lines[State.lineIdx] || {};
      const t = str(line.type, '');
      // 被跳过的行同样要落地它的行级背景覆盖，否则跳过后的画面会与契约不一致
      // （退场登记由 execLine 统一结算，避免在这里提前把人移走）
      if (t !== 'ending') applyLineBackground(line);
      if (t === 'set') { applyEffects(line.effects); State.lineIdx++; continue; }
      if (t === 'narration' || t === 'dialogue') {
        const sig = lineSignature(line, State.lineIdx);
        if (State.readSet.has(sig)) { State.lineIdx++; continue; }
      }
      execLine();
      return;
    }
  }

  /** 选择分支：应用 effects → ending 优先，其次 goto，都为空则顺延到下一个场景 */
  function pickChoice(i) {
    const line = State.pendingChoice;
    if (!line) return;
    const options = arr(State.choiceOptions);
    if (i < 0 || i >= options.length) { toast('该选项不存在'); return; }
    const o = obj(options[i]);
    applyEffects(o.effects);
    hideChoice();
    State.pendingChoice = null;

    // v2：options[].ending 非空 → 直接进入该结局（忽略 goto）
    const endingId = str(o.ending, '');
    if (endingId) {
      const e = State.data.endingMap[endingId];
      State.phase = 'line';
      if (e) { renderEnding(e); return; }
      toast(`结局「${endingId}」未定义，已按剧本顺延`);
      // 落到 goto / 顺延逻辑
    }

    const goto = str(o.goto, '');
    if (goto && State.data.sceneMap[goto]) {
      State.phase = 'line';
      enterScene(goto, 0);
      execLine();
      return;
    }
    if (goto) {
      toast(`选项指向的场景「${goto}」不存在，已顺延到下一个场景`);
    }
    // v2：goto 与 ending 都为空（或目标不存在）→ 顺延到下一个场景，不报错
    State.phase = 'line';
    nextScene();
  }

  /** 历史记录 */
  function pushHistory(line, text) {
    const t = str(line.type, '');
    const ch = t === 'dialogue' ? (State.data.charMap[str(line.speaker, '')] || null) : null;
    State.history.push({
      name: ch ? ch.name : (t === 'dialogue' ? str(line.speaker, '???') : '旁白'),
      color: ch ? ch.color : '',
      text: str(text, ''),
      narr: t === 'narration'
    });
    if (State.history.length > 400) State.history.splice(0, State.history.length - 400);
  }

  /* ==========================================================================
   * 模块 5.5 · Audio —— 场景背景音 / 角色语音 / 音量（v3）
   * 浏览器自动播放策略：首次用户手势前不强行 play，被拒绝时静默降级
   * ========================================================================== */
  const Audio2 = {
    bgmEl: null,
    voiceEl: null,
    bgmKey: '',            // 当前背景音的 key（判断"同一首不重头播"）
    bgmSrc: '',
    unlocked: false,       // 是否已获得用户手势（用于自动播放降级后的重试）
    pendingBgm: null,      // 被策略拦下的待播背景音
    lastVoice: null,
    blocked: 0             // 被浏览器拦下的次数（调试用）
  };

  function audioInit() {
    if (Audio2.bgmEl) return;
    Audio2.bgmEl = new Audio();
    Audio2.bgmEl.preload = 'auto';
    Audio2.voiceEl = new Audio();
    Audio2.voiceEl.preload = 'auto';
    // 加载失败要说出来，否则用户只能看到"没有声音"却不知道为什么
    Audio2.bgmEl.addEventListener('error', () => { Audio2.lastError = 'bgm'; noteAudioProblem('背景音乐'); });
    Audio2.voiceEl.addEventListener('error', () => { Audio2.lastError = 'voice'; noteAudioProblem('语音'); });
    applyVolumes();
  }

  /**
   * 把内联的 data URL 换成一个 Blob URL，再交给 <audio> 播放。
   *
   * 为什么必须这么做：单文件产物会把整段 BGM base64 内联，一段 7.6 MB 的 mp3 就是约 10 MB 的字符串。
   * 桌面 Chrome 直接 `audio.src = 'data:audio/mpeg;base64,…'` 没问题，但**移动端（尤其 iOS Safari
   * 和各类 App 内置浏览器）对超长 data URL 有实现限制**——典型症状就是"电脑上好好的，
   * 有人手机上点开就没声音、甚至卡住"。先解成 Blob 再给 blob: URL，兼容性稳得多；
   * 同一段素材也只解一次。
   */
  const blobUrlCache = new Map();
  function toPlayableUrl(src, key) {
    const s = str(src, '');
    if (!s) return '';
    if (s.indexOf('data:') !== 0) return s;                 // 相对路径 / http 直接用
    const k = str(key, '') || ('len' + s.length);
    if (blobUrlCache.has(k)) return blobUrlCache.get(k);
    try {
      const m = /^data:([^;,]*)((?:;[^,]*)*),(.*)$/s.exec(s);
      if (!m) return s;
      const bin = atob(m[3]);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u8], { type: m[1] || 'application/octet-stream' }));
      blobUrlCache.set(k, url);
      return url;
    } catch (e) {
      return s;   // 解不出来就退回原样，绝不能因为这个把播放整个搞挂
    }
  }

  /** 音频出问题时给一条可关闭的提示（只提示一次） */
  function noteAudioProblem(what) {
    if (Audio2.noted) return;
    Audio2.noted = true;
    try {
      const bar = document.createElement('div');
      bar.setAttribute('data-testid', 'audio-warning');
      bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:99;'
        + 'max-width:90vw;padding:9px 14px;border-radius:10px;font-size:12.5px;line-height:1.5;'
        + 'background:rgba(60,30,20,.94);color:#ffd9c0;border:1px solid rgba(255,180,120,.5)';
      bar.textContent = what + '没能加载出来（浏览器可能不支持这段音频格式）。画面和剧情不受影响，可以继续玩。';
      document.body.appendChild(bar);
      setTimeout(() => { try { bar.remove(); } catch (e) {} }, 9000);
    } catch (e) { /* 提示本身失败无所谓 */ }
  }
  /** 场景级 bgmVolume 作为"这首曲子的相对音量系数" */
  function bgmVolFactor() {
    const sc = currentSceneSafe();
    if (sc && sc.bgmVolume !== null && Number.isFinite(Number(sc.bgmVolume))) {
      return Math.min(1, Math.max(0, Number(sc.bgmVolume)));
    }
    return 1;
  }
  /** 真实音量 = 用户滑块 × 场景系数 × (静音 ? 0 : 1) */

  /**
   * 结局 / 回标题时把声音收干净。
   *
   * 为什么不直接 pause：BGM 硬切会有"啪"的一声，这里做 0.8 秒淡出。
   * 语音和小游戏音轨则直接停 —— 它们是"这一句 / 这一局"的临时声音，没有淡出的必要。
   */
  let bgmFadeTimer = 0;
  function fadeOutAllAudio() {
    if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = 0; }
    stopVoice();
    // 小游戏用的是自己 new 出来的音轨，不在 Audio2 里，得单独停
    if (typeof mgStopAudio === 'function') mgStopAudio();
    const b = Audio2.bgmEl;
    if (!b || b.paused) return;
    const from = b.volume;
    const t0 = performance.now();
    const DUR = 800;
    bgmFadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / DUR);
      try { b.volume = from * (1 - k); } catch { /* ignore */ }
      if (k >= 1) {
        clearInterval(bgmFadeTimer); bgmFadeTimer = 0;
        try { b.pause(); } catch { /* ignore */ }
        applyVolumes();            // 把音量还原成设定值，下次播放才不是 0
      }
    }, 40);
  }
  function applyVolumes() {
    if (!Audio2.bgmEl) return;
    Audio2.bgmEl.volume = State.audio.mute ? 0 : Math.min(1, State.audio.bgmVolume * bgmVolFactor());
    Audio2.voiceEl.volume = State.audio.mute ? 0 : Math.min(1, State.audio.voiceVolume);
  }
  /** 静默降级：被自动播放策略拦下时不报错，只记录 */
  function safePlay(audioEl, tag) {
    if (!audioEl || !audioEl.src) return;
    try {
      const p = audioEl.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => { Audio2.blocked++; if (tag === 'bgm') Audio2.pendingBgm = Audio2.bgmKey; });
      }
    } catch (e) { Audio2.blocked++; }
  }
  /** 首次用户手势：解锁音频（补播被拦下的背景音） */
  function unlockAudio() {
    if (Audio2.unlocked) return;
    Audio2.unlocked = true;
    audioInit();
    applyVolumes();
    const sc = currentScene();
    if (sc) playBgm(sc);                       // 手势后补播当前场景背景音
    else if (Audio2.pendingBgm) retryPendingBgm();
  }
  function retryPendingBgm() {
    if (!Audio2.bgmEl || !Audio2.bgmEl.src) return;
    if (Audio2.bgmEl.paused) safePlay(Audio2.bgmEl, 'bgm');
  }

  /** 场景背景音：同一首不重头播；null 停止 */
  function playBgm(sc) {
    audioInit();
    const bgm = sc ? sc.bgm : null;
    if (!bgm) {
      // null → 停止
      if (Audio2.bgmEl && !Audio2.bgmEl.paused) { try { Audio2.bgmEl.pause(); } catch (e) {} }
      Audio2.bgmKey = ''; Audio2.bgmSrc = ''; Audio2.pendingBgm = null;
      updateBgmUi();
      return;
    }
    if (Audio2.bgmKey === bgm.key && Audio2.bgmEl.src) {
      // 同一首：继续播，只更新循环与音量
      Audio2.bgmEl.loop = sc.bgmLoop !== false;
      applyVolumes();
      if (Audio2.bgmEl.paused && Audio2.unlocked) safePlay(Audio2.bgmEl, 'bgm');
      updateBgmUi();
      return;
    }
    // 换曲
    Audio2.bgmKey = bgm.key;
    Audio2.bgmSrc = bgm.data;
    try {
      Audio2.bgmEl.pause();
      Audio2.bgmEl.src = toPlayableUrl(bgm.data, bgm.key);
      Audio2.bgmEl.loop = sc.bgmLoop !== false;
      Audio2.bgmEl.currentTime = 0;
    } catch (e) { /* 忽略 */ }
    applyVolumes();
    if (Audio2.unlocked) safePlay(Audio2.bgmEl, 'bgm');
    else Audio2.pendingBgm = bgm.key;
    updateBgmUi();
  }

  /**
   * 角色语音。
   * v4：**翻到没配语音的句子时，要掐掉上一句**。
   * 原来这里写的是"空值不打断当前语音"（`if (!a) return false`），
   * 结果上一句会一直念下去——玩家已经翻了好几页，语音还在响。
   */
  function playVoice(v) {
    const a = normAudio(v);
    if (!a) { stopVoice(); Audio2.lastVoice = ''; return false; }
    audioInit();
    try {
      Audio2.voiceEl.pause();
      Audio2.voiceEl.src = toPlayableUrl(a.data, a.key);
      Audio2.voiceEl.currentTime = 0;
      Audio2.voiceEl.loop = false;
    } catch (e) { return false; }
    applyVolumes();
    safePlay(Audio2.voiceEl, 'voice');
    Audio2.lastVoice = a.key;
    return true;
  }
  function stopVoice() { try { Audio2.voiceEl.pause(); } catch (e) {} }

  function setAudioVolume(field, v01) {
    if (field !== 'bgmVolume' && field !== 'voiceVolume') return;
    State.audio[field] = Math.min(1, Math.max(0, Number(v01) || 0));
    State.audio.saved = true;
    Persist.writeAudioSettings();
    applyVolumes();
    updateBgmUi();
  }
  function toggleMute(force) {
    State.audio.mute = (force === undefined) ? !State.audio.mute : !!force;
    State.audio.saved = true;
    Persist.writeAudioSettings();
    applyVolumes();
    updateBgmUi();
    toast(State.audio.mute ? '已静音' : '取消静音');
  }
  /** 初次进入时：未被用户保存过则用 meta 的默认音量 */
  function applyMetaAudio() {
    if (State.audio.saved || !State.data) return;
    State.audio.bgmVolume = clamp01(State.data.meta.bgmVolume, DEFAULT_AUDIO.bgmVolume);
    State.audio.voiceVolume = clamp01(State.data.meta.voiceVolume, DEFAULT_AUDIO.voiceVolume);
  }

  /** 左上角音乐图标 + 面板 */
  function updateBgmUi() {
    if (!el.bgmToggle) return;
    const sc = currentScene();
    const has = !!(Audio2.bgmKey && Audio2.bgmEl && Audio2.bgmEl.src);
    el.bgmToggle.classList.toggle('on', has && !State.audio.mute);
    el.bgmToggle.classList.toggle('muted', !!State.audio.mute);
    el.bgmToggle.textContent = State.audio.mute ? '🔇' : (has ? '🎵' : '🎵');
    el.bgmToggle.title = has ? `音乐：${bgmTitle(sc)}` : '音乐：无';
    if (el.bgmNow) el.bgmNow.textContent = has ? bgmTitle(sc) : '（当前无背景音）';
    updateBgmTitle();
  }
  /** 左上角曲名 chip（无背景音时隐藏） */
  function updateBgmTitle() {
    if (!el.bgmTitle) return;
    const sc = currentScene();
    const has = !!(Audio2.bgmKey && Audio2.bgmEl && Audio2.bgmEl.src);
    if (has && sc) {
      el.bgmTitle.textContent = bgmTitle(sc);
      el.bgmTitle.classList.remove('hidden');
    } else {
      el.bgmTitle.classList.add('hidden');
      el.bgmTitle.textContent = '';
    }
  }
  function bgmTitle(sc) {
    if (!sc) return '未知';
    if (sc.bgmName) return sc.bgmName;
    return sc.name ? `${sc.name} · 背景音` : '背景音';
  }

  function openBgmPanel() {
    audioInit();
    const sc = currentScene();
    const has = !!(Audio2.bgmKey && Audio2.bgmEl && Audio2.bgmEl.src);
    const pct = (v) => Math.round(v * 100);
    const body = `
      <div class="field">
        <div class="field-label">当前曲目<span class="field-note">随场景切换</span></div>
        <div class="bgm-now" data-testid="bgm-now">${esc(has ? bgmTitle(sc) : '（当前无背景音）')}</div>
      </div>
      <div class="field">
        <div class="field-label">音乐音量<span class="field-note">背景音</span></div>
        <div class="slider-wrap">
          <input class="slider" type="range" min="0" max="100" step="1" value="${pct(State.audio.bgmVolume)}" data-testid="bgm-volume" data-audio="bgmVolume">
          <span class="slider-val" data-audio-val="bgmVolume">${pct(State.audio.bgmVolume)}</span>
        </div>
      </div>
      <div class="field">
        <div class="field-label">语音音量<span class="field-note">角色台词配音</span></div>
        <div class="slider-wrap">
          <input class="slider" type="range" min="0" max="100" step="1" value="${pct(State.audio.voiceVolume)}" data-testid="voice-volume" data-audio="voiceVolume">
          <span class="slider-val" data-audio-val="voiceVolume">${pct(State.audio.voiceVolume)}</span>
        </div>
      </div>
      <div class="field">
        <div class="field-label">静音<span class="field-note">一键关闭所有声音</span></div>
        <button class="switch${State.audio.mute ? ' on' : ''}" data-testid="bgm-mute" data-audio-mute="1" aria-label="静音"></button>
      </div>
      <div class="field">
        <div class="field-label">说明<span class="field-note">浏览器可能拦下自动播放，点击画面任意处即可恢复</span></div>
        <button class="seg-btn" data-audio-action="resume">恢复播放</button>
      </div>`;
    openModal('audio', '音乐 / 语音', body, [{ label: '关闭', main: true, onClick: closeModal }]);
    const panel = el.modalRoot.querySelector('.panel');
    if (panel) panel.setAttribute('data-testid', 'bgm-panel');
    const wrap = el.modalRoot.querySelector('.modal');
    if (!wrap) return;
    wrap.querySelectorAll('[data-audio]').forEach((input) => {
      input.addEventListener('input', () => {
        const field = input.getAttribute('data-audio');
        setAudioVolume(field, Number(input.value) / 100);
        const lab = wrap.querySelector(`[data-audio-val="${field}"]`);
        if (lab) lab.textContent = String(Math.round(Number(input.value)));
      });
    });
    const muteBtn = wrap.querySelector('[data-audio-mute]');
    if (muteBtn) muteBtn.addEventListener('click', () => {
      toggleMute();
      muteBtn.classList.toggle('on', !!State.audio.mute);
    });
    const resume = wrap.querySelector('[data-audio-action="resume"]');
    if (resume) resume.addEventListener('click', () => { Audio2.unlocked = true; retryPendingBgm(); toast('已尝试恢复播放'); });
  }

  /* ==========================================================================
   * 模块 6 · Save / Load
   * ========================================================================== */
  function buildSave() {
    const sc = currentScene();
    return {
      v: 1,
      at: Date.now(),
      title: State.data.meta.title,
      sceneId: State.sceneId,
      lineIdx: Math.max(0, State.lineIdx),
      sceneName: sc ? sc.name : '',
      vars: clone(State.vars) || {},
      sprites: spriteSnapshot(),
      // bgId = 存档那一刻真正显示的背景（可能是行级 background 覆盖的结果）
      bgId: State.bgId || (sc ? sc.background : ''),
      sceneBgId: sc ? sc.background : '',
      varsCount: Object.keys(State.vars).length,
      progress: State.visitedOrder.length
    };
  }
  function slotSummary(s) {
    if (!s) return { name: '空存档位', meta: '尚无记录', empty: true };
    const scName = str(s.sceneName, '') || str(s.sceneId, '');
    return {
      name: scName || '（未知场景）',
      meta: `${fmtTime(s.at)} · 变量 ${int(s.varsCount, 0)} 项`,
      empty: false
    };
  }
  function autoSave() {
    if (!State.data || State.dataErr) return;
    if (State.phase === 'title' || State.phase === 'ending') return;
    if (!currentScene()) return;
    LS.setJSON(KEY.autosave, buildSave());
    refreshContinueButton();
  }
  function saveToSlot(i) {
    if (!State.data) return false;
    if (!currentScene()) { toast('当前无可存档进度'); return false; }
    LS.setJSON(KEY.slot(i), buildSave());
    State.hasSave = true;
    refreshContinueButton();
    toast(`已存入槽位 ${i}`);
    return true;
  }
  function loadFrom(save) {
    const s = obj(save);
    if (!s.sceneId || !State.data.sceneMap[str(s.sceneId, '')]) { toast('存档已损坏：场景不存在'); return false; }
    State.vars = obj(clone(s.vars));
    State.history = [];
    State.pendingChoice = null;
    clearDeferredExit();          // 读档按快照精确恢复，不带任何待退场登记
    State.visitedOrder = [str(s.sceneId, '')];
    State.steps = 0;
    closeModal();
    showScreen('game');
    clearSprites();
    const ok = enterScene(str(s.sceneId, ''), Math.max(0, int(s.lineIdx, 0)), { autosave: false, keepStage: true });
    if (!ok) { toast('存档已损坏：场景不存在'); backToTitle('存档损坏'); return false; }
    // 背景：先按落点这一行 / 场景确定（enterScene 已处理行级覆盖），
    // 再用存档里记录的“当时背景”兜底（兼容旧存档与脚本改动）。
    const sc = currentScene();
    const saveBg = str(s.bgId, '');
    if (saveBg && bgById(saveBg) && saveBg !== Runtime.bgCurrent) {
      const bg = applyBackground(saveBg);
      State.bgId = bg ? bg.id : saveBg;
    } else if (sc && !State.bgId) {
      State.bgId = sc.background;
    }
    restoreSprites(s.sprites);
    State.phase = 'line';
    // 从存档行继续执行（选项行会重新给出选项）
    execLine();
    updateAutoButton();
    toast('读取成功');
    return true;
  }

  function refreshContinueButton() {
    const auto = Persist.readAuto();
    const anySlot = [1, 2, 3].map((i) => Persist.readSlot(i)).filter(Boolean);
    State.hasSave = !!(auto || anySlot.length);
    el.btnContinue.disabled = !State.hasSave;
    el.btnContinue.title = State.hasSave ? `自动存档：${fmtTime(auto ? auto.at : (anySlot[0] && anySlot[0].at))}` : '暂无可读存档';
  }

  /* ==========================================================================
   * 模块 7 · Screens —— 标题 / 开始 / 回标题 / 面板内容
   * ========================================================================== */
  function renderTitleScreen() {
    const d = State.data;
    const m = d.meta;
    el.titleMain.textContent = m.title;
    el.titleSub.textContent = m.subtitle || (m.author ? 'by ' + m.author : '');
    el.titleSynopsis.textContent = m.synopsis || '（本作品暂无简介）';
    el.titleTags.innerHTML = m.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('');
    // v2：封面图（data URL）；为 null/缺失时维持 theme 渐变背景
    if (el.coverImage) {
      if (m.cover) {
        el.coverImage.style.backgroundImage = `url("${m.cover}")`;
        el.coverImage.classList.add('on');
        el.titleScreen.classList.add('has-cover');
      } else {
        el.coverImage.style.backgroundImage = '';
        el.coverImage.classList.remove('on');
        el.titleScreen.classList.remove('has-cover');
      }
    }
    const bits = [];
    if (m.author) bits.push(`作者：${m.author}`);
    if (m.version) bits.push(`v${m.version}`);
    if (d.scenes.length) bits.push(`${d.scenes.length} 个场景`);
    if (d.endings.length) bits.push(`${d.endings.length} 个结局`);
    el.titleFoot.textContent = bits.join(' · ');

    const warns = [];
    if (State.fatal) warns.push(State.fatal);
    if (!d.scenes.length) warns.push('剧本中没有任何场景（scenes 为空），无法开始游戏。请检查生成数据。');
    if (!d.characters.length) warns.push('剧本没有角色定义（characters 为空），台词将仅显示文本。');
    if (d.warnings.length) warns.push('数据提示：' + d.warnings.slice(0, 4).join('；') + (d.warnings.length > 4 ? ` 等 ${d.warnings.length} 条` : ''));
    if (warns.length) { el.titleWarn.classList.remove('hidden'); el.titleWarn.innerHTML = warns.map((w) => `<div>⚠ ${esc(w)}</div>`).join(''); }
    else { el.titleWarn.classList.add('hidden'); el.titleWarn.textContent = ''; }

    el.btnStart.disabled = !d.scenes.length;
    el.btnGallery.disabled = !d.endings.length;
    document.title = m.title;
    refreshContinueButton();
  }

  function backToTitle(reason) {
    fadeOutAllAudio();   // 回标题也要把声音收干净
    State.phase = 'title';
    State.pendingChoice = null;
    State.currentLine = null;
    clearAutoTimers();
    stopTypewriter();
    hideChoice();
    closeModal();
    if (reason) State.fatal = str(reason, '');
    showScreen('title');
    renderTitleScreen();
    updateAutoButton();
  }
  function fatal(msg) {
    toast(msg, 2600);
    setTimeout(() => backToTitle(msg), 700);
  }

  function startGame() {
    const d = State.data;
    if (!d.scenes.length) { toast('没有可播放的场景'); return; }
    State.fatal = '';
    State.vars = {};
    State.history = [];
    State.sprites = {};
    State.pendingChoice = null;
    clearDeferredExit();
    State.visitedOrder = [];
    State.steps = 0;
    State.phase = 'line';
    el.dbox.setAttribute('data-narration', '0');
    el.dtext.textContent = '';
    setSpeaker(null);
    clearSprites();
    // v3：点击「开始游戏」是明确的用户手势 → 解锁音频
    unlockAudio();
    showScreen('game');
    if (!enterScene(d.start, 0)) { fatal('起始场景不存在'); return; }
    execLine();
    updateAutoButton();
    updateBgmUi();
  }

  /* ------------------------------ 设置面板 ------------------------------ */
  function openSettings() {
    const s = State.settings;
    const body = `
      <div class="field">
        <div class="field-label">文字速度<span class="field-note">打字机逐字显示速度</span></div>
        ${segHTML('textSpeed', [{ value: 'slow', label: '慢' }, { value: 'medium', label: '中' }, { value: 'fast', label: '快' }, { value: 'instant', label: '瞬间' }], s.textSpeed)}
      </div>
      <div class="field">
        <div class="field-label">字号<span class="field-note">对话框文字大小</span></div>
        ${segHTML('fontSize', [{ value: 'small', label: '小' }, { value: 'medium', label: '中' }, { value: 'large', label: '大' }], s.fontSize)}
      </div>
      <div class="field">
        <div class="field-label">自动播放<span class="field-note">文本显示完毕后自动推进</span></div>
        <button class="switch${s.autoPlay ? ' on' : ''}" data-toggle="autoPlay" aria-label="自动播放"></button>
      </div>
      <div class="field">
        <div class="field-label">自动间隔<span class="field-note">每行停留时长</span></div>
        ${segHTML('autoInterval', [{ value: '1200', label: '1.2s' }, { value: '2200', label: '2.2s' }, { value: '3500', label: '3.5s' }, { value: '5000', label: '5s' }], String(s.autoInterval))}
      </div>
      <div class="field">
        <div class="field-label">跳过已读<span class="field-note">已读文本瞬间显示（快速推进）</span></div>
        <button class="switch${s.skipRead ? ' on' : ''}" data-toggle="skipRead" aria-label="跳过已读"></button>
      </div>
      <div class="field">
        <div class="field-label">数据<span class="field-note">存储于浏览器 localStorage</span></div>
        <div class="seg">
          <button class="seg-btn" data-action="clear-autosave">清空自动存档</button>
          <button class="seg-btn" data-action="clear-all">重置全部数据</button>
        </div>
      </div>`;
    openModal('settings', '设置', body, [
      { label: '关闭', main: true, onClick: closeModal }
    ]);
    const wrap = el.modalRoot.querySelector('.modal');
    wrap.querySelectorAll('[data-seg-field]').forEach((b) => {
      b.addEventListener('click', () => {
        const field = b.getAttribute('data-seg-field');
        const value = b.getAttribute('data-seg-value');
        if (field === 'textSpeed' && SPEEDS.indexOf(value) >= 0) State.settings.textSpeed = value;
        else if (field === 'fontSize' && ['small', 'medium', 'large'].indexOf(value) >= 0) State.settings.fontSize = value;
        else if (field === 'autoInterval') State.settings.autoInterval = Math.min(8000, Math.max(600, num(value, 2200)));
        Persist.writeSettings();
        applyFontSize();
        updateAutoButton();
        b.parentElement.querySelectorAll('.seg-btn').forEach((x) => x.classList.toggle('on', x === b));
        if (field === 'autoInterval' || field === 'textSpeed') {
          // 已显示的文本按新速度立即补全，避免半截文本卡住
          if (State.phase === 'line' && !Runtime.type.done) finishType();
        }
      });
    });
    wrap.querySelectorAll('[data-toggle]').forEach((b) => {
      b.addEventListener('click', () => {
        const f = b.getAttribute('data-toggle');
        State.settings[f] = !State.settings[f];
        b.classList.toggle('on', !!State.settings[f]);
        Persist.writeSettings();
        updateAutoButton();
      });
    });
    wrap.querySelectorAll('[data-action]').forEach((b) => {
      b.addEventListener('click', () => {
        const a = b.getAttribute('data-action');
        if (a === 'clear-autosave') { LS.del(KEY.autosave); refreshContinueButton(); toast('自动存档已清空'); }
        if (a === 'clear-all') {
          LS.del(KEY.autosave);
          [1, 2, 3].forEach((i) => LS.del(KEY.slot(i)));
          LS.del(KEY.gallery); LS.del(KEY.read); LS.del(KEY.settings);
          State.gallery = {}; State.readSet = new Set();
          State.settings = Object.assign({}, DEFAULT_SETTINGS);
          Persist.writeSettings(); applyFontSize(); updateAutoButton(); refreshContinueButton();
          toast('全部数据已重置');
        }
      });
    });
  }

  /* ------------------------------ 存档面板 ------------------------------ */
  function openSaves() {
    const rows = [];
    const auto = Persist.readAuto();
    const sum = slotSummary(auto);
    rows.push(`<div class="slot${sum.empty ? ' empty' : ''}" data-slot="auto">
        <div class="slot-info"><div class="slot-name">自动存档 · ${esc(sum.name)}</div><div class="slot-meta">${esc(sum.meta)}</div></div>
        <div class="slot-actions">
          <button class="btn btn-ghost btn-sm" data-slot-load="auto"${sum.empty ? ' disabled' : ''}>读取</button>
          <button class="btn btn-ghost btn-sm" data-slot-del="auto"${sum.empty ? ' disabled' : ''}>删除</button>
        </div>
      </div>`);
    [1, 2, 3].forEach((i) => {
      const s = Persist.readSlot(i);
      const m = slotSummary(s);
      rows.push(`<div class="slot${m.empty ? ' empty' : ''}" data-slot="${i}">
        <div class="slot-info"><div class="slot-name">槽位 ${i} · ${esc(m.name)}</div><div class="slot-meta">${esc(m.meta)}</div></div>
        <div class="slot-actions">
          <button class="btn btn-main btn-sm" data-slot-save="${i}"${State.playMode === 'game' ? '' : ' disabled'}>保存</button>
          <button class="btn btn-ghost btn-sm" data-slot-load="${i}"${m.empty ? ' disabled' : ''}>读取</button>
          <button class="btn btn-ghost btn-sm" data-slot-del="${i}"${m.empty ? ' disabled' : ''}>删除</button>
        </div>
      </div>`);
    });
    openModal('saves', '存档 / 读档', `<div class="slot-list">${rows.join('')}</div>`, [{ label: '关闭', main: true, onClick: closeModal }]);
    const wrap = el.modalRoot.querySelector('.modal');
    wrap.addEventListener('click', (ev) => {
      const t = ev.target;
      if (!(t instanceof HTMLElement)) return;
      const sv = t.getAttribute('data-slot-save');
      const ld = t.getAttribute('data-slot-load');
      const dl = t.getAttribute('data-slot-del');
      if (sv) { saveToSlot(int(sv, 1)); openSaves(); return; }
      if (ld) {
        const save = ld === 'auto' ? Persist.readAuto() : Persist.readSlot(int(ld, 1));
        if (save) loadFrom(save); else toast('该槽位没有存档');
        return;
      }
      if (dl) {
        if (dl === 'auto') LS.del(KEY.autosave); else LS.del(KEY.slot(int(dl, 1)));
        refreshContinueButton(); openSaves(); toast('已删除');
      }
    });
  }

  /* ------------------------------ 图鉴面板 ------------------------------ */
  function openGallery() {
    const d = State.data;
    if (!d.endings.length) { toast('本作品没有结局数据'); return; }
    const unlocked = d.endings.filter((e) => State.gallery[e.id]).length;
    const cards = d.endings.map((e) => {
      const got = State.gallery[e.id];
      if (!got) {
        return `<div class="gallery-item locked" data-kind="${esc(e.kind)}">
            <div class="gallery-kind">???</div>
            <div class="gallery-title">???</div>
            <div class="gallery-text">尚未解锁的结局</div>
            <div class="gallery-date">—</div>
          </div>`;
      }
      return `<div class="gallery-item" data-kind="${esc(e.kind)}" data-ending="${esc(e.id)}">
          <div class="gallery-kind">${esc(e.kind.toUpperCase())}</div>
          <div class="gallery-title">${esc(e.title)}</div>
          <div class="gallery-text">${esc(e.text)}</div>
          <div class="gallery-date">${esc(fmtTime(got.at))}</div>
        </div>`;
    }).join('');
    const head = `<div class="field-note" style="margin-bottom:10px">已解锁 ${unlocked} / ${d.endings.length}</div>`;
    openModal('gallery', '结局图鉴', head + `<div class="gallery-grid">${cards}</div>`, [{ label: '关闭', main: true, onClick: closeModal }]);
  }

  /* ------------------------------ 历史面板 ------------------------------ */
  function openHistory() {
    const list = State.history;
    const body = list.length
      ? `<div class="history-list" data-testid="history-panel">${list.map((h) => `
          <div class="history-entry">
            <div class="history-who${h.narr ? ' narr' : ''}"${h.color ? ` style="color:${esc(h.color)}"` : ''}>${esc(h.name)}</div>
            <div class="history-text">${esc(h.text)}</div>

      : `<div class="empty-tip" data-testid="history-panel">还没有任何对话记录。<br>开始游戏后，已读文本会出现在这里。</div>`;

  /* --------------------- v2 立绘 + 好感度面板 --------------------- */
  /** 角色的可用立绘 key 列表（default 优先），没有图时返回空数组 */
  function spriteVariants(ch) {
    const s = obj(ch.sprites);
    return Object.keys(s).filter((k) => typeof s[k] === 'string' && s[k]);
  }
  /** 当前好感度：变量不存在按 0；只接受有限数，其余按 0 */
  function affectionOf(ch) {
    const raw = State.vars[ch.affectionKey];
    const n = (typeof raw === 'number' && Number.isFinite(raw)) ? raw : Number(raw);
    return Number.isFinite(n) ? n : 0;
  }
  /** 好感度百分比（0~100，量程 clamp，数值可为负/超量程） */
  function affectionPct(ch) {
    const max = Math.max(1, num(State.data.meta.affectionMax, 20));
    return Math.max(0, Math.min(100, Math.round(affectionOf(ch) / max * 100)));
  }

  function openAffection() {
    const d = State.data;
    if (!d.characters.length) {
      openModal('affection', '角色 / 好感度', '<div class="empty-tip">剧本里没有角色定义（characters 为空）。</div>', [{ label: '关闭', main: true, onClick: closeModal }]);
      el.modalRoot.querySelector('.panel').setAttribute('data-testid', 'affection-panel');
      return;
    }
    const max = Math.max(1, num(d.meta.affectionMax, 20));
    // v4：**只列有意义的角色** —— 有 affectionKey 的才出现。
    //     有 key 的两种情况：正经可攻略角色，以及刚子/猴子这种"不能攻略但好感度决定结局"的。
    //     李主任、路人、酱海鸟、嘉豪这些纯剧情角色不再白占位置。
    const roster = d.characters.filter((c) => c.romanceable !== false || c.showAffection === true);
    const rows = roster.map((ch) => {
      const variants = spriteVariants(ch);
      const roman = ch.romanceable !== false;
      const val = affectionOf(ch);
      const pct = affectionPct(ch);
      const meter = roman
        ? `<div class="aff-meter-top">
             <span class="aff-meter-label">${esc(ch.affectionLabel)}</span>
             <span class="aff-meter-value" data-testid="affection-value" style="color:${esc(ch.color)}">${esc(fmtVar(val))}<small>/ ${esc(String(max))}</small></span>
           </div>
           <div class="aff-bar"><i style="width:${pct}%"></i></div>`
        : `<div class="aff-meter-top">
             <span class="aff-meter-label">${esc(ch.affectionLabel)}<em class="aff-tag">影响结局</em></span>
             <span class="aff-meter-value" data-testid="affection-value" style="color:${esc(ch.color)}">${esc(fmtVar(val))}<small>/ ${esc(String(max))}</small></span>
           </div>
           <div class="aff-bar"><i style="width:${pct}%"></i></div>`;
      return `<div class="aff-row${roman ? '' : ' aff-noromance-row'}" data-testid="affection-row" data-char="${esc(ch.id)}" data-romanceable="${roman ? '1' : '0'}">
        <div class="aff-portrait" data-aff-portrait="${esc(ch.id)}">
          ${portraitHTML(ch, variants, variants[0])}
        </div>
        <div class="aff-body">
          <div class="aff-head">
            <span class="aff-name" style="color:${esc(ch.color)}">${esc(ch.name)}</span>
            ${ch.role ? `<span class="aff-role">${esc(ch.role)}</span>` : ''}
          </div>
          ${ch.profile ? `<div class="aff-profile">${esc(ch.profile)}</div>` : ''}
          ${meter}
        </div>
      </div>`;
    }).join('');
    const body = `<div class="aff-list">${rows}</div>
      <div class="aff-foot-note">数值实时取自当前变量表：${roster.length ? roster.map((c) => `${esc(c.affectionKey)}`).join('、') : '（无）'}；量程 ${max}。
      共 ${roster.length} 名角色有关系数值（${roster.filter((c) => c.romanceable !== false).length} 名可攻略 + ${roster.filter((c) => c.romanceable === false).length} 名影响结局）。</div>`;
    openModal('affection', '角色 / 好感度', body, [{ label: '关闭', main: true, onClick: closeModal }]);
    const panel = el.modalRoot.querySelector('.panel');
    if (panel) panel.setAttribute('data-testid', 'affection-panel');

    // 多立绘左右切换（事件委托：面板只挂一次监听）
    const wrap = el.modalRoot.querySelector('.modal');
    if (wrap) {
      wrap.addEventListener('click', (ev) => {
        const t = ev.target;
        if (!(t instanceof HTMLElement)) return;
        const prev = t.getAttribute('data-aff-prev');
        const next = t.getAttribute('data-aff-next');
        if (!prev && !next) return;
        const id = prev || next;
        const ch = d.charMap[id];
        if (!ch) return;
        const variants = spriteVariants(ch);
        if (variants.length < 2) return;
        const stateKey = 'affKey' + id;
        const curKey = wrap.dataset[stateKey] || variants[0];
        let idx = variants.indexOf(curKey);
        if (idx < 0) idx = 0;
        idx = (idx + (next ? 1 : variants.length - 1)) % variants.length;
        wrap.dataset[stateKey] = variants[idx];
        const box = wrap.querySelector(`[data-aff-portrait="${id}"]`);
        if (box) box.innerHTML = portraitHTML(ch, variants, variants[idx]);
      });
    }
  }

  /** 立绘槽内容（含多立绘切换条） */
  function portraitHTML(ch, variants, curKey) {
    // 注意：立绘 key 是 spriteMarkup 的**第二个参数**，不要塞进对象里
    return spriteMarkup({ id: ch.id, name: ch.name, sprites: ch.sprites, placeholder: ch.placeholder }, curKey || 'default')
      + (variants.length > 1 ? `<div class="aff-portrait-nav">
            <button type="button" data-aff-prev="${esc(ch.id)}" aria-label="上一张立绘">‹</button>
            <span class="aff-sprite-name">${esc(curKey || variants[0])}</span>
            <button type="button" data-aff-next="${esc(ch.id)}" aria-label="下一张立绘">›</button>
          </div>` : '');
  }

  /* ------------------------------ 菜单（Esc） ------------------------------ */
