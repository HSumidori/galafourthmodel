:"dialogue","speaker":"me","text":"你跑第二。这得喝。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……第二名有什么好喝的。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"narration","text":"他嘴上这么说，还是拧开了。"},{"type":"dialogue","speaker":"lijie","text":"你刚才喊的。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"啊？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"看台上。你喊的那句。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"喊了。怎么了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……没什么。吵死了。","pose":"center","sprite":"angry","enter":false,"exit":false,"voice":"assets/a-52fc57ae02bbf672.mp3"},{"type":"narration","text":"他说完把水喝完了。"},{"type":"narration","text":"空瓶子捏在手里捏得咔咔响，但一直没扔。"},{"type":"narration","text":"吵死了。行吧，那我下次还喊。"}],"next":"1-2a"},{"id":"1-2d","chapter":1,"name":"去主席台给周勇递水","background":"playground","bgm":null,"lines":[{"type":"narration","text":"我拎着水上了主席台。"},{"type":"dialogue","speaker":"zhouyong","text":"干什么。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"老师，喝水。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"不用。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"那我放这儿了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我把水放在他手边的桌上，转身要走。"},{"type":"dialogue","speaker":"zhouyong","text":"……哎。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"我回头。"},{"type":"dialogue","speaker":"zhouyong","text":"你们班刚才喊的那些，是你带的头？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"是。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他没说好，也没说不好。"},{"type":"narration","text":"但等我走远了，身后传来拧瓶盖的声音。"},{"type":"narration","text":"他等我走远了才喝。这人脸皮薄得跟纸一样，还非要当班主任。"}],"next":"1-2a"},{"id":"1-2e","chapter":1,"name":"去找杜小葵","background":"playground","bgm":null,"lines":[{"type":"narration","text":"我在人群里找到了杜小葵。他正蹲在地上给个崴了脚的学生看脚踝。"},{"type":"dialogue","speaker":"duxiaokui","text":"哎你来得正好，帮我拿下喇叭。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"老师你还会看脚？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"不会。但我会喊忍一下。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"passerby","text":"……老师你能不能专业一点。","pose":"left","sprite":"s1","enter":false,"exit":true},{"type":"dialogue","speaker":"duxiaokui","text":"我很专业。我专业的地方在于——我知道什么时候该叫校医。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"narration","text":"他把喇叭往我手里一塞，站起来朝医务室方向挥手。"},{"type":"dialogue","speaker":"duxiaokui","text":"校医！这边！","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-2697302e926b56fb.mp3"},{"type":"narration","text":"他什么都不会。但他在场，那个崴脚的学生就不慌了。这也是一种本事，而且不是每个人都有的那种。"}],"next":"1-2a"},{"id":"1-3","chapter":1,"name":"48 分","background":"classroom","bgm":"assets/a-0481af9311d63a58.m4a","lines":[{"type":"narration","text":"周一早上，所有人的抽屉里都多了张纸。"},{"type":"narration","text":"不是试卷，是李主任亲笔签名的抽测通知。"},{"type":"dialogue","speaker":"houzi","text":"抽测？什么抽测？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"杜小葵在门口探了个头。"},{"type":"dialogue","speaker":"duxiaokui","text":"就是考试。今天下午。全年级。李主任昨晚临时决定的。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"gangzi","text":"今天下午？！考什么？","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"duxiaokui","text":"语数英全考。祝你们好运，我先去避难了。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"narration","text":"教室瞬间变成了菜市场。"},{"type":"narration","text":"李主任的手段一向如此。不提前通知，不给复习时间。因为他要看的不是你的分数，是你在毫无准备时的真实水平。说白了，他要的是管理有成效的数据。从管理者的角度讲，这很合理。从学生的角度讲，这叫不讲武德。"},{"type":"narration","text":"下午考完，第二天出分。"},{"type":"narration","text":"我的英语，48。"},{"type":"narration","text":"这个分数已经不能用差来形容了。这叫未参与。行。那就从今天开始参与。"},{"type":"narration","text":"成绩单上，李杰的英语是 142。"},{"type":"narration","text":"成绩单发下来那天下午，我把它翻来覆去看了好几遍。"},{"type":"narration","text":"这个分数要是个人，我现在就想跟它聊聊。"},{"type":"choice","prompt":"第一个想找谁说？","options":[{"text":"去找李杰。他成绩单塞得比我还快，肯定有鬼。","goto":"1-3-c","ending":"","effects":{"affection.lijie":10}},{"text":"去办公室找杜小葵。他昨天说不会用是可以教的。","goto":"1-3-c","ending":"","effects":{"affection.duxiaokui":10}},{"text":"去年级办公室找周勇。他不会安慰人，但会给办法。","goto":"1-3-c","ending":"","effects":{"affection.zhouyong":10}},{"text":"去找刚子和猴子。这件事必须有人陪我一起丢人。","goto":"1-3-c","ending":"","effects":{"affection.gangzi":12,"affection.houzi":12}}]}],"next":"1-4","bgmName":"失落","bgmLoop":true},{"id":"1-4","chapter":1,"name":"补习地狱","background":"classroom","bgm":"assets/a-1f7e90c5bd71dad6.m4a","lines":[{"type":"narration","text":"放学铃一响，几条路同时在我面前打开了。"},{"type":"choice","prompt":"怎么补英语？","options":[{"text":"求李杰补习","goto":"1-4a","ending":"","effects":{"affection.lijie":20}},{"text":"被杜小葵拎去办公室","goto":"1-4b","ending":"","effects":{"affection.duxiaokui":20}},{"text":"跟刚子猴子想歪点子","goto":"1-4c","ending":"","effects":{"affection.gangzi":18,"affection.houzi":18,"flags.rule_broken":1}},{"text":"什么都不做，等死","goto":"1-4d","ending":"","effects":{"affection.zhouyong":5,"flags.lazy":true}}]}],"bgmName":"安静","bgmLoop":true},{"id":"1-4a","chapter":1,"name":"傲娇学霸的私人课堂","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"放学铃一响，我抱着卷子冲到李杰桌前。"},{"type":"dialogue","speaker":"me","text":"帮我补英语。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"不。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"为什么。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"因为我不会教人。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"你上次给猴子讲完形填空，他当场就懂了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……那是他运气好。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"me","text":"是运气好，还是你讲得好？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李杰捏着笔的手指动了一下。"},{"type":"dialogue","speaker":"lijie","text":"……坐。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"dialogue","speaker":"me","text":"啊？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我说坐。椅子搬过来。就一节课的时间，多了我不干。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"narration","text":"我把椅子搬过去。他从书包里掏出本已经翻烂的笔记本，扔到我桌上。"},{"type":"dialogue","speaker":"lijie","text":"这是我高一的错题本。先看虚拟语气那章。看完把这十道题做了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"……你居然留着高一的错题本？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"怎么了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"没怎么。就是觉得你这人挺有毅力的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"少废话，做题。","pose":"center","sprite":"angry","enter":false,"exit":false,"voice":"assets/a-ecff5e94753f951e.mp3"},{"type":"narration","text":"半小时后，我做完了，对了七道。"},{"type":"dialogue","speaker":"lijie","text":"……七道。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"me","text":"比 48 分强多了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你那是蒙的吧。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"有本事你也蒙。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他瞪了我一眼，然后拿起红笔，一道一道给我讲错的那几道。"},{"type":"narration","text":"讲得很细。细到我甚至能听出来，他其实早就知道我哪几道会错。"},{"type":"narration","text":"他备课了。嘴上说就一节课的时间，但他提前准备过。这人连答应帮个小忙，都要偷偷做到位，被发现了还要说顺手。"},{"type":"narration","text":"一节课结束，他合上本子。"},{"type":"dialogue","speaker":"lijie","text":"以后每周固定两天，放学你过来。一节课，不许迟到。","pose":"center","sprite":"angry","enter":false,"exit":false,"voice":"assets/a-62c4716fa4c65156.mp3"},{"type":"dialogue","speaker":"me","text":"你这是要长期管我？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我是怕你下次考 30 分，丢人。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"丢谁的人？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……丢三区的人。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"narration","text":"说完他就开始收拾书包，动作快得像在逃跑。"}],"next":"1-5"},{"id":"1-4b","chapter":1,"name":"亦师亦友的特别辅导","background":"office","bgm":null,"lines":[{"type":"narration","text":"杜小葵的办公桌是我见过最像杂货铺的办公桌。"},{"type":"narration","text":"试卷、润喉糖、坏掉的耳机、几支笔，"},{"type":"narration","text":"还有只看起来像是他自己画的卡通猫。"},{"type":"dialogue","speaker":"duxiaokui","text":"坐坐坐。哎你别坐那把椅子，那把会响。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"响了会怎么样？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"会被李主任听见。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"narration","text":"我坐到了另一把上。"},{"type":"dialogue","speaker":"duxiaokui","text":"48 分。你知道这个分数最妙的地方在哪吗？","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-ef37ae5807e2d022.mp3"},{"type":"dialogue","speaker":"me","text":"在哪？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"它证明你至少来了。你要是真没学，你会考 20 分。48 分说明你背了单词，但不会用。这是好事——不会用是可以教的，没背过是没救的。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"很少有老师会从 48 分里找出好事。大部分人只会说你怎么这么差。而他在找让我愿意再试的切入点。"},{"type":"dialogue","speaker":"duxiaokui","text":"来，我们不看卷子。我问你个问题。我喜欢吃苹果，这句用英语怎么说。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-3511105bdbc1e7d1.mp3"},{"type":"dialogue","speaker":"me","text":"I like eat apple.","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"接近了！问题出在 like 后面要加 doing，或者 to do。你想想，我说我喜欢吃，这个吃是个持续的动作，所以——","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-dde8e658288143d8.mp3"},{"type":"dialogue","speaker":"me","text":"所以是 liking？不对。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"哎，你反应挺快的嘛。是 eating 或者 to eat。来，再说。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"I like eating apples.","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"对了！","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-71594f5170d73ac6.mp3"},{"type":"narration","text":"他拍了一下桌子，震得那支坏耳机掉到了地上。"},{"type":"dialogue","speaker":"duxiaokui","text":"你看，你不是不会。你是没人告诉你为什么。光背规则的人考不好英语，因为规则是用来解释的，不是用来背的。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"narration","text":"那天晚上他给我讲了很久。"},{"type":"narration","text":"没让我做卷子，只是让我不停地说、不停地错、不停地改。"},{"type":"narration","text":"走的时候我嗓子都哑了。"},{"type":"dialogue","speaker":"duxiaokui","text":"哎等一下。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"嗯？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"这个给你。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"narration","text":"他从抽屉里掏出一颗润喉糖。"},{"type":"dialogue","speaker":"duxiaokui","text":"嗓子哑了明天上课就没法跟我抬杠了，那可不行。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"老师，你这是把我当相声搭子养呢？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"对啊。你以为我为什么留你补课？我们办公室那几位，能接住我梗的没有。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d3c2b626afc6e25c.mp3"},{"type":"narration","text":"他嘴上说是找搭子。但我注意到，他抽屉里的润喉糖是整盒的。不需要经常说话的人，不会备整盒润喉糖。他每天要讲多少话，才能吃掉这么多。"}],"next":"1-5"},{"id":"1-4c","chapter":1,"name":"三区兄弟的作案现场","background":"corridor","bgm":"assets/a-1c90191e34ab77b3.m4a","lines":[{"type":"narration","text":"我还没决定去哪，刚子和猴子已经从左右两边把我架起来了。"},{"type":"dialogue","speaker":"gangzi","text":"兄弟，补什么课。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"补课是最没效率的。我们有个更高效的办法。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"什么办法。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"我们翻墙出去，去网吧查标准答案。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"……我们学校没网。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"网吧有啊。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"我们翻墙出去要经过李主任办公室。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那咋了，受着呗。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"你这句话迟早要出事。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"过了一会儿，我们仨贴在三楼走廊的墙边，距离楼梯口没几步。"},{"type":"dialogue","speaker":"houzi","text":"安全。李主任去开会了。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"走走走。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"然后，走廊尽头的门开了。"},{"type":"narration","text":"周勇拿着保温杯走出来，看着我们仨。"},{"type":"narration","text":"安静了挺久。"},{"type":"dialogue","speaker":"zhouyong","text":"……你们仨，这是往哪儿去。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"老师，我们——","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"想好了再说。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"这就是周勇。他不问我们是不是要翻墙。他把问题抛过来，让你自己挑个说法。行。那我挑最实在的那种。"},{"type":"choice","prompt":"","options":[{"text":"去操场跑步。","goto":"1-4c-2","ending":"","effects":{"affection.zhouyong":8,"affection.gangzi":-5,"affection.houzi":-5}},{"text":"老师，我们错了。","goto":"1-4c-1","ending":"","effects":{"affection.zhouyong":15,"flags.punished":1}},{"text":"老师，我们是去给你买水。","goto":"1-4c-3","ending":"","effects":{"affection.zhouyong":5,"flags.rule_broken":1}},{"text":"不说话。","goto":"1-4c-4","ending":"","effects":{"affection.zhouyong":12,"flags.zhouyong_curious":true}}]}],"bgmName":"胡闹","bgmLoop":true},{"id":"1-4c-1","chapter":1,"name":"选 B：打扫器材室","background":"corridor","bgm":null,"lines":[{"type":"dialogue","speaker":"zhouyong","text":"器材室。半小时。扫完自己走。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"……行吧。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"老师，我们仨一起？","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"你们仨一起的，当然一起扫。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"器材室里全是灰。刚子拿起扫帚的那一刻，"},{"type":"narration","text":"善良人格上线了——他扫得比谁都认真，连角落里的旧篮球都挨个擦干净了。"},{"type":"dialogue","speaker":"houzi","text":"你干嘛啊，又不是自己家。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"看着难受。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"……","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"猴子也默默拿起了抹布。"},{"type":"narration","text":"半小时后，器材室干净得能当教室用。"},{"type":"narration","text":"第二天早上，我们仨发现自己的课桌上各多了瓶矿泉水。"},{"type":"narration","text":"瓶身上没写字。"},{"type":"dialogue","speaker":"houzi","text":"谁给的？","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"不知道。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"整个学校，只有他会 在你被罚的第二天给你水，而且不让你知道。那个人就坐在主席台上，脸比谁都冷。"}],"next":"1-5"},{"id":"1-4c-2","chapter":1,"name":"选 A：去操场跑步","background":"corridor","bgm":null,"lines":[{"type":"set","effects":{"affection.zhouyong":8,"affection.gangzi":-5,"affection.houzi":-5}},{"type":"dialogue","speaker":"me","text":"去操场跑步。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"哦。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他让开了半步。"},{"type":"narration","text":"我拉着刚子和猴子往操场走。走出去十几米，猴子回头看了一眼。"},{"type":"dialogue","speaker":"houzi","text":"他还在看我们。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"看就看呗。","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"我知道他在看。我也知道他其实什么都清楚——那个点操场上根本没有我们的体育课。他放了我们。但我们仨那天在操场上跑了整整一节课，没人偷懒。"},{"type":"narration","text":"刚子和猴子会记着你刚才撇下他们自己说话这件事。"}],"next":"1-5"},{"id":"1-4c-3","chapter":1,"name":"选 C：买水","background":"office","bgm":null,"lines":[{"type":"set","effects":{"affection.zhouyong":5,"flags.rule_broken":1}},{"type":"dialogue","speaker":"me","text":"老师，我们是去给你买水。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"……给我？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"对。你保温杯里那个，我上周看见是白开水。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"安静了。"},{"type":"dialogue","speaker":"gangzi","text":"（小声）兄弟你完了。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"（小声）他真知道。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"……刚子，猴子。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"在！","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"在！","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"器材室，打扫。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"那我们仨……","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"zhouyong","text":"你们仨一起的，当然一起扫。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"老师，那我呢？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"你跟我去办公室。把刚才那句话，写一百遍。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"就写我不会撒谎。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"一百遍。这人的惩罚方式也很老派。但我写完之后，他把那张纸收进了抽屉。不是扔了。是收了。"},{"type":"narration","text":"这是第一次正面硬撞校规，李主任会记上一笔。"}],"next":"1-5"},{"id":"1-4c-4","chapter":1,"name":"选 D：不说话","background":"corridor","bgm":null,"lines":[{"type":"set","effects":{"affection.zhouyong":12,"flags.zhouyong_curious":true}},{"type":"narration","text":"我没说话。"},{"type":"narration","text":"周勇看着我，看了好几秒。"},{"type":"dialogue","speaker":"houzi","text":"（小声）你倒是说句话啊。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我还是没说话。"},{"type":"dialogue","speaker":"zhouyong","text":"……回去吧。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"啊？","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"zhouyong","text":"我说回去。作业写完再想别的事。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他把保温杯换了个手，走了。"},{"type":"narration","text":"走出去的时候停了一下。"},{"type":"dialogue","speaker":"zhouyong","text":"下次想翻墙，别选我值班的日子。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他知道。他全知道。但他没抓我们——因为我们什么都没做，只是站在走廊上。他只管你做没做，不管你想想。"},{"type":"narration","text":"周勇开始留意你。周勇线的部分场景会提前解锁。"}],"next":"1-5"},{"id":"1-4d","chapter":1,"name":"李主任的第一次亲切谈话","background":"office","bgm":"assets/a-3f7d5d60a05af585.m4a","lines":[{"type":"set","effects":{"flags.lazy":true,"affection.zhouyong":5}},{"type":"narration","text":"我什么都没做。补课的事，我打算拖到下次月考再说。"},{"type":"narration","text":"第二天上午课间。"},{"type":"narration","text":"走廊上出现了那种叫李主任的天气。"},{"type":"dialogue","speaker":"lizhuren","text":"哎，是你。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"来了。"},{"type":"dialogue","speaker":"lizhuren","text":"上周的抽测成绩我看了。英语那栏，我特意翻了一下。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"不是批评你。我是想问问，你打算怎么办？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……我打算补。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"什么时候开始补？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"你看，你答不上来。","pose":"center","sprite":"s2","enter":false,"exit":false,"voice":"assets/a-772eeb6533a195a4.mp3","spriteScale":1.5},{"type":"narration","text":"他笑了笑。"},{"type":"dialogue","speaker":"lizhuren","text":"我不逼你。但你要知道，学校能给你的帮助是有限的。你不主动，就没人替你主动。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他从口袋里掏出张纸，递给我。"},{"type":"dialogue","speaker":"lizhuren","text":"这是我整理的高三英语补强名单。你要是有兴趣，把名字加上，我给你安排。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我接过那张纸。"},{"type":"narration","text":"名单上有分数，有弱势项，有建议找哪个老师。"},{"type":"narration","text":"密密麻麻，写了很久。"},{"type":"narration","text":"他连谁该补、补哪块、找谁，全列好了。这不是威胁。这是真干活。他把整个高三装在这个抽屉里，每天拿出来翻。"},{"type":"dialogue","speaker":"me","text":"老师，我加。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"嗯。写端正点。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我在名单末尾添上自己那行，递了回去。"},{"type":"narration","text":"他接过去的时候，我看见那个抽屉里还塞着一大摞别的纸。"},{"type":"narration","text":"那个抽屉里装着一千多个人。我不知道该说他可怕，还是该说他辛苦。"},{"type":"narration","text":"你没被处分，但李主任的档案里，从此有你了。"}],"next":"1-5","bgmName":"压迫","bgmLoop":true},{"id":"1-5","chapter":1,"name":"走廊上的天气","background":"corridor","bgm":null,"lines":[{"type":"narration","text":"从这天起，走廊上多了一种天气。"},{"type":"narration","text":"叫李主任。"},{"type":"narration","text":"他不定时出现。有时候在上课前，有时候在你刚从厕所出来的时候。"},{"type":"narration","text":"他永远笑着。他从来不骂人。"},{"type":"dialogue","speaker":"lizhuren","text":"哎，是你啊。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"来了。躲不掉，那就大大方方站着。"},{"type":"dialogue","speaker":"lizhuren","text":"今天精神不错嘛。最近学习怎么样？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"这句话是陷阱。你说还行，他会说还行是多行，来我办公室聊聊。你说不好，他会说不好就更要聊了。"},{"type":"dialogue","speaker":"lizhuren","text":"不用紧张，我就是随口问问。你最近和刚子他们走得挺近啊。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他在收集信息。他不是要抓你，他是在建立档案。管着全校一千多人的主任，脑子里有半本错题本。"},{"type":"dialogue","speaker":"lizhuren","text":"年轻人有朋友是好事。不过呢，高三了。老师也是为你们好。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他拍了拍我的肩膀，笑着走了。"},{"type":"narration","text":"他说的为你们好，是真的。他真的认为自己在做好事。这才是最麻烦的地方。不过没关系，我又不是来跟他对着干的。我是来把日子过好的。"},{"type":"narration","text":"第 二 章 · 分 歧 点：校 园 庆 典 筹 备"},{"type":"choice","prompt":"回教室之前，先去哪？","options":[{"text":"去年级办公室，把成绩单给周勇看。","goto":"2-1","ending":"","effects":{"affection.zhouyong":10}},{"text":"去英语教研室，跟杜小葵要份练习。","goto":"1-5-c","ending":"","effects":{"affection.duxiaokui":5}},{"text":"回教室，把成绩单贴在桌角上，天天看着。","goto":"2-1","ending":"","effects":{}}]}],"next":"2-1"},{"id":"2-1","chapter":2,"name":"决定性的几分钟","background":"classroom","bgm":"assets/a-3f7d5d60a05af585.m4a","lines":[{"type":"narration","text":"期中考结束，学校宣布了一件大事："},{"type":"narration","text":"两周后办校园文化庆典，全年级必须出摊。"},{"type":"dialogue","speaker":"houzi","text":"摆摊？摆什么？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"随便。只要不违反校规，不卖活体动物，不影响正常教学秩序。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"那能卖吃的吗？","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"zhouyong","text":"能。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"那——","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"zhouyong","text":"不能卖你奶奶做的辣酱。去年有七个学生进了医务室。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"gangzi","text":"……","pose":"right","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"哈哈哈哈哈哈——","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"猴子，你去年卖整蛊道具，有个把李主任的椅子腿给拆了的，你以为我不知道？","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"houzi","text":"老师我错了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"周勇在黑板上写下三行分工。"},{"type":"narration","text":"三区的摊位、场地布置与清理、英语组的汇报演出。"},{"type":"dialogue","speaker":"zhouyong","text":"放学之前，各自报名。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"放学铃响。我站在黑板前，看着那三行字。"},{"type":"narration","text":"很奇怪。就是块普通的黑板。但我站在那儿的时候，突然觉得写在上面的不是分工，是接下来这半年的走向。那就挑一样，然后干到底。"},{"type":"choice","prompt":"【本作最关键的选项】","options":[{"text":"留在三区的摊位","goto":"a-1","ending":"","effects":{"flags.route":"a"},"require":[{"var":"affection.lijie","op":"\u003e=","value":40}]},{"text":"报名场地布置与清理","goto":"b-1","ending":"","effects":{"flags.route":"b"},"require":[{"var":"affection.zhouyong","op":"\u003e=","value":40}]},{"text":"去英语组帮忙","goto":"c-1","ending":"","effects":{"flags.route":"c"},"require":[{"var":"affection.duxiaokui","op":"\u003e=","value":40}]},{"text":"都不选，去找刚子和猴子","goto":"d-1","ending":"","effects":{"flags.route":"d"}}]}],"bgmName":"压迫","bgmLoop":true},{"id":"a-1","chapter":3,"name":"天台","background":"rooftop","bgm":"assets/a-c003e4a8bd7699ca.m4a","lines":[{"type":"set","effects":{"affection.lijie":12}},{"type":"narration","text":"庆典前一周的傍晚，我上天台收晾着的横幅。"},{"type":"narration","text":"推开铁门的时候，看见有人坐在天台边上的台阶，背对着门，"},{"type":"narration","text":"手里拿着本书，但没在看。"},{"type":"narration","text":"是李杰。"},{"type":"narration","text":"他听见门响，肩膀抖了一下，飞快地把手里的东西塞进了口袋。"},{"type":"dialogue","speaker":"lijie","text":"……你怎么上来了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"dialogue","speaker":"me","text":"收横幅。你呢？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"透气。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"我在他旁边坐下。他没赶我走。这已经很不寻常了。"},{"type":"narration","text":"晚风从操场那边吹过来，远处能听到田径队在跑步，"},{"type":"narration","text":"广播里在放一首很旧的歌。"},{"type":"dialogue","speaker":"lijie","text":"……你刚才看见了吧。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"dialogue","speaker":"me","text":"看见什么？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"少装。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"看见你把什么东西塞口袋里了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"me","text":"我不问是什么。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……是张成绩单。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"narration","text":"他自己说出来了。我什么都没做。"},{"type":"dialogue","speaker":"lijie","text":"不是这次的。是上个月模考的。我考了第九。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"第九？这很厉害了啊。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我从高一到现在，从来没掉出过前三。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"他停了很久。"},{"type":"dialogue","speaker":"lijie","text":"我爸那天晚上没说话。他只是把成绩单看了几遍，然后放回桌上，说知道了。你知道吗，如果他骂我，我会好受些。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"那你为什么还老帮别人？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"什么？","pose":"center","sprite":"surprised","enter":false,"exit":false,"voice":"assets/a-e18496889c26f132.mp3"},{"type":"dialogue","speaker":"me","text":"你帮猴子讲题，帮我补课，早上收作业的时候从来不催人。你自己都这样了，为什么还管别人？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他愣住了。"},{"type":"dialogue","speaker":"lijie","text":"……因为我不想让别人也这样。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"narration","text":"这句话他说得很轻，几乎被风吹散了。"},{"type":"dialogue","speaker":"me","text":"那你别自己扛着。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"跟你有什么关系。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"没关系。但我想替你扛。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他转过头来看我，看了很久。"},{"type":"dialogue","speaker":"lijie","text":"……你这个人真烦。","pose":"center","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-384b06bd043ead83.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"莫名其妙地烦。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……但我今天心情好像好了些。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"dialogue","speaker":"me","text":"那说明我烦得有用。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"闭嘴。","pose":"center","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-384b06bd043ead83.mp3"},{"type":"narration","text":"他站起来，拍了拍裤子上的灰，往铁门走。"},{"type":"narration","text":"走到门口停了一下，没回头。"},{"type":"dialogue","speaker":"lijie","text":"明天……你那道完形填空，记得带来。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"me","text":"好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"铁门关上了。"},{"type":"narration","text":"他没说谢谢。但他约了明天。对李杰来说，明天见比谢谢你重得多。"},{"type":"narration","text":"第二天早自习前，我在校门口看见一个人。","background":"gate"},{"type":"narration","text":"黑色皮夹克，领子立着，站在传达室外面，像一只走错片场的海鸥。"},{"type":"dialogue","speaker":"jianghainiao","text":"这门口怎么不让停车。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"保安指了指旁边的牌子。他看了两秒，哦了一声，把车挪走了。"},{"type":"narration","text":"回来的时候手里拎着个塑料袋，里面是两个保温饭盒。"},{"type":"dialogue","speaker":"jianghainiao","text":"我儿子在里面。高三。我给他送点东西。","pose":"center","sprite":"default","enter":false,"exit":true},{"type":"narration","text":"保安让他登记。他趴在窗口上一笔一划地写，写了很久。"},{"type":"narration","text":"写完把笔还回去，说了声谢谢，走了进去。"},{"type":"narration","text":"李杰从来没提过他爸长什么样。我现在知道了。"},{"type":"narration","text":"他从来没跟任何人说过这些。全班眼里的李杰是学习好、嘴毒、谁都别惹。没人想过他也会怕。不是怕考不好，是怕让家里失望。那是一种更安静的、没人能帮你分担的怕。"}],"next":"a-2","bgmName":"心情","bgmLoop":true},{"id":"a-2","chapter":3,"name":"摊子塌了","background":"playground","bgm":null,"lines":[{"type":"set","effects":{"affection.lijie":8}},{"type":"narration","text":"庆典当天，我们的摊子出了事。"},{"type":"narration","text":"前一天晚上下雨，摊位的支架泡了水。"},{"type":"narration","text":"开摊没多久，顶棚的横梁断了。饮料洒了一地，牌子倒了，"},{"type":"narration","text":"排队的同学站在那儿看着我们。"},{"type":"narration","text":"刚子抱着断掉的横梁。"},{"type":"dialogue","speaker":"gangzi","text":"完了完了完了……","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"别晃！你别晃！","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"完蛋。不过慌也没用。先抬棚子，再赔笑脸，剩下的等会儿再说。"},{"type":"dialogue","speaker":"gangzi","text":"要不我去隔壁摊位把他们的支架拆一根过来？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"拆。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"choice","prompt":"怎么办？","options":[{"text":"让刚子去拆。","goto":"a-2-c","ending":"","effects":{"flags.rule_broken":1}},{"text":"不行，自己想办法修。","goto":"a-2-c","ending":"","effects":{}}]}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"a-3"}]},{"id":"a-3","chapter":3,"name":"李主任的办公室门外","background":"corridor","bgm":null,"lines":[{"type":"narration","text":"庆典之后，学校安排了一次摸底模考。这次是李主任亲自命题。"},{"type":"narration","text":"成绩出来那天下午，李杰没来上课。"},{"type":"narration","text":"我在天台上找到了他。他没哭，只是坐在那儿，"},{"type":"narration","text":"手里捏着张纸，捏得皱巴巴的。"},{"type":"dialogue","speaker":"me","text":"多少？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……71。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"narration","text":"满分 150。71。"},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我从来没考过这个分数。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"narration","text":"他的声音很平，平得不像他。"},{"type":"dialogue","speaker":"lijie","text":"我爸今天早上给我打电话，说他给我报了个一对一。一小时八百。他说他这个月少抽两条烟就够了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"他的手在抖。"},{"type":"dialogue","speaker":"lijie","text":"我不要她少买衣服。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"narration","text":"我什么都没说。只是坐在他旁边，陪他坐到天黑。"},{"type":"narration","text":"第二天，李主任把李杰叫去了办公室。"},{"type":"narration","text":"我路过的时候听见了里面的声音。"},{"type":"dialogue","speaker":"lizhuren","text":"这次模考，你的成绩下滑得很明显。是不是心里有别的想法了？高三了，我劝你专注些。","pose":"left","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"lijie","text":"……嗯。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"dialogue","speaker":"lizhuren","text":"你是我看好的学生之一。但看好归看好，学校的资源是有限的。我给你争取的那个自招名额，要重新考虑一下了。","pose":"left","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我站在门外，听不下去了。"},{"type":"choice","prompt":"怎么办？","options":[{"text":"直接冲进去，跟李主任理论。","goto":"a-3a","ending":"","effects":{"flags.rule_broken":1,"affection.lijie":-20}},{"text":"不进去，去找周勇。","goto":"a-3b","ending":"","effects":{"affection.zhouyong":5}},{"text":"不进去，回去从校规里找出路。","goto":"a-3c","ending":"","effects":{"affection.lijie":15,"flags.smart_route":true}}]}]},{"id":"a-3c","chapter":3,"name":"选 C：用规定本身说话","background":"corridor","bgm":null,"lines":[{"type":"narration","text":"我回到家，翻了很久的学生手册。"},{"type":"narration","text":"这本手册是李主任上任那年重新修订的，他引以为豪。"},{"type":"narration","text":"我在手册里翻到了："},{"type":"narration","text":"学生的学业评价以学期为周期综合评定，"},{"type":"narration","text":"单次阶段性测试成绩不得作为调整既有资格的唯一依据。"},{"type":"narration","text":"如需调整，须经年级组会议讨论并形成书面记录。"},{"type":"narration","text":"有办法了。他写的规则。他写的。他当年为了防止别的学校挖人，特意加了这条，因为要保证一次考不好不能把人踢出去。结果现在，这条规则站在了我们这边。"},{"type":"narration","text":"第二天，我把这段话抄在纸上，连同模考成绩单，一起放到周勇的办公桌上。"},{"type":"narration","text":"我没说话。周勇看了几秒。"},{"type":"dialogue","speaker":"zhouyong","text":"谁让你查的？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"没人。我自己查的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"……嗯。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他把纸折起来，放进衬衫口袋。"},{"type":"dialogue","speaker":"zhouyong","text":"回去上课。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"第二天下午，年级组开了会。"},{"type":"narration","text":"晚上，李杰来找我。他的表情很奇怪，像是想笑又不想让我看出来。"},{"type":"dialogue","speaker":"lijie","text":"……我的名额没取消。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"me","text":"那挺好啊。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"年级组开了会。说单次成绩不作为唯一依据。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"哦。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"是你干的吧。","pose":"left","sprite":"angry","enter":false,"exit":false,"voice":"assets/a-ecff5e94753f951e.mp3"},{"type":"dialogue","speaker":"me","text":"我什么都没干。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你说谎的时候会摸鼻子。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……谢谢。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"narration","text":"这是他头一回正面道谢。"},{"type":"dialogue","speaker":"me","text":"不用谢。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"不是。我是谢谢你没有冲进办公室去骂李主任。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"你怎么知道我想过？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"因为我也想过。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"他笑了一下。很浅，但确实是笑。"},{"type":"dialogue","speaker":"lijie","text":"你比我聪明。我只会硬扛，你会找路。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"narration","text":"其实那天晚上我想过很多种做法。最痛快的那种，是踹开门。但那会让李杰的名额彻底没戏。因为李主任会记住这件事，然后记住李杰。让谁输得最快的办法，就是让他跟记仇的人结仇。所以我不踹门。我找门。门一直都在，就看你会不会开。"}],"next":"a-end"},{"id":"a-3a","chapter":3,"name":"选 A：推门进去","background":"office","bgm":null,"lines":[{"type":"narration","text":"我推开了门。"},{"type":"dialogue","speaker":"lizhuren","text":"……进来之前要敲门。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"老师，自招名额凭什么用一次模考来定？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"你哪个班的。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"我问的是这个。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"我问的是你哪个班的。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他把笔放下来。全程都在笑。"},{"type":"dialogue","speaker":"lizhuren","text":"坐。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"我不坐。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"那你站着也行。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"lizhuren","text":"名额的评定标准，是年级组上个学期定的。单次成绩是参考项，不是唯一项——这一点规定里写得很清楚。所以你刚才那句话，本身就不成立。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"你今天是替李杰来的吧。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我没说话。"},{"type":"dialogue","speaker":"lizhuren","text":"他心里有想法，可以自己来找我。你替他来，他反而更难做。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"这句话我反驳不了。因为我确实没跟李杰商量过。我以为我在帮他，其实我是在替他做决定。"},{"type":"dialogue","speaker":"lizhuren","text":"回去上课吧。这件事我会按程序走。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我走出办公室的时候，腿有点软。"},{"type":"narration","text":"第二天，李杰来找我。他的表情我看不懂。"},{"type":"dialogue","speaker":"lijie","text":"……你去李主任办公室了？","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"你怎么知道。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"全年级都知道了。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"谁让你去的。","pose":"left","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-5ff67056909ea42f.mp3"},{"type":"dialogue","speaker":"me","text":"我……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我自己的事，我自己不会处理吗。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"narration","text":"他转身走了。"},{"type":"narration","text":"那天之后，他连着好几天没跟我说话。"},{"type":"narration","text":"我一直在想，我到底是帮了他，还是害了他。后来我想明白了——问题不在我去没去。问题在我没告诉他。"},{"type":"narration","text":"李杰线部分场景关闭，需要更多好感度才能挽回。"}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"a-end"}]},{"id":"a-3b","chapter":3,"name":"选 B：去找周勇","background":"office","bgm":null,"lines":[{"type":"narration","text":"我跑到年级办公室。周勇正在改作业。"},{"type":"dialogue","speaker":"me","text":"老师，李主任要动李杰的自招名额。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"我知道。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"你知道？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"年级组的事，我比你清楚。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"那你管不管。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"周勇把红笔放下了。"},{"type":"dialogue","speaker":"zhouyong","text":"管。但要走流程。我今天找他谈，明天提年级组，最快后天有结果。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"后天？那李杰这几天怎么办。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"这几天，他得自己扛。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他看了我一眼。"},{"type":"dialogue","speaker":"zhouyong","text":"你替他扛不了。谁也替不了。你现在能做的是——别让他自己待着。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"这句话我记住了。"},{"type":"narration","text":"我陪李杰在天台上坐了一整个下午，什么都没聊。"},{"type":"narration","text":"第二天、第三天，也是。"},{"type":"narration","text":"第三天下午，年级组开了会。"},{"type":"narration","text":"结果出来的时候，是周勇来告诉我们的。"},{"type":"narration","text":"他就说了四个字。"},{"type":"dialogue","speaker":"zhouyong","text":"名额保住了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"说完他就走了，红笔还在办公室桌上没盖帽。"},{"type":"narration","text":"李杰线保持通畅，但李杰多受了两天。"}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"a-end"}]},{"id":"a-4","chapter":3,"name":"李杰线 · 结局：碳酸饮料","background":"playground","bgm":"assets/a-6aef15bba6cd4a7a.m4a","lines":[{"type":"set","effects":{"affection.lijie":8}},{"type":"set","effects":{"affection.lijie":8}},{"type":"narration","text":"期末考试结束那天，我被李杰叫到了操场。"},{"type":"dialogue","speaker":"lijie","text":"坐。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"他指了指看台。"},{"type":"narration","text":"夕阳把整个操场染成橘色。跑道上还有田径队在训练，"},{"type":"narration","text":"广播里放着那首很旧的歌——就是天台上那首。"},{"type":"narration","text":"李杰从书包里掏出罐碳酸饮料，递给我。"},{"type":"narration","text":"自己也开了罐，喝了口，然后皱起脸。"},{"type":"dialogue","speaker":"lijie","text":"……不好喝。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-1d474127079cfe5d.mp3"},{"type":"dialogue","speaker":"me","text":"那你干嘛买。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"因为我看你上次在自动贩卖机前面站了很久。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"narration","text":"我愣住了。"},{"type":"narration","text":"他记得。他不说，但他记得所有关于别人的小事。然后把这些小事，藏在那些谁给你了的底下。"},{"type":"dialogue","speaker":"lijie","text":"我下学期可能会转去重点班。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"……哦。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我爸的意思。那边资源确实好些。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"你就不说点什么？","pose":"center","sprite":"surprised","enter":false,"exit":false,"voice":"assets/a-e18496889c26f132.mp3"},{"type":"dialogue","speaker":"me","text":"说什么？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……算了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"narration","text":"他踢了一下脚下的石子。"},{"type":"dialogue","speaker":"me","text":"我说，你去吧。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他转过头来。"},{"type":"dialogue","speaker":"me","text":"重点班离这儿就几层楼。又不是出国。而且我每周照样去找你补英语。你要是不教我，我就考个位数，然后到处说这是李杰教出来的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他盯着我看。看了很久。"},{"type":"narration","text":"然后他把手里那罐没喝完的饮料塞到我手里。"},{"type":"dialogue","speaker":"lijie","text":"……难喝。给你。","pose":"center","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-5ff67056909ea42f.mp3"},{"type":"dialogue","speaker":"me","text":"你刚喝过。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"那怎么了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"narration","text":"他站起来，背对着夕阳往看台下走。走了两步又停下。"},{"type":"dialogue","speaker":"lijie","text":"补课的事，我没说不教。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……明天见。","pose":"center","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-3c02ea398285dc17.mp3"},{"type":"narration","text":"夕阳把他的影子拉得很长，一直铺到我脚边。"},{"type":"narration","text":"他从来没说过我会想你这种话。但他说了明天见。对他来说，那是一样的意思。"},{"type":"ending","endingId":"a_true"}],"bgmName":"真心","bgmLoop":true},{"id":"a-4n","chapter":3,"name":"李杰线 · 普通结局：下次见","background":"playground","bgm":"assets/a-9e46298ae28ff712.m4a","lines":[{"type":"narration","text":"他递过来一罐碳酸饮料。"},{"type":"dialogue","speaker":"lijie","text":"……下学期我转重点班。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。三层楼。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"三层楼也很远。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"我没接话。他也什么都没再说。"},{"type":"narration","text":"那天我们在看台上坐到天黑，聊的是考试、是暑假、是下学期要背多少单词。"},{"type":"narration","text":"没聊别的。"},{"type":"narration","text":"后来他真转去了重点班。"},{"type":"narration","text":"我们在走廊上遇到的时候还是会说话，他会问我英语考了多少，"},{"type":"narration","text":"我会问他重点班的作业是不是更多。"},{"type":"narration","text":"就是不再补课了。"},{"type":"narration","text":"我一直觉得那天应该多说点什么。但那天我什么都没说。有些事情就是这样，你不说，它就过去了。"},{"type":"ending","endingId":"a_norm"}],"bgmName":"遗憾","bgmLoop":true},{"id":"a-4b","chapter":3,"name":"李杰线 · 疏远结局：前桌半年","background":"classroom","bgm":"assets/a-9e46298ae28ff712.m4a","lines":[{"type":"narration","text":"期末考完那天，李杰的桌子空了。"},{"type":"narration","text":"他转班的手续办得很快。"},{"type":"narration","text":"第二天早上，我在抽屉里发现张折起来的纸。"},{"type":"narration","text":"上面是他的字，很用力，只有一行。"},{"type":"narration","text":"英语错题本留给你了，在桌肚里。"},{"type":"narration","text":"我翻了桌肚。本子在那儿，还是那本翻烂了的。"},{"type":"narration","text":"我拿着那本本子坐了一节课。想了很多话，都没说出口。后来我把本子收进了书包，一直没再打开过。"},{"type":"narration","text":"我们后来在走廊上遇到过。"},{"type":"narration","text":"他朝我点了一下头，我也点了一下。"},{"type":"narration","text":"就这样。"},{"type":"ending","endingId":"a_lone"}],"bgmName":"遗憾","bgmLoop":true},{"id":"b-1","chapter":3,"name":"抽屉里的猫","background":"office","bgm":"assets/a-52ebd6f3eac3fbf2.m4a","lines":[{"type":"narration","text":"我选了场地布置与清理，于是我的周末变成了周勇的周末。"},{"type":"narration","text":"周六上午，办公室只有他。"},{"type":"dialogue","speaker":"zhouyong","text":"来了。椅子在那边。把上学期期末的档案按班级分好。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我分了半天档案。然后听见了动静。"},{"type":"narration","text":"很轻的，像是从抽屉里发出来的。"},{"type":"narration","text":"我抬头看周勇。他正在低头看文件，"},{"type":"narration","text":"但他的左手很自然地把最下面那个抽屉拉开了道缝。"},{"type":"narration","text":"毛茸茸的尾巴从缝里卷了卷，又缩回去了。"},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"专心分档案。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"老师，那个抽屉……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"哪个抽屉。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"分档案。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"又过了一会儿，抽屉里传来一声很短的喵。"},{"type":"narration","text":"周勇翻文件的手停了停。"},{"type":"narration","text":"然后他叹了口气，把抽屉整个拉开了。"},{"type":"narration","text":"里面是只很小的橘猫，瘦得能看见骨头，正在啃一袋撕开的猫粮。"},{"type":"dialogue","speaker":"me","text":"老师。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"上个月在车棚捡的。它妈妈被车轧了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"你怎么不送救助站？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"救助站满了。而且……","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他顿了顿。"},{"type":"dialogue","speaker":"zhouyong","text":"而且它太吵，别人受不了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他说的是别人受不了。但真正的原因是，他受不了把它送走。能说出别人受不了的人，其实已经决定要养它了。"}],"next":"b-2","bgmName":"沉默","bgmLoop":true},{"id":"b-2","chapter":3,"name":"场地风波","background":"corridor","bgm":null,"lines":[{"type":"set","effects":{"affection.zhouyong":8}},{"type":"narration","text":"庆典之后，学校出了份校园空间优化方案。"},{"type":"narration","text":"方案里写着：三区教学楼后侧空地长期闲置，拟改造为教师停车区。"},{"type":"narration","text":"那块地是三区所有课外活动的地方。篮球、跑操、晚自习后的散步、我们班的摊位练习，全在那儿。这事我得管。不为别的，就因为我喜欢在那儿待着。"},{"type":"narration","text":"方案的落款是李主任。"},{"type":"narration","text":"那天下午，周勇被叫去了会议室。我在门外等他。"},{"type":"narration","text":"门没关严，我听见了里面的声音。"},{"type":"dialogue","speaker":"lizhuren","text":"老周，这个方案对学校是好事。你带的那个班，活动太多了。高三了，收一收。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"zhouyong","text":"那块地是学生活动场地，写在校舍规划里的。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"lizhuren","text":"规划可以改。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"zhouyong","text":"改规划要走校务会流程。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"lizhuren","text":"流程我来走。你只要不反对就行。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"安静了一会儿。"},{"type":"dialogue","speaker":"zhouyong","text":"……我按规定办。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他进去了。我在门外站着。我知道里面在说什么，我也知道他一个人说不过对面。"},{"type":"choice","prompt":"你打算怎么办？","options":[{"text":"推门进去，替周勇说话。","goto":"b-2-c","ending":"","effects":{"flags.rule_broken":1,"affection.zhouyong":-35}},{"text":"先回去，等他出来。","goto":"b-2-c","ending":"","effects":{}}]}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"b-3"}]},{"id":"b-3","chapter":3,"name":"课间操","background":"playground","bgm":null,"lines":[{"type":"set","effects":{"affection.zhouyong":18}},{"type":"narration","text":"第二天，周勇把我叫到办公室。"},{"type":"dialogue","speaker":"zhouyong","text":"你昨天在门外都听见了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"……嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"那你应该也知道，我自己反对没用。校务会那几位，李主任手里握着票。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"那怎么办？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"我不能带头闹。我是老师。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他说这句话的时候，看着窗外那块空地。"},{"type":"dialogue","speaker":"zhouyong","text":"但学生可以提意见。这是学生手册里写着的。学生有权就涉及自身学习生活的管理事项，通过正当渠道提出意见。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"……老师，你这是在教我？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"我什么都没教你。我只是在念手册。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他站起来，把椅子推进桌子底下。"},{"type":"dialogue","speaker":"zhouyong","text":"下班了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他念完手册就走了。甚至没看我一眼。但把条款背得这么熟的人，显然已经准备好了如果有人提意见我该怎么办。那就我来提。他都把路铺到这儿了，我不走一趟，对不起他。"},{"type":"narration","text":"那天晚上，我找了刚子和猴子。"},{"type":"dialogue","speaker":"me","text":"兄弟们，干一票大的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"说。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"明天校务会，我们要在那块地上，办场全校规模的、合规的、合法的、让人没法反对的活动。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"什么活动？","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"课间操。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"啊？","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"全校课间操。就在那块地上。我们班带头，把隔壁班也叫上。理由是学生需要适度的集体活动以缓解高三压力。这句话是学生手册前言里的原话。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"……兄弟，你有点可怕。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"我喜欢。那咋了，受着呗。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"choice","prompt":"叫多少人？","options":[{"text":"只叫自己班。","goto":"b-3-c","ending":"","effects":{"affection.gangzi":5}},{"text":"把隔壁两个班也叫上。","goto":"b-3-c","ending":"","effects":{"flags.rule_broken":1,"affection.gangzi":10}}]}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"b-end"}]},{"id":"b-4","chapter":3,"name":"周勇线 · 结局：三页纸","background":"office","bgm":"assets/a-6aef15bba6cd4a7a.m4a","lines":[{"type":"set","effects":{"affection.zhouyong":12}},{"type":"set","effects":{"affection.zhouyong":12}},{"type":"narration","text":"方案搁置几天后，周勇在下课铃响后叫住了我。"},{"type":"dialogue","speaker":"zhouyong","text":"你留下。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"行，被抓了。该来的总会来，正好我也想找他聊聊。"},{"type":"narration","text":"办公室里又只有他。抽屉拉开道缝，"},{"type":"narration","text":"那只橘猫在里面睡觉。"},{"type":"dialogue","speaker":"zhouyong","text":"坐。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"我坐下。他没说话，从抽屉里拿出张纸，推到我面前。"},{"type":"narration","text":"那是份表格。"},{"type":"narration","text":"上面写着我的名字——他不知道我的名字，写的是三区学生。"},{"type":"narration","text":"还有目标院校、当前排名、各科分数、差距、建议提升方案。"},{"type":"narration","text":"写了好几页。字很小，很密。"},{"type":"dialogue","speaker":"me","text":"老师，这是……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"上个月就做了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"上个月？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"你那次考 48 分之后。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他喝了口保温杯里的水。"},{"type":"dialogue","speaker":"zhouyong","text":"我不管你们平时怎么闹。三区那块地我可以睁一只眼闭一只眼。但我不能让你们毕业的时候，连个去处都没有。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"英语那栏我写的建议是找杜老师。他教得比我好。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"老师，你不是教语文的吗？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"嗯。所以我只写整体规划。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他把表格往前推了推。"},{"type":"dialogue","speaker":"zhouyong","text":"拿回去看。有不懂的，下周二来找我。办公室没人。别让别人看见。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"为什么？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"……我不想别的学生以为我偏心。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他说完这句，自己愣了一下。"},{"type":"dialogue","speaker":"zhouyong","text":"算了。当我没说。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"我拿起那份表格。走到门口的时候回头看了一眼。"},{"type":"narration","text":"周勇正在把抽屉关上，那只小猫探出头喵了一声。"},{"type":"narration","text":"他伸手，用手指很轻地摸了摸猫的头。"},{"type":"narration","text":"很多人以为周勇是那种不管事的老师。其实他只是把管事的力气，都用在了别人看不见的地方。"},{"type":"ending","endingId":"b_true"}],"bgmName":"真心","bgmLoop":true},{"id":"b-4n","chapter":3,"name":"周勇线 · 普通结局：那张便条","background":"office","bgm":"assets/a-9e46298ae28ff712.m4a","lines":[{"type":"narration","text":"他把张纸推到我面前。"},{"type":"narration","text":"不是表格。是张便条。"},{"type":"narration","text":"上面写着几所学校的名字，和一句英语找杜老师。"},{"type":"dialogue","speaker":"zhouyong","text":"先看着。有想法再说。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"老师，就这些？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"就这些。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他把抽屉关上了。"},{"type":"narration","text":"后来我毕业的时候，去办公室找过他一次。"},{"type":"narration","text":"他在改作业，抬头看了我一眼，说了句考得还行。"},{"type":"narration","text":"就四个字。说完继续改作业。"},{"type":"narration","text":"我一直觉得他对我跟对别人不太一样。但那天我又觉得，也许他对每个人都是这样——该给的东西给你，多余的话不说。不是不在乎，是他觉得说了没用。"},{"type":"ending","endingId":"b_norm"}],"bgmName":"遗憾","bgmLoop":true},{"id":"b-4b","chapter":3,"name":"周勇线 · 疏远结局：走廊上的点头","background":"corridor","bgm":"assets/a-9e46298ae28ff712.m4a","lines":[{"type":"narration","text":"场地的事最后没成。"},{"type":"narration","text":"三区那块地在我们毕业那年改成了停车位。"},{"type":"narration","text":"周勇没有再来找我。我也没有再去找他。"},{"type":"narration","text":"毕业那天，我在走廊上遇到他。"},{"type":"narration","text":"他抱着一摞档案，走得很急。"},{"type":"dialogue","speaker":"me","text":"老师。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他点了点头，继续走了。"},{"type":"narration","text":"我在走廊上站了一会儿。我们之间就只剩下这个点头。其实我本来可以做得更多的，只是当时我选了别的。"},{"type":"ending","endingId":"b_lone"}],"bgmName":"遗憾","bgmLoop":true},{"id":"c-1","chapter":3,"name":"话剧被叫停","background":"office","bgm":"assets/a-b77b0c54feb4e485.m4a","lines":[{"type":"set","effects":{"affection.duxiaokui":5}},{"type":"narration","text":"我选了去英语组帮忙。于是我的放学后，变成了杜小葵的节目筹备会。"},{"type":"narration","text":"他准备的是个英语话剧，全英文演出，剧本是他自己写的，改了十几版。"},{"type":"dialogue","speaker":"duxiaokui","text":"你看这段，王子对公主说 I have loved you since the day we met——太土了。我想改成 I have loved you since the day you stole my sandwich。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"me","text":"老师，那是王子还是抢劫犯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"是高中生。高中生就是这样谈恋爱的。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"narration","text":"他笑得很开心。我很久没见过有人为这种事这么开心。"},{"type":"narration","text":"排练到第四周，通知下来了。"},{"type":"narration","text":"门口贴了张纸。"},{"type":"narration","text":"关于暂停英语话剧演出的通知"},{"type":"narration","text":"经研究决定，为保障高三学生复习时间，"},{"type":"narration","text":"暂停本次英语话剧演出。　　——教导处"},{"type":"narration","text":"杜小葵站在那张纸前面，站了很久。"},{"type":"dialogue","speaker":"duxiaokui","text":"……哦。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"他就应了一声。然后伸手把纸撕下来，折了折，塞进了口袋。"},{"type":"dialogue","speaker":"duxiaokui","text":"没事。反正剧本写得也不怎么样。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"me","text":"老师。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"行了行了，今天先回去吧。我还有个材料要交。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"narration","text":"我走出办公室，回头看了一眼。"},{"type":"narration","text":"他坐在椅子上，一动不动，面前摊着那本改了十几版的剧本。"},{"type":"narration","text":"他刚才说剧本写得也不怎么样。那是他花了几个星期、改了十几版的东西。他说那句话的时候，脸上还带着笑。这就是杜小葵。他的幽默不是性格，是盔甲。穿上它，别人就看不出里面有没有受伤。行。那我来把这身盔甲卸下来。他写了十几版，我就想办法让这些稿子全都上台。"}],"next":"c-1b","bgmName":"舞台","bgmLoop":true},{"id":"c-1b","chapter":3,"name":"深夜的教研室","background":"office","bgm":null,"lines":[{"type":"set","effects":{"affection.duxiaokui":6}},{"type":"narration","text":"我落了本练习册在教研室，晚上回去拿。"},{"type":"narration","text":"灯还亮着。"},{"type":"narration","text":"杜小葵坐在桌前，面前摊着那本剧本。"},{"type":"dialogue","speaker":"me","text":"老师，你还没走？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"哎，你怎么回来了。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"拿东西。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"哦。那你拿吧。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"narration","text":"他把剧本往旁边挪了挪，像是怕我看见。"},{"type":"narration","text":"但我还是看见了——上面全是红笔。"},{"type":"dialogue","speaker":"me","text":"老师在改剧本？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"没有。随便翻翻。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"红笔也是随便翻翻？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"……你这人怎么这么多话。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"他把笔盖上了。"},{"type":"dialogue","speaker":"duxiaokui","text":"反正也用不上了。改得再好也没用。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"me","text":"那你还改。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"……","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"他没回答。过了一会儿，他把剧本合上，塞进了抽屉最底下。"},{"type":"dialogue","speaker":"duxiaokui","text":"走吧。我锁门。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"他把剧本塞进抽屉的时候，动作特别轻，像是怕弄疼什么东西。一件已经被告知用不上的东西，他还是一页一页改到了深夜。然后说随便翻翻。"}],"next":"c-2"},{"id":"c-2","chapter":3,"name":"换个名字","background":"classroom","bgm":null,"lines":[{"type":"set","effects":{"affection.duxiaokui":8}},{"type":"narration","text":"那天晚上，我把刚子、猴子和李杰叫到了一起。"},{"type":"dialogue","speaker":"gangzi","text":"干嘛，大半夜的。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"英语话剧被叫停了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"啊？为什么？","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"因为影响复习时间。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"那个剧本我知道。杜老师给我看过。写得挺好。","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"所以我们要把它办成。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"怎么办？通知都贴出来了。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"通知上写的是暂停英语话剧演出。我们不是演出。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"啊？","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"我们办的是英语知识竞答。竞答属于学科活动，是教务处鼓励的。竞答中间，为了增强情境代入感，会有几段情景剧表演。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-d1ff7d3c34e76e45.mp3"},{"type":"dialogue","speaker":"gangzi","text":"……","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"……兄弟，你以前是不是干过什么违法的事。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"你闭嘴。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"choice","prompt":"怎么让这件事办起来？","options":[{"text":"老老实实走报备流程。","goto":"c-2-c","ending":"","effects":{}},{"text":"先斩后奏，海报先贴出去。","goto":"c-2-c","ending":"","effects":{"flags.rule_broken":1,"affection.duxiaokui":-30}}]}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"c-2b"}]},{"id":"c-2b","chapter":3,"name":"排练地狱","background":"playground","bgm":null,"lines":[{"type":"set","effects":{"affection.duxiaokui":5}},{"type":"choice","prompt":"排练要不要公开？","options":[{"text":"低调。在空教室里排。","goto":"c-2b-c","ending":"","effects":{}},{"text":"就在三区空地排，让所有人看。","goto":"c-2b-c","ending":"","effects":{"flags.rule_broken":1,"affection.duxiaokui":3}}]}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"c-3"}]},{"id":"c-3","chapter":3,"name":"演出当天","background":"playground","bgm":null,"lines":[{"type":"narration","text":"周五下午，三区空地上摆了个很简陋的台子。"},{"type":"narration","text":"挂了块布，摆着音箱，堆着手写的题板。台下坐了不少人。"},{"type":"narration","text":"主持人报幕的时候，我站在台侧。"},{"type":"narration","text":"杜小葵在我旁边，穿着他那件袖口还带标签的运动服。"},{"type":"dialogue","speaker":"duxiaokui","text":"这个主持人是谁定的。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"me","text":"我定的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"他发音不太准。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"那老师你上去？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"……算了。挺好的。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"竞答进行到中途，主持人宣布进入情景环节。"},{"type":"narration","text":"灯亮了。李杰、刚子、猴子从侧幕走出来。"},{"type":"narration","text":"李杰演那个抢三明治的公主，刚子演王子的护卫，"},{"type":"narration","text":"猴子演那只被抢的三明治。"},{"type":"narration","text":"全场爆笑。"},{"type":"narration","text":"然后是最后那段独白。"},{"type":"narration","text":"李杰站在台中央，用英语念出了那句改过的台词。"},{"type":"dialogue","speaker":"lijie","text":"I have loved you since the day you stole my sandwich.","pose":"left","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"台下笑成一片。然后有人在笑里鼓掌。"},{"type":"narration","text":"我转头看了一眼杜小葵。"},{"type":"narration","text":"他没笑。他站在台侧的阴影里，看着台上的那群学生。"},{"type":"narration","text":"他的眼睛红了。"},{"type":"dialogue","speaker":"duxiaokui","text":"……你们怎么把它做出来的。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-9325409d833d3825.mp3"},{"type":"dialogue","speaker":"me","text":"老师，剧本你写了十几版。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"那是废稿。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"废稿也写了十几版。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他别过头去，用手背擦了一下。"},{"type":"dialogue","speaker":"duxiaokui","text":"风大。眼睛里进东西了。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"那天下午没有风。"}],"next":"c-3b"},{"id":"c-3b","chapter":3,"name":"李主任的条件","background":"corridor","bgm":null,"lines":[{"type":"set","effects":{"affection.duxiaokui":5}},{"type":"narration","text":"演出结束，我们正在收台子。"},{"type":"narration","text":"李主任从人群里走过来。他一直在笑。"},{"type":"narration","text":"来了。这种时候他笑得越和善，越没好事。"},{"type":"dialogue","speaker":"lizhuren","text":"小葵。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"duxiaokui","text":"主任。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"lizhuren","text":"今天这个办得不错。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"duxiaokui","text":"……谢谢主任。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-9325409d833d3825.mp3"},{"type":"dialogue","speaker":"lizhuren","text":"不过我有个建议。以后这种活动，提前报备，走流程。不是不让你们办，是得让我知道。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"duxiaokui","text":"好。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"lizhuren","text":"还有。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他从口袋里掏出张纸。"},{"type":"dialogue","speaker":"lizhuren","text":"下学期的英语活动课，我给你们组批两节课。你上次提的那个英语角，可以做。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"duxiaokui","text":"……啊？","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-41015638fd10ad0f.mp3"},{"type":"dialogue","speaker":"lizhuren","text":"上次我否了。这次我想了想，你那个方案改一改是能做的。前提是安全预案得写清楚。上学期别的学校出过事，我担不起。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"说完他就走了。"},{"type":"narration","text":"走之前看了台上的李杰、刚子、猴子一眼。"},{"type":"dialogue","speaker":"lizhuren","text":"这几个孩子，英语口语不错。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"杜小葵站在原地，捏着那张纸，半天没动。"},{"type":"dialogue","speaker":"duxiaokui","text":"……他听到了。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"听到什么？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"那句台词。他站在台下，从头到尾听完了。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"他不是来挑毛病的。他是来看的。看完了，顺便把他早就想批的方案批了——但他不会说是自己想批，他要说成你改一改就能做。"},{"type":"narration","text":"这就是李主任。"},{"type":"narration","text":"他做的事都是对的。他只是从来不让你觉得他在做好事。"}],"next":"c-end"},{"id":"c-4","chapter":3,"name":"杜小葵线 · 结局：空教室","background":"classroom","bgm":"assets/a-6aef15bba6cd4a7a.m4a","lines":[{"type":"set","effects":{"affection.duxiaokui":8}},{"type":"set","effects":{"affection.duxiaokui":6}},{"type":"narration","text":"演出结束后学校放了半天假。"},{"type":"narration","text":"我在教室里收拾东西，收着收着，天就黑了。"},{"type":"narration","text":"八点半，教室的门被推开。"},{"type":"dialogue","speaker":"duxiaokui","text":"还不回去？","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-41015638fd10ad0f.mp3"},{"type":"dialogue","speaker":"me","text":"马上。","pose":"center","sprite":"default","
