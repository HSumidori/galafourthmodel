enter":false,"exit":false},{"type":"narration","text":"他走进来，坐在讲台边上。不是站着，是坐着，"},{"type":"narration","text":"像下了班的人。"},{"type":"dialogue","speaker":"duxiaokui","text":"今天那个竞答，李主任全程看完了。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"他怎么说？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"他说形式上创新，内容上没问题。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"那就是夸你了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"从他嘴里说出来算。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"narration","text":"他笑了一下。然后安静了很久。"},{"type":"dialogue","speaker":"duxiaokui","text":"我今年是第三年。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"嗯。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"前两年我提过几次教学方案，全被否了。有一次是英语配音比赛，被否的理由是占用午休时间。有一次是英语角，被否的理由是管理难度大。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"我后来就想，那就上课吧。把课上好，把笑话讲好，让那四十五分钟别太难熬。反正学生喜欢就行。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-dde8e658288143d8.mp3"},{"type":"narration","text":"他低着头，看着自己的鞋尖。"},{"type":"dialogue","speaker":"duxiaokui","text":"其实我有时候也怀疑，是不是我太理想主义了。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"老师。","pose":"center","sprite":"default","enter":false," se,"exit":false},{"type":"narration","text":"他愣了愣。"},{"type":"narration","text":"然后他把头靠在椅背上，闭上了眼睛。"},{"type":"narration","text":"教室很安静。窗外的路灯把光斜斜地照进来。"},{"type":"dialogue","speaker":"duxiaokui","text":"……谢了。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"me","text":"不客气。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"哎。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"me","text":"嗯？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"明天还是要交作文的。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"放心，我不看。我只打个勾。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"他闭着眼睛笑起来。"},{"type":"narration","text":"我们班的人都以为杜小葵是个永远乐观的人。其实他只是把累这个字，留到了没人的深夜，留给了空教室。"},{"type":"ending","endingId":"c_true"}],"bgmName":"真心","bgmLoop":true},{"id":"c-4n","chapter":3,"name":"杜小葵线 · 普通结局：办公室的灯","background":"office","bgm":"assets/a-9e46298ae28ff712.m4a","lines":[{"type":"narration","text":"那天晚上我路过教研室，灯还亮着。"},{"type":"narration","text":"我没进去。"},{"type":"narration","text":"第二天他来上课，还是那个样子，笑声很大。"},{"type":"narration","text":"只是眼下的青色更深了一点。"},{"type":"dialogue","speaker":"duxiaokui","text":"昨天的作业我看了啊，写得不错。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"me","text":"你看完了？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"看完了。四十多本呢。","pose":"center","sprite":"default","enter":f ]}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"goto":"d-2b"}]},{"id":"d-2b","chapter":3,"name":"事情闹大了","background":"corridor","bgm":null,"lines":[{"type":"narration","text":"第四天出了岔子。"},{"type":"narration","text":"我们的复称台火了。"},{"type":"narration","text":"火到别的班也来排队，火到有人做了块牌子立在旁边，"},{"type":"narration","text":"上面写着食堂良心秤。"},{"type":"narration","text":"然后有人加了别的东西。"},{"type":"dialogue","speaker":"houzi","text":"兄弟你看这个。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他递给我张纸。"},{"type":"narration","text":"上面写着一行大字：食堂克扣学生餐费，要求公开账目。"},{"type":"dialogue","speaker":"me","text":"……这不是我们写的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"我不知道谁写的。今天早上就贴在公告栏上了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那怎么办。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"先把它撕下来。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我们仨跑到公告栏，晚了。"},{"type":"narration","text":"李主任站在那儿，手里拿着那张纸。"},{"type":"dialogue","speaker":"lizhuren","text":"是你们写的？","pose":"right","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"houzi","text":"不是！","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"我知道不是。","pose":"right","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他把纸折起来，放进口袋。"},{"type":"dialogue","speaker":"lizhuren","text":"但秤是你们摆的。","pose":"right","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……是。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"跟我来。","pose":"right","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我一直在想我们到底错在哪。秤没错。复称没错。诉求也没错。错的是我们把一件小事做成了一件所有人都能往上贴东西的事。我们开了个头，然后管不住后面。"}],"next":"d-end"},{"id":"d-3","chapter":3,"name":"三区霸王线 · 结局：走廊上的夕阳","background":"corridor","bgm":"assets/a-6aef15bba6cd4a7a.m4a","lines":[{"type":"set","effects":{"affection.gangzi":15,"affection.houzi":15}},{"type":"narration","text":"李主任的办公室里，他看了我们仨很久。"},{"type":"dialogue","speaker":"lizhuren","text":"你们知道错在哪吗？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"gangzi","text":"知道。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"lizhuren","text":"说。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"gangzi","text":"不该在食堂门口摆秤。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"lizhuren","text":"还有呢？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"houzi","text":"不该印那些纸。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"还有呢？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……不该在纸上写我们不是在要肉，我们是在要分数。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李主任的表情松动了一下。"},{"type":"dialogue","speaker":"lizhuren","text":"你们仨，罚站在走廊。放学后，一小时。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"……哎。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我们转身要走，他叫住了我们。"},{"type":"dialogue","speaker":"lizhuren","text":"那个秤，是哪来的？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"houzi","text":"实验室借的。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"还回去。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"houzi","text":"哦。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"……还有。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他从抽屉里拿出张纸。"},{"type":"dialogue","speaker":"lizhuren","text":"这是我给食堂提的意见。鸡腿饭的分量标准，下周会重新核定。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我们仨愣住了。"},{"type":"dialogue","speaker":"lizhuren","text":"我不是不讲道理。但你们不能闹。你们今天能摆秤，明天就能挂横幅。学校一千多号人，要都这么干，怎么办？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"lizhuren","text":"我坐这个位子，就得管这个事。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他说完挥了挥手。"},{"type":"dialogue","speaker":"lizhuren","text":"去站着吧。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我们仨站在走廊上，各自靠着柱子。"},{"type":"narration","text":"窗外的太阳正在往下掉。"},{"type":"dialogue","speaker":"gangzi","text":"他其实还行。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"他撕了我们的纸。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"但他给食堂提意见了。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"……行吧，还行。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"安静了一会儿。"},{"type":"dialogue","speaker":"gangzi","text":"哎。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"嗯？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"你说我们仨，毕业以后还能这样吗？","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"哪样？","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"就是这样啊。就这么站着，什么都不干，看太阳。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"猴子没说话。他往刚子那边挪了半步。"},{"type":"dialogue","speaker":"houzi","text":"你少说这种话，我起鸡皮疙瘩。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那咋了。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"受着呗。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"然后刚子和猴子一起笑了。"},{"type":"narration","text":"夕阳把影子投在走廊的地上。"},{"type":"narration","text":"胖的，瘦的，还有不长不短的。"},{"type":"narration","text":"那段时间，是我高中三年里过得最快的。"},{"type":"ending","endingId":"d_true"}],"bgmName":"真心","bgmLoop":true},{"id":"d-3n","chapter":3,"name":"三区霸王线 · 普通结局：群还活着","background":"lakeside","bgm":"assets/a-9e46298ae28ff712.m4a","lines":[{"type":"narration","text":"毕业那天我们仨在校门口拍了张照。"},{"type":"narration","text":"猴子举着手机，刚子站在中间，我在旁边。"},{"type":"dialogue","speaker":"houzi","text":"看镜头。一、二——","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"等一下我衣服。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"你衣服怎么了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"没怎么。就是有点紧。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"你去年就说紧。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"那咋了，受着呗。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"照片拍糊了。我们仨看了半天，谁也没说重拍。"},{"type":"narration","text":"后来各自去了不同的地方。"},{"type":"narration","text":"群里偶尔有人发消息，通常是猴子发的表情包，刚子回一个「那咋了」。"},{"type":"narration","text":"我有时候回，有时候不回。"},{"type":"narration","text":"我们没散。但也没有当年那么黏了。高三那年蹲在小卖部后面开会的三个人，后来变成了群里几个偶尔冒泡的头像。"},{"type":"narration","text":"这样也挺好。真的。"},{"type":"ending","endingId":"d_norm"}],"bgmName":"遗憾","bgmLoop":true},{"id":"d-3b","chapter":3,"name":"三区霸王线 · 疏远结局：散伙饭","background":"restaurant","bgm":"assets/a-9e46298ae28ff712.m4a","lines":[{"type":"narration","text":"毕业那天，我们仨在学校旁边吃了顿饭。"},{"type":"narration","text":"是猴子提的，说好歹吃一顿。"},{"type":"narration","text":"刚子点了一堆菜，最后没吃完。"},{"type":"narration","text":"猴子一直在看手机。"},{"type":"narration","text":"我夹在中间，说了几个笑话，都冷场了。"},{"type":"dialogue","speaker":"gangzi","text":"……那个秤，后来食堂真改了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"嗯。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"你说我们当时是不是挺傻的。","pose":"center","sprite":"default","enter":false,"exit":true,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"是有点。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"然后就没话了。"},{"type":"narration","text":"吃完出来，天还亮着。"},{"type":"narration","text":"我们在路口站了一会儿，各自说了句再见，往三个方向走了。"},{"type":"narration","text":"我一直以为我们仨会一直这样。后来才想明白——我们只是恰好被分在同一个后排。坐到一起，不等于走到一起。"},{"type":"narration","text":"那顿饭之后，我们再没聚过。"},{"type":"ending","endingId":"d_lone"}],"bgmName":"遗憾","bgmLoop":true},{"id":"e-0","chapter":4,"name":"第二次越线之前","background":"corridor","bgm":"assets/a-50ed997bab929e62.m4a","lines":[{"type":"narration","text":"我第二次撞线的时候，李主任没有当场发作。"},{"type":"narration","text":"他只是笑着把我叫到一边。"},{"type":"dialogue","speaker":"lizhuren","text":"你最近，挺忙的。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"上次的事我记着呢。我以为你会收一收。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"老师，我觉得那件事我们没错。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"我知道你觉得没错。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他点了点头，像是认可了我的说法。"},{"type":"dialogue","speaker":"lizhuren","text":"所以我才要跟你聊聊。不是聊对错，是聊代价。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他从口袋里掏出个小本子，翻开。"},{"type":"narration","text":"上面密密麻麻记着字。"},{"type":"dialogue","speaker":"lizhuren","text":"这个本子里记着这学期所有出过事的学生。时间、事情、处理方式、家长来过几次。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"lizhuren","text":"我记这个不是因为我记仇。是因为学校出事的时候，上面头一个找的是我。我得拿出记录，证明我做过什么。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他把本子合上，放回口袋。"},{"type":"dialogue","speaker":"lizhuren","text":"今天下午，来我办公室。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他全程没说一句重话。但我后背全是汗。我一直以为撞线最坏的结果是被罚。现在我知道了——最坏的结果是，他决定把你写进那个本子里。"}],"next":"e-1","bgmName":"紧张","bgmLoop":true},{"id":"e-1","chapter":4,"name":"Bad End · 李主任的偏爱","background":"office","bgm":"assets/a-18c73e7dbcc527d6.m4a","lines":[{"type":"narration","text":"越过两次线之后，不管你走的是哪条线，都会在该线中段被李主任叫走。"},{"type":"narration","text":"李主任的办公室比我想象的干净。"},{"type":"narration","text":"桌上只有电脑、保温杯，和一沓文件。"},{"type":"narration","text":"他给我倒了杯水。"},{"type":"dialogue","speaker":"lizhuren","text":"坐。别站着。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"我坐下。"},{"type":"dialogue","speaker":"lizhuren","text":"你最近，挺活跃的。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"摆秤、贴纸、话剧、课间操。我一件一件都记着呢。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他说这些话的时候一直笑着。"},{"type":"dialogue","speaker":"lizhuren","text":"你知道我为什么不早管你吗？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"me","text":"不知道。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lizhuren","text":"因为我在等。等你撞上那条线。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他把保温杯的盖子拧开，又拧上。"},{"type":"dialogue","speaker":"lizhuren","text":"学校有学校的规矩。规矩这东西，不是用来卡人的，是用来保证一千多个人能同时转起来的。你觉得操场那块地很重要，我也觉得重要。但我手里只有那么多钱、那么多教室、那么多老师。我得选。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"lizhuren","text":"你们选的是我想要。我选的是怎么让所有人都过得去。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他看着我。"},{"type":"dialogue","speaker":"lizhuren","text":"你没错。但你越线了。越线的代价，不是因为你坏，是因为如果我不处理你，别人就会觉得那条线可以踩。然后线就没有了。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他打开抽屉，拿出张纸推到我面前。"},{"type":"dialogue","speaker":"lizhuren","text":"学生违纪处分决定书。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"lizhuren","text":"记过。写检查。取消本学期的评优资格。另外，从今天起，你的家长每两周要来一次学校。我陪他们聊。聊几个小时都可以。我不嫌麻烦。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他喝了口水。"},{"type":"dialogue","speaker":"lizhuren","text":"坐下吧。我们慢慢聊。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"那天下午，我在那间办公室里坐了很久。"},{"type":"narration","text":"他没有骂我。"},{"type":"narration","text":"他只是不停地讲道理，翻来覆去。"},{"type":"narration","text":"温和地、耐心地、不厌其烦地，把我的每句反驳都用若干条理由堵了回去。"},{"type":"narration","text":"走出办公室的时候，天已经黑了。"},{"type":"narration","text":"我到现在也说不清，他到底是不是在害我。他说的每句话都是对的。正因如此，我才反驳不了。……行。这局我认。但我不觉得自己做错了。这一点，我不改。"},{"type":"narration","text":"第二次越线，代价会更大。"}],"next":"e-1b","bgmName":"深渊","bgmLoop":true},{"id":"e-1b","chapter":4,"name":"走出办公室之后","background":"corridor","bgm":null,"lines":[{"type":"narration","text":"我从教导处出来的时候，天已经黑了。"},{"type":"narration","text":"走廊里没人。公告栏的灯还亮着，照着那张处分决定的复印件。"},{"type":"narration","text":"记过。检查。取消评优。家长每两周来一次。就一个下午，四件事。他一件一件念给我听，念得很慢，像在念课文。"},{"type":"narration","text":"我走到楼梯口的时候，看见台阶上坐着个人。"},{"type":"narration","text":"猴子。"},{"type":"narration","text":"他手里拎着袋包子，看见我就站起来了。"},{"type":"dialogue","speaker":"houzi","text":"四个小时。你真能坐。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"你怎么在这儿。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"刚子说你进去就没出来。他先去食堂买了包子，让我在这儿等着。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"他人呢？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"houzi","text":"他不敢进来。他说他要是看见你出来，他会哭。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"me","text":"……","pose":"center","sprite":"default","enter":false,"exit":true},{"type":"dialogue","speaker":"houzi","text":"你别笑。他真会哭。上次看那个电影他哭了两次。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我接过包子。还是热的。"},{"type":"dialogue","speaker":"houzi","text":"吃吧。吃完再说。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"他从口袋里掏出张纸，塞给我。"},{"type":"dialogue","speaker":"houzi","text":"李杰让我给你的。他说他不来。","pose":"center","sprite":"default","enter":false,"exit":true},{"type":"narration","text":"我打开。"},{"type":"narration","text":"上面只写了几个字，是他的字，很用力。"},{"type":"narration","text":"别自己扛着。"},{"type":"narration","text":"我坐在楼梯上把包子吃完了。一个都没剩。"},{"type":"narration","text":"那天晚上我想了很多。"},{"type":"narration","text":"想李主任说的那些道理，想那张处分决定，想我到底错在哪。"},{"type":"narration","text":"最后我想明白了一件事——"},{"type":"narration","text":"我没错。我只是输了。"},{"type":"narration","text":"输了不丢人。丢了这俩人，才丢人。"},{"type":"ending","endingId":"bad"}]},{"id":"e-2","chapter":4,"name":"隐藏彩蛋 · 保温杯","background":"corridor","bgm":null,"lines":[{"type":"narration","text":"这一天，你碰巧路过教导处。"},{"type":"narration","text":"门虚掩着，里面有声音。"},{"type":"narration","text":"你本来应该走开的。但你听见了一声很闷的响动。"},{"type":"narration","text":"你停下脚步，从门缝往里看了一眼。"},{"type":"narration","text":"李主任坐在椅子上。"},{"type":"narration","text":"他面前的桌上摊着几份文件——"},{"type":"narration","text":"搁置的停车区方案、英语竞答的活动申请、"},{"type":"narration","text":"三区学生的大学规划汇总。"},{"type":"narration","text":"他逐份看，看完就放到一边。"},{"type":"narration","text":"然后他拿起了那个保温杯。"},{"type":"narration","text":"他举起来，举到半空，停住了。"},{"type":"dialogue","speaker":"lizhuren","text":"……算了。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"narration","text":"他把保温杯放下，叹了口气，"},{"type":"narration","text":"然后从抽屉里拿出个纸杯，给自己倒了杯凉水，一口喝完了。"},{"type":"dialogue","speaker":"lizhuren","text":"这群小崽子。","pose":"center","sprite":"s2","enter":false,"exit":true,"voice":"assets/a-3a460dfa13e19612.mp3","spriteScale":1.5},{"type":"narration","text":"他重新拿起笔，在那份大学规划汇总上写下了一行字。"},{"type":"narration","text":"你看不清写的是什么。"},{"type":"narration","text":"但你看清了他写完之后，把那份文件放进了待提交的那一摞里。"},{"type":"narration","text":"你悄悄退开了。"},{"type":"narration","text":"那天他到底写了什么，我到现在也不知道。但后来，三区那块地一直没被改成停车场。再后来，食堂的鸡腿饭，分量标准改了。"},{"type":"narration","text":"他从来没说过软话。他只是把能做的事做完，然后继续板着脸。行吧。那我以后少给他添点麻烦。少添点。不是不添。"},{"type":"narration","text":"★ 解锁隐藏 CG：保温杯（未摔）"},{"type":"narration","text":"—— 全 剧 终 ——"}],"next":[{"require":[{"var":"flags.route","op":"==","value":"a"}],"goto":"a-4"},{"require":[{"var":"flags.route","op":"==","value":"b"}],"goto":"b-4"},{"require":[{"var":"flags.route","op":"==","value":"c"}],"goto":"c-4"},{"goto":"d-3"}]},{"id":"a-end","chapter":3,"name":"结局判定","background":"playground","bgm":null,"lines":[{"type":"set","effects":{"affection.lijie":8}}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"require":[{"var":"affection.lijie","op":"\u003e=","value":85}],"goto":"e-2"},{"require":[{"var":"affection.lijie","op":"\u003e=","value":60}],"goto":"a-4n"},{"goto":"a-4b"}]},{"id":"b-end","chapter":3,"name":"结局判定","background":"office","bgm":null,"lines":[{"type":"set","effects":{"affection.zhouyong":12}}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"require":[{"var":"affection.zhouyong","op":"\u003e=","value":85}],"goto":"e-2"},{"require":[{"var":"affection.zhouyong","op":"\u003e=","value":60}],"goto":"b-4n"},{"goto":"b-4b"}]},{"id":"c-end","chapter":3,"name":"结局判定","background":"classroom","bgm":null,"lines":[{"type":"set","effects":{"affection.duxiaokui":8}}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"require":[{"var":"affection.duxiaokui","op":"\u003e=","value":85}],"goto":"e-2"},{"require":[{"var":"affection.duxiaokui","op":"\u003e=","value":60}],"goto":"c-4n"},{"goto":"c-4b"}]},{"id":"d-end","chapter":3,"name":"结局判定","background":"corridor","bgm":null,"lines":[{"type":"set","effects":{}}],"next":[{"require":[{"var":"flags.rule_broken","op":"\u003e=","value":2}],"goto":"e-0"},{"require":[{"var":"affection.houzi","op":"\u003e=","value":40},{"var":"affection.gangzi","op":"\u003e=","value":40}],"goto":"d-3"},{"require":[{"var":"affection.houzi","op":"\u003e=","value":25}],"goto":"d-3n"},{"goto":"d-3b"}]},{"id":"0-1-c2","chapter":1,"name":"开战（续）","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"就在这片其乐融融里——"},{"type":"narration","text":"教室后门的玻璃窗上多了张脸。"},{"type":"narration","text":"那张脸在笑。笑得很和善。和善到你看着它，会下意识地坐直。"},{"type":"narration","text":"李主任。教导主任。全校最不能惹的人。他不吼人，不拍桌子，他只会笑着看你，然后说，来我办公室坐坐。谁都知道那句坐坐的意思——你今天别想上课了。"},{"type":"narration","text":"李主任的目光在教室里扫了一圈。在刚子和猴子身上停了停，"},{"type":"narration","text":"在我桌上那包没藏好的薯片上停了停，"},{"type":"narration","text":"最后落到杜小葵身上，笑容又深了三分。"},{"type":"dialogue","speaker":"lizhuren","text":"小葵啊，早自习时间，讲课不要太……热烈。","pose":"center","sprite":"s2","enter":false,"exit":true,"spriteScale":1.5},{"type":"dialogue","speaker":"duxiaokui","text":"欸，好嘞主任，我这就收一收。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"char11","text":"唉 小李啊 对待老师同学们不要这么苛刻 要学会宽以待人","pose":"center","sprite":"s1","enter":true,"exit":true},{"type":"narration","text":"这个时候张校长不知道从哪里冒出来了"},{"type":"narration","text":"同学们至今不明白校长为什么穿着龙袍"},{"type":"narration","text":"这真没充钱？"},{"type":"dialogue","speaker":"lizhuren","text":"是是是 张校长说的对","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"lizhuren","text":"咳咳 同学们接着学习 来来来校长 我这刚到了几盒好茶","pose":"center","sprite":"s2","enter":true,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"char11","text":"嗯~聪慧","pose":"center","sprite":"s1","enter":true,"exit":true},{"type":"narration","text":"那张脸从窗口消失了。教室安静了好几秒。"},{"type":"narration","text":"然后一切恢复正常。"},{"type":"narration","text":"这就是我们学校。表面上是管理严格，实际上是张巨大的、柔软的、随时会收紧的网。"},{"type":"narration","text":"而我们十班，就是这张网上最松的那一格。最松的那一格，也是最自在的那一格。我喜欢这儿。"},{"type":"narration","text":"早自习铃响了。我的校园生活就这么开始了。"}],"next":"1-1"},{"id":"0-1-c1","chapter":1,"name":"开战（续）","background":"classroom","bgm":null,"lines":[{"type":"dialogue","speaker":"me","text":"老师，那抄作业的时态，是不是该用过去完成时？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"……对！因为作业是被抄完之后你才后悔的！","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-71594f5170d73ac6.mp3"},{"type":"narration","text":"他转身就把这句话写到了黑板上，写得特别大。"},{"type":"narration","text":"我就知道他会喜欢这个。这人跟我是同一类，见着能接梗的人就走不动道。"}],"next":"0-1-c2"},{"id":"1-1c-c","chapter":1,"name":"选 C：算了，不为难你（续）","background":"classroom","bgm":null,"lines":[{"type":"dialogue","speaker":"me","text":"昨天是我多嘴。中距离我去报，你别管了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……谁管你了。","pose":"center","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-5ff67056909ea42f.mp3"},{"type":"narration","text":"他嘴上这么说，手上把笔递了过来。"},{"type":"dialogue","speaker":"lijie","text":"写端正点。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"narration","text":"补救成功。这人只要你先低头，他立刻就把台阶铺到你脚底下。他等的从来不是道歉，是你先开口。"}],"next":"1-1d"},{"id":"1-3-c","chapter":1,"name":"48 分（续）","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"课间，我把成绩单折了折，塞进抽屉最里面。"},{"type":"dialogue","speaker":"lijie","text":"藏什么。我看见了。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"dialogue","speaker":"me","text":"……你眼神真好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"48。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"你能不能小点声。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"为什么。","pose":"center","sprite":"puzzled","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"因为我想活着。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李杰沉默了一会儿。然后他把自己那张 142 的成绩单，"},{"type":"narration","text":"也折了折，塞进了抽屉。"},{"type":"dialogue","speaker":"me","text":"你干嘛？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"……碍眼。","pose":"center","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"narration","text":"他是想说我不是在炫耀。但他那种说法翻译过来就是碍眼。这人真该去学那门外语。"}],"next":"1-4"},{"id":"1-5-c","chapter":1,"name":"走廊上的天气（续）","background":"corridor","bgm":null,"lines":[{"type":"dialogue","speaker":"me","text":"老师，我想补英语。从哪开始？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"从你愿意开口开始。你已经开始了。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"}],"next":"2-1"},{"id":"a-2-c","chapter":3,"name":"摊子塌了（续）","background":"playground","bgm":null,"lines":[{"type":"narration","text":"就在这时，有人从人群里挤了过来。"},{"type":"narration","text":"李杰黑着脸，手里拎着个工具箱。"},{"type":"dialogue","speaker":"lijie","text":"让开。","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"你怎么——","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我在隔壁摊位负责登记，全程看着你们的棚子歪了二十分钟。","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"narration","text":"他蹲下来，几下把横梁卸下来，翻了个面，"},{"type":"narration","text":"用扎带重新固定，又不知道从哪儿摸出来一卷胶带，把断口缠了几层。"},{"type":"narration","text":"整套动作用了几分钟。"},{"type":"dialogue","speaker":"lijie","text":"抬。","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"我和刚子一起把棚子架起来。稳了。"},{"type":"dialogue","speaker":"lijie","text":"饮料重新摆。牌子挂右边。排队线往后挪，不然一会儿又有人撞。","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-754aea76239c8d94.mp3"},{"type":"dialogue","speaker":"me","text":"你怎么什么都会？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"我初中在设计社。","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"me","text":"……你从来没说过。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"lijie","text":"谁会问啊。","pose":"right","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-c737b28c9a562a8d.mp3"},{"type":"narration","text":"他站起来拍了拍手上的灰，然后瞪了我一眼。"},{"type":"dialogue","speaker":"lijie","text":"真是受不了你这么笨。","pose":"right","sprite":"shy","enter":false,"exit":false,"voice":"assets/a-5ff67056909ea42f.mp3"},{"type":"narration","text":"说完他转身走了。"},{"type":"narration","text":"走之前，他把自己摊位上的饮料，放在了我们桌上。"},{"type":"dialogue","speaker":"gangzi","text":"……李杰人不错啊。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"他刚刚骂我们了。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"他骂人的时候还帮我们修棚子。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"houzi","text":"……行吧，人不错。","pose":"left","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"这就是李杰的关心。永远裹在嫌弃里。但我已经学会怎么拆了——把包装扔掉，里面就是好东西。"}],"next":"a-3"},{"id":"b-2-c","chapter":3,"name":"场地风波（续）","background":"corridor","bgm":null,"lines":[{"type":"narration","text":"门开了。周勇走出来，看见我站在走廊上。"},{"type":"narration","text":"他看了我一眼，什么都没说，径直走了。走了几步，停住。"},{"type":"dialogue","speaker":"zhouyong","text":"档案还没分完。","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"……哦。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"那天晚上，办公室的灯亮到很晚。"},{"type":"narration","text":"我隔着窗户看进去，周勇面前摊着本很厚的册子，"},{"type":"narration","text":"他一边翻，一边用红笔在纸上写着什么。"}],"next":"b-3"},{"id":"b-3-c","chapter":3,"name":"课间操（续）","background":"playground","bgm":null,"lines":[{"type":"narration","text":"第二天上午课间操铃响。"},{"type":"narration","text":"三区那块地上站了好几个班，一百多号人，整齐地做了一套广播体操。"},{"type":"narration","text":"路过的老师先是愣住，然后有几个笑了。"},{"type":"narration","text":"杜小葵直接加入进来，站在最后一排，动作比谁都标准。"},{"type":"narration","text":"李主任赶到的时候，操已经做完了。"},{"type":"dialogue","speaker":"lizhuren","text":"这、这是怎么回事？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"gangzi","text":"报告主任！我们在做课间操！缓解高三压力！","pose":"left","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"lizhuren","text":"谁让你们在这儿做的？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.5},{"type":"dialogue","speaker":"houzi","text":"报告！学生手册前言！","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李主任的脸抽动了一下。"},{"type":"narration","text":"就在这时，周勇从教学楼里走出来。"},{"type":"narration","text":"他手里拿着份文件，走到李主任面前。"},{"type":"dialogue","speaker":"zhouyong","text":"主任，我核对了一下。方案里改动的是校舍规划，而这块地在规划里登记的是学生活动场地。改用途要先修订规划，修订规划需要校务会三分之二多数。你手上的票不够。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"zhouyong","text":"另外，今天这场课间操我看过了，符合学生手册的相关条款，没有影响教学秩序，没有安全隐患。我建议，方案先搁置。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"李主任沉默了很久。"},{"type":"dialogue","speaker":"lizhuren","text":"……老周，你行。","pose":"left","sprite":"s2","enter":false,"exit":true,"spriteScale":1.5},{"type":"narration","text":"他转身走了。走之前看了我们一眼。"},{"type":"narration","text":"那一眼里没有恨意，只有一种我也有我的难处的疲惫。"},{"type":"narration","text":"成了。他输了这一局，但他不是坏人。他要的是好看的数据，因为那份数据决定学校能拿到多少资源。这块地变成停车位，老师能多停一些车。从管理者的角度看，这笔账是划算的。只是他没算上——一百多个学生做课间操的那个上午。"}],"next":"b-end"},{"id":"c-2-c","chapter":3,"name":"换个名字（续）","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"第二天，我们去找周勇。"},{"type":"dialogue","speaker":"zhouyong","text":"竞答？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"对。题目由英语组出，全程英语，时长可控，符合学科活动规范。中间穿插情景演绎，属于教学方法创新，是教务处年度工作重点里的原话。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"……","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"老师，你看行不行。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"周勇盯着我看了很久。"},{"type":"dialogue","speaker":"zhouyong","text":"你把这些条款从哪找出来的。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"手册。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"zhouyong","text":"手册上没有教学方法创新这句。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"me","text":"那是教务处去年的工作简报上写的。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"安静了几秒。"},{"type":"dialogue","speaker":"zhouyong","text":"……我知道了。我去和李主任沟通。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他转身要走，又停下。"},{"type":"dialogue","speaker":"zhouyong","text":"下不为例。","pose":"center","sprite":"default","enter":false,"exit":true,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"他说完这句话，嘴角动了一下。"},{"type":"narration","text":"我不确定那是不是笑。"}],"next":"c-2b"},{"id":"c-2b-c","chapter":3,"name":"排练地狱（续）","background":"playground","bgm":null,"lines":[{"type":"narration","text":"演出前一周，我们开始排练。"},{"type":"narration","text":"主持人是我。李杰演公主。刚子演护卫。猴子演那只被抢的三明治。"},{"type":"dialogue","speaker":"duxiaokui","text":"好，从头来。公主上场。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"lijie","text":"I have loved you since the day you stole my sandwich.","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"duxiaokui","text":"停。你那个 loved 念得像我已经爱完了。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"lijie","text":"……它就是过去式。","pose":"left","sprite":"normal","enter":false,"exit":false,"voice":"assets/a-ac958a1d4a04e01e.mp3"},{"type":"dialogue","speaker":"duxiaokui","text":"对，但它得念出我一直爱着你的味道。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"houzi","text":"老师，我这只三明治要不要有表情？","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"duxiaokui","text":"要。你是被抢走的那只三明治，表情应该充满不甘。","pose":"center","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"houzi","text":"懂了。","pose":"right","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"gangzi","text":"老师，我护卫要做什么？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"duxiaokui","text":"你站在旁边，看起来能打。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"dialogue","speaker":"gangzi","text":"那简单。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.2,"spriteY":0},{"type":"narration","text":"刚子往那儿一站，确实挺能打。"},{"type":"dialogue","speaker":"duxiaokui","text":"好，再来。这次李杰你把 stole 加重。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"dialogue","speaker":"lijie","text":"……为什么。","pose":"right","sprite":"puzzled","enter":false,"exit":false,"voice":"assets/a-f70f44fd97988577.mp3"},{"type":"dialogue","speaker":"duxiaokui","text":"因为三明治是被偷走的。偷这个字，是整个句子的重点。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-d048783c6459d681.mp3"},{"type":"dialogue","speaker":"lijie","text":"那不就是个三明治吗。","pose":"right","sprite":"normal","enter":false,"exit":true,"voice":"assets/a-27e45f1a2ae19b6b.mp3"},{"type":"dialogue","speaker":"duxiaokui","text":"对你来说是三明治。对说这句话的人来说，是有人抢走了他的生活。","pose":"left","sprite":"default","enter":false,"exit":false,"voice":"assets/a-42fa2669be4260f0.mp3"},{"type":"narration","text":"李杰愣住了。"},{"type":"dialogue","speaker":"duxiaokui","text":"……行了行了，别用那种眼神看我，我随口一说。","pose":"left","sprite":"default","enter":false,"exit":true,"voice":"assets/a-454abcbe0c0d8992.mp3"},{"type":"narration","text":"他不是随口一说。他写这句台词改了十几版，就为了让它听起来不土。有人愿意为句土味情话较真到这个地步，说明他是真的想把这件事做好。"},{"type":"narration","text":"那天我们排到很晚。"},{"type":"narration","text":"杜小葵一直站在台下，反复喊重来。"},{"type":"narration","text":"喊到最后嗓子都哑了，还在喊。"}],"next":"c-3"},{"id":"d-2-c","chapter":3,"name":"手抖观测计划（续）","background":"canteen","bgm":null,"lines":[{"type":"narration","text":"来称的人越来越多。队伍排到了走廊。"},{"type":"narration","text":"然后，食堂主任亲自出来，把当天所有的鸡腿饭，加了半勺肉。"},{"type":"dialogue","speaker":"houzi","text":"成了！","pose":"center","sprite":"default","enter":false,"exit":true},{"type":"dialogue","speaker":"gangzi","text":"成了！","pose":"left","sprite":"default","enter":false,"exit":true,"spriteScale":1.2,"spriteY":0},{"type":"dialogue","speaker":"me","text":"……就这么简单？","pose":"center","sprite":"default","enter":false,"exit":true},{"type":"narration","text":"第四天，我们仨被叫去了教导处。"}],"next":"d-2b"}],"endings":[{"id":"a_true","title":"真结局 · 明天见","text":"","kind":"true","condition":[{"var":"flags.route","op":"==","value":"a"},{"var":"affection.lijie","op":"\u003e=","value":85}]},{"id":"a_norm","title":"普通结局 · 下次见","text":"","kind":"normal","condition":[{"var":"flags.route","op":"==","value":"a"},{"var":"affection.lijie","op":"\u003e=","value":60}]},{"id":"a_lone","title":"疏远结局 · 前桌半年","text":"","kind":"bad","condition":[{"var":"flags.route","op":"==","value":"a"}]},{"id":"b_true","title":"真结局 · 三页纸","text":"","kind":"true","condition":[{"var":"f <script>
/* ============================================================================
 * Galgame 独立播放器引擎（单文件 / 零依赖 / 原生 ES2020+）
 * 数据来源：上方 id="galgame-data" 的 JSON 脚本块（由打包器整体替换占位符）

 * ========================================================================== */
(function () {
  'use strict';

  /* ==========================================================================
   * 模块 0 · Util —— 通用小工具
   * ========================================================================== */
  const $ = (sel) => document.querySelector(sel);

  /** HTML 转义，所有用户数据都经此进入 innerHTML */
  function esc(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /** 取字符串字段，非法则回退 */
  function str(v, fb = '') { return typeof v === 'string' ? v : (v == null ? fb : String(v)); }
  /** 取负整数（数组下标 / 索引） */
  function int(v, fb = 0) { const n = Number(v); return Number.isFinite(n) ? Math.trunc(n) : fb; }
  /** 取正数（时间间隔等） */
  function num(v, fb = 0) { const n = Number(v); return Number.isFinite(n) ? n : fb; }
  /** 取对象，非对象则回退空对象 */
  function obj(v) { return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
  /** 取数组，非数组则回退空数组 */
  function arr(v) { return Array.isArray(v) ? v : []; }
  /** 深拷贝（数据来自 JSON，结构安全） */
  function clone(v) { try { return JSON.parse(JSON.stringify(v)); } catch (e) { return null; } }

  /** 统一时间戳格式：2026-10-02 20:13 */
  function fmtTime(ts) {
    const n = num(ts, 0);
    if (!n) return '—';
    const d = new Date(n);
    if (isNaN(d.getTime())) return '—';
    const p = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /** localStorage 安全包装：无痕模式 / file:// 受限时降级为内存存储 */
  const memStore = Object.create(null);
  const LS = {
    available: (function () {
      try { const k = '__galgame_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    })(),
    get(k) { try { return this.available ? localStorage.getItem(k) : (k in memStore ? memStore[k] : null); } catch (e) { return null; } },
    set(k, v) { try { if (this.available) localStorage.setItem(k, v); else memStore[k] = v; } catch (e) { memStore[k] = v; } },
    del(k) { try { if (this.available) localStorage.removeItem(k); else delete memStore[k]; } catch (e) { delete memStore[k]; } },
    /** 读 JSON，解析失败返回 fallback */
    getJSON(k, fb) {
      const raw = this.get(k);
      if (!raw) return fb;
      try { const v = JSON.parse(raw); return v == null ? fb : v; } catch (e) { return fb; }
    },
    setJSON(k, v) { this.set(k, JSON.stringify(v)); }
  };

  /* localStorage 键名（按作品标题隔离，避免多部作品互相覆盖） */
  const KEY = {
    settings: 'galgame.settings.v1',
    audio: 'galgame.audio.v1',
    autosave: 'galgame.save.auto.v1',
    slot: (i) => `galgame.save.slot${i}.v1`,
    gallery: 'galgame.gallery.v1',
    read: 'galgame.read.v1'
  };

  /* ==========================================================================
   * 模块 1 · Data —— 读取并规范化数据契约（Story Schema v1）
   * 规范化原则：任何缺失 / 类型错误都降级为安全值，绝不抛错白屏
   * ========================================================================== */
  /**
   * 打包器会把**重复出现的**内联素材（同一段 BGM 挂在多幕上之类）抽成
   * id="galgame-assets" 里的共享池，正文只留 "\u0000asset#N" 这样的引用。
   * 这里在读数据时还原回去，引擎其余部分完全不用知道池子的存在。
   */
  const ASSET_REF = /^\u0000asset#(\d+)$/;

  function resolveSharedAssets(v, pool) {
    if (typeof v === 'string') {
      const m = ASSET_REF.exec(v);
      return m ? (pool[v] !== undefined ? pool[v] : v) : v;
    }
    if (Array.isArray(v)) {
      for (let i = 0; i < v.length; i++) v[i] = resolveSharedAssets(v[i], pool);
      return v;
    }
    if (v && typeof v === 'object') {
      for (const k of Object.keys(v)) v[k] = resolveSharedAssets(v[k], pool);
      return v;
    }
    return v;
  }

  function readRawData() {
    const el = document.getElementById('galgame-data');
    if (!el) return { ok: false, err: '缺少数据容器（galgame-data）' };
    const text = (el.textContent || '').trim();
    if (!text) return { ok: false, err: '数据为空：打包器尚未注入剧本 JSON' };
    try {
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== 'object') return { ok: false, err: '剧本 JSON 顶层不是对象' };
      // 还原被抽取的共享素材（没有池子时是 null，直接跳过）
      try {
        const poolEl = document.getElementById('galgame-assets');
        if (poolEl) {
          const poolText = (poolEl.textContent || '').trim();
          if (poolText && poolText !== 'null') {
            const pool = JSON.parse(poolText);
            if (pool && typeof pool === 'object') resolveSharedAssets(parsed, pool);
          }
        }
      } catch (e) { /* 池子坏了不该让整个游戏起不来，正文里仍留着引用串 */ }
      return { ok: true, data: parsed };
    } catch (e) {
      return { ok: false, err: '剧本 JSON 解析失败：' + (e && e.message ? e.message : e) };
    }
  }

  const CELL_COUNT = 12; // placeholder.gradient 被切分的色标格子数

  /** 把 gradient 字符串切成若干色，供占位立绘上色 */
  function parseGradientColors(gradient, fb) {
    const s = str(gradient, '');
    const hexes = s.match(/#[0-9a-fA-F]{3,8}\b/g) || [];
    const rgbas = s.match(/rgba?\([^)]*\)/g) || [];
    const list = hexes.concat(rgbas).map((c) => c.trim());
    if (!list.length) return { colors: [], raw: '' };
    const out = [];
    for (let i = 0; i < CELL_COUNT; i++) out.push(list[Math.min(list.length - 1, Math.floor(i * list.length / CELL_COUNT))]);
    return { colors: out, raw: list[list.length - 1], first: list[0] };
  }

  /* ---- v2 条件（endings[].condition / choice.options[].require 共用同一套结构） ---- */
  const COND_OPS = ['>=', '>', '<=', '<', '==', '!='];

  /**
   * 规范化条件数组：只保留合法项（var 非空、op 受支持）。
   * 非法项被丢弃并写入 warnings（不阻断播放）。
   */
  function normalizeConditions(list, where) {
    const out = [];
    arr(list).forEach((c, i) => {
      if (!c || typeof c !== 'object') return;
      const v = str(c.var, '');
      const op = str(c.op, '');
      if (!v) return;
      if (COND_OPS.indexOf(op) < 0) return;
      out.push({ var: v, op, value: ('value' in c) ? c.value : 0 });
    });
    return out;
  }

  /**
   * 条件求值：变量不存在按 0 处理；全部条件 AND。
   * 返回 { ok, results:[{var,op,value,actual,pass}] }
   */
  /**
   * 规范化场景级跳转 scene.next。
   *   "sceneId"                                 直接跳
   *   [{ require:[...], goto:"id" }, …]          依次判定，取第一条满足的；没 require 的当兜底
   * 目标不存在时**丢弃该条**（不要留着一个跳不动的目标，那会让玩家卡在场景里）。
   */
  function normNext(raw) {
    if (typeof raw === 'string') return raw.trim() || null;
    if (!Array.isArray(raw)) return null;
    const rules = [];
    for (const r of raw) {
      if (!r || typeof r !== 'object') continue;
      const g = str(r.goto, '').trim();
      if (!g) continue;
      const req = normalizeConditions(r.require, 'scene.next');
      rules.push(req.length ? { require: req, goto: g } : { goto: g });
    }
    return rules.length ? rules : null;
  }

  function evalConditions(list) {
    const results = arr(list).map((c) => {
      const actual = (c.var in State.vars) ? State.vars[c.var] : 0;
      return { var: c.var, op: c.op, value: c.value, actual, pass: compareVars(actual, c.op, c.value) };
    });
    return { ok: results.every((r) => r.pass), results };
  }

  /** 单次比较；类型不可比时退回宽松比较，仍不可比则判不成立 */
  function compareVars(actual, op, expected) {
    if (op === '==') return looseEq(actual, expected);
    if (op === '!=') return !looseEq(actual, expected);
    const a = Number(actual), b = Number(expected);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return false;
    if (op === '>=') return a >= b;
    if (op === '>') return a > b;
    if (op === '<=') return a <= b;
    if (op === '<') return a < b;
    return false;
  }
  /** 宽松相等：'1'==1、1==true、true=='true' 均成立（作者手写 JSON 常见写法） */
  function looseEq(a, b) {
    if (a === b) return true;
    if (typeof a === 'number' || typeof b === 'number') return Number(a) === Number(b);
    if (typeof a === 'boolean' || typeof b === 'boolean') return String(a) === String(b);
    return String(a) === String(b);
  }

  /** 条件可读化：affection.yuki >= 10 → 「affection.yuki ≥ 10」 */
  const OP_CN = { '>=': '≥', '>': '>', '<=': '≤', '<': '<', '==': '=', '!=': '≠' };
  function condText(c, withActual) {
    const op = OP_CN[str(c.op, '')] || str(c.op, '');
    const base = `${str(c.var, '')} ${op} ${fmtVar(c.value)}`;
    return withActual ? `${base}（当前 ${fmtVar(c.actual)}）` : base;
  }

  /* ---- v3 立绘变换 / 音频 的取值工具 ---- */
  /** 夹到 [min,max]；非数字回退默认值 */
  function clampNum(v, min, max, fb) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fb;
    return Math.min(max, Math.max(min, n));
  }
  function clamp01(v, fb) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fb;
    return Math.min(1, Math.max(0, n));
  }
  /**
   * 音频只接受 data:audio/... 的 data URL（防外链与注入），其它一律 null。
   * 返回值统一带 `data` 与 `key`（key 用于"同一首不重头播"的判断）。
   */
  function normAudio(v) {
    const s = str(v, '');
    if (!s) return null;
    // 明确挡掉可执行协议
    if (/^\s*(javascript|vbscript):/i.test(s)) return null;
    // 支持两种来源：
    //   1. 内联 data URL —— 单文件自包含产物的形态；
    //   2. **相对路径 / http(s) 链接** —— 素材拆成独立文件的部署版形态
    //      （静态托管下这样首屏更快、素材能被浏览器单独缓存）。
    const looksLikeAudio = s.indexOf('data:audio/') === 0
      || /^(https?:)?\/\//i.test(s)
      || /\.(mp3|m4a|aac|ogg|oga|opus|wav|webm|flac)(\?|#|$)/i.test(s);
    if (!looksLikeAudio) return null;
    return { data: s, key: lineHash('audio', 0, s.slice(0, 96) + ':' + s.length) };
  }
  /** 立绘变换：角色级默认值，被行级同名字段覆盖 */
  function spriteTransformOf(ch, line) {
    const o = obj(line);
    const pick = (field) => {
      const v = o[field];
      const n0 = Number(v);
      if (v !== undefined && v !== null && v !== '' && Number.isFinite(n0)) return { v: n0, from: 'line' };
      const c = Number(obj(ch)[field]);
      if (Number.isFinite(c)) return { v: c, from: 'char' };
      return { v: null, from: 'none' };
    };
    const sc = pick('spriteScale');
    const sx = pick('spriteX');
    const sy = pick('spriteY');
    return {
      scale: clampNum(sc.v, 0.4, 2.0, 1),
      x: clampNum(sx.v, -50, 50, 0),
      y: clampNum(sy.v, -30, 30, 0),
      src: { scale: sc.from, x: sx.from, y: sy.from }
    };
  }
  /** 变换串：位移百分比相对立绘自身尺寸（translate 的百分比基准就是元素自身） */
  function transformStr(t) {
    return `translate(${t.x}%, ${t.y}%) scale(${t.scale})`;
  }

  function normalizeData(raw) {
    const meta = obj(raw.meta);
    const theme = obj(meta.theme);
    const data = {
      meta: {
        title: str(meta.title, '未命名作品'),
        subtitle: str(meta.subtitle, ''),
        author: str(meta.author, ''),
        version: str(meta.version, ''),
        createdAt: str(meta.createdAt, ''),
        language: str(meta.language, 'zh-CN'),
        synopsis: str(meta.synopsis, ''),
        tags: arr(meta.tags).map((t) => str(t, '')).filter(Boolean),
        cover: typeof meta.cover === 'string' && meta.cover ? meta.cover : null,   // v2 封面图（data URL）
        affectionMax: Math.max(1, num(meta.affectionMax, 20)),                     // v2 好感度量程
        bgmVolume: clamp01(meta.bgmVolume, 0.6),                                   // v3 全局背景音音量
        voiceVolume: clamp01(meta.voiceVolume, 0.9),                               // v3 全局语音音量
        soloStage: meta.soloStage === true,                                        // v4 单人舞台（同时只出现一个角色）
        theme: {
          primary: str(theme.primary, '') || '#ff8fb1',
          accent: str(theme.accent, '') || '#8fb1ff',
          bg: str(theme.bg, '') || '#101425'
        }
      },
      characters: [],
      backgrounds: [],
      scenes: [],
      endings: [],
      start: str(raw.start, ''),
      warnings: []
    };

    // ---- 角色 ----
    arr(raw.characters).forEach((c, i) => {
      if (!c || typeof c !== 'object') { data.warnings.push(`characters[${i}] 不是对象，已跳过`); return; }
      const id = str(c.id, '');
      if (!id) { data.warnings.push(`characters[${i}] 缺少 id，已跳过`); return; }
      const ph = obj(c.placeholder);
      const grad = parseGradientColors(ph.gradient, null);
      data.characters.push({
        id,
        name: str(c.name, id),
        color: str(c.color, '') || data.meta.theme.primary,
        role: str(c.role, ''),
        profile: str(c.profile, ''),
        sprites: obj(c.sprites),
        // v2：好感度变量名（缺省约定 affection.<id>）与显示名
        // v4：不可攻略角色没有好感度系统（后端归一化后 romanceable:false 且 affectionKey 为空）
        romanceable: c.romanceable !== false,
        affectionKey: str(c.affectionKey, '') || ('affection.' + id),
        affectionLabel: str(c.affectionLabel, '') || '好感度',
        // v3：立绘默认变换
        // v4：不可攻略、但好感度会影响结局的角色（刚子 / 猴子）。
        // **必须显式带过来** —— 角色对象是逐字段构造的，漏了这里标记就等于不存在，
        // 好感度面板会把这两个数字藏起来，而三区线真结局恰恰卡在他们身上。
        ...(c.showAffection === true ? { showAffection: true } : {}),
        spriteScale: clampNum(c.spriteScale, 0.4, 2.0, 1),
        spriteX: clampNum(c.spriteX, -50, 50, 0),
        spriteY: clampNum(c.spriteY, -30, 30, 0),
        // 不出现在画面上的角色（第一人称主角「我」）：摆位逻辑据此跳过。
        // **必须显式带过来** —— 角色对象是逐字段构造的，漏了这里这个标记就等于不存在，
        // 于是没有立绘的主角会被摆上台、再回退成 emoji 占位符（和 scene.next 是同一个坑）。
        noStage: c.noStage === true,
        placeholder: {
          emoji: str(ph.emoji, '👤'),
          gradient: str(ph.gradient, ''),
          colors: grad.colors,
          fallback: grad.colors.length ? '' : `linear-gradient(160deg,${data.meta.theme.primary},${data.meta.theme.accent})`
        }
      });
    });

    // ---- 背景 ----
    arr(raw.backgrounds).forEach((b, i) => {
      if (!b || typeof b !== 'object') { data.warnings.push(`backgrounds[${i}] 不是对象，已跳过`); return; }
      const id = str(b.id, '');
      if (!id) { data.warnings.push(`backgrounds[${i}] 缺少 id，已跳过`); return; }
      const image = typeof b.image === 'string' && b.image ? b.image : null;
      data.backgrounds.push({
        id,
        name: str(b.name, id),
        css: str(b.css, '') || `linear-gradient(180deg,${data.meta.theme.bg},#1c2140)`,
        image
      });
    });

    // ---- 场景 ----
    arr(raw.scenes).forEach((s, i) => {
      if (!s || typeof s !== 'object') { data.warnings.push(`scenes[${i}] 不是对象，已跳过`); return; }
      const id = str(s.id, '');
      if (!id) { data.warnings.push(`scenes[${i}] 缺少 id，已跳过`); return; }
      data.scenes.push({
        id,
        chapter: int(s.chapter, 0),
        name: str(s.name, id),
        background: str(s.background, ''),
        // v3：场景背景音
        bgm: normAudio(s.bgm),
        bgmName: str(s.bgmName, ''),
        bgmVolume: (s.bgmVolume === undefined || s.bgmVolume === null) ? null : clamp01(s.bgmVolume, 0.6),
        bgmLoop: s.bgmLoop === false ? false : true,
        // v3：场景级跳转。**必须在这里显式带过来** —— 场景对象是逐字段构造的，
        // 加了字段却忘了这里，运行时 sc.next 永远是 undefined，
        // 所有分支都会静默退回"数组顺序"，而且不报任何错。
        next: normNext(s.next),
        lines: arr(s.lines).filter((l) => l && typeof l === 'object')
      });
    });

    // ---- 结局 ----
    const KINDS = ['true', 'good', 'normal', 'bad'];
    arr(raw.endings).forEach((e, i) => {
      if (!e || typeof e !== 'object') { data.warnings.push(`endings[${i}] 不是对象，已跳过`); return; }
      const id = str(e.id, '');
      if (!id) { data.warnings.push(`endings[${i}] 缺少 id，已跳过`); return; }
      const kind = str(e.kind, 'normal');
      data.endings.push({
        id,
        title: str(e.title, '结局'),
        text: str(e.text, ''),
        kind: KINDS.indexOf(kind) >= 0 ? kind : 'normal',
        // v2：触发条件（数组内 AND；空数组/省略 = 无条件）
        condition: normalizeConditions(e.condition, `endings[${i}](${id})`)
      });
    });

    // ---- 索引表（快速查找） ----
    data.charMap = Object.create(null);
    data.characters.forEach((c) => { if (!(c.id in data.charMap)) data.charMap[c.id] = c; });
    data.bgMap = Object.create(null);
    data.backgrounds.forEach((b) => { if (!(b.id in data.bgMap)) data.bgMap[b.id] = b; });
    data.sceneMap = Object.create(null);
    data.scenes.forEach((s) => { if (!(s.id in data.sceneMap)) data.sceneMap[s.id] = s; });
    data.endingMap = Object.create(null);
    data.endings.forEach((e) => { if (!(e.id in data.endingMap)) data.endingMap[e.id] = e; });

    // ---- 契约自检（只提示，不阻断） ----
    if (!data.start || !data.sceneMap[data.start]) {
      data.warnings.push(`start 场景「${data.start || '空'}」不存在`);
      data.start = data.scenes.length ? data.scenes[0].id : '';
    }
    if (!data.characters.length) data.warnings.push('characters 为空：台词将只显示文本');
    if (!data.scenes.length) data.warnings.push('scenes 为空：无法开始游戏');
    data.scenes.forEach((s) => {
      if (s.background && !data.bgMap[s.background]) {
        data.warnings.push(`场景 ${s.id} 的背景「${s.background}」不存在，已回退默认背景`);
      }
      s.lines.forEach((l, li) => {
        if (str(l.type, '') === 'choice') {
          arr(l.options).forEach((o, oi) => {
            const oo = obj(o);
            if (!o || typeof o !== 'object') { data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 不是对象，已跳过`); return; }
            const g = str(oo.goto, '');
            // v2：goto / ending 都为空是合法的（顺延到下一个场景）
            if (g && !data.sceneMap[g]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 goto「${g}」不存在`);
            const en = str(oo.ending, '');
            if (en && !data.endingMap[en]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 ending「${en}」不存在`);
            const req = normalizeConditions(oo.require, `choice.require`);
            if (req.length !== arr(oo.require).length) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 require 有非法条件，已忽略`);
          });
        }
        if (str(l.type, '') === 'ending') {
          if (l.byCondition === true) {
            if (!data.endings.length) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行用了 byCondition，但没有任何结局定义`);
          } else {
            const eid = str(l.endingId, '');
            if (!eid || !data.endingMap[eid]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 endingId「${eid || '空'}」不存在`);
          }
        }
        if (str(l.type, '') === 'dialogue') {
          const sp = str(l.speaker, '');
          if (sp && !data.charMap[sp]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 speaker「${sp}」不存在`);
        }
        // v2 行级背景覆盖：id 不存在只提示，播放时自动沿用场景背景
        if (str(l.type, '') !== 'ending') {
          const lb = str(l.background, '');
          if (lb && !data.bgMap[lb]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 background「${lb}」不存在，已沿用场景背景`);
        }
      });
    });
    return data;
  }

  /* ==========================================================================
   * 模块 2 · Persist —— 设置 / 存档 / 图鉴 / 已读 的读写
   * ========================================================================== */
  const DEFAULT_SETTINGS = {
    textSpeed: 'medium',      // slow | medium | fast | instant
    fontSize: 'medium',       // small | medium | large
    autoPlay: false,
    autoInterval: 2200,       // ms
    skipRead: false           // 跳过已读（已读文本瞬间显示）
  };
  /* v3 音频默认值（真实初值在 init 里按 meta.bgmVolume / meta.voiceVolume 覆盖） */
  const DEFAULT_AUDIO = { bgmVolume: 0.6, voiceVolume: 0.9, mute: false };
  const SPEED_MS = { slow: 68, medium: 34, fast: 16, instant: 0 };

  const Persist = {
    /** v3：音频设置单独存一个键，避免被"重置全部数据"之外的地方覆盖 */
    readAudioSettings() {
      const a = obj(LS.getJSON(KEY.audio, null) || {});
      const out = {
        bgmVolume: clamp01(a.bgmVolume, DEFAULT_AUDIO.bgmVolume),
        voiceVolume: clamp01(a.voiceVolume, DEFAULT_AUDIO.voiceVolume),
        mute: typeof a.mute === 'boolean' ? a.mute : false
      };
      out.__saved = (typeof a.bgmVolume === 'number' || typeof a.voiceVolume === 'number' || typeof a.mute === 'boolean');
      return out;
    },
    writeAudioSettings() {
      LS.setJSON(KEY.audio, {
        bgmVolume: State.audio.bgmVolume,
        voiceVolume: State.audio.voiceVolume,
        mute: State.audio.mute
      });
    },
    readSettings() {
      const s = obj(LS.getJSON(KEY.settings, {}));
      const out = Object.assign({}, DEFAULT_SETTINGS);
      if (['slow', 'medium', 'fast', 'instant'].indexOf(s.textSpeed) >= 0) out.textSpeed = s.textSpeed;
      if (['small', 'medium', 'large'].indexOf(s.fontSize) >= 0) out.fontSize = s.fontSize;
      if (typeof s.autoPlay === 'boolean') out.autoPlay = s.autoPlay;
      if (typeof s.skipRead === 'boolean') out.skipRead = s.skipRead;
      const iv = num(s.autoInterval, DEFAULT_SETTINGS.autoInterval);
      out.autoInterval = Math.min(8000, Math.max(600, iv));
      return out;
    },
    writeSettings() { LS.setJSON(KEY.settings, State.settings); },

    readGallery() {
      const g = LS.getJSON(KEY.gallery, {});
      const out = {};
      if (g && typeof g === 'object' && !Array.isArray(g)) {
        Object.keys(g).forEach((k) => {
          const v = g[k];
          out[k] = { at: num(obj(v).at, 0), title: str(obj(v).title, '') };
        });
      }
      return out;
    },
    writeGallery() { LS.setJSON(KEY.gallery, State.gallery); },

    readSlot(i) {
      const o = LS.getJSON(KEY.slot(i), null);
      return o && typeof o === 'object' ? o : null;
    },
    readAuto() {
      const o = LS.getJSON(KEY.autosave, null);
      return o && typeof o === 'object' ? o : null;
    },

    readRead() {
      const r = LS.getJSON(KEY.read, []);
      const out = [];
      if (Array.isArray(r)) r.forEach((x) => { if (typeof x === 'string') out.push(x); });
      return out;
    },
    writeRead() {
      const list = Array.from(State.readSet);
      // 上限 4000 条，超出丢最早的，避免 localStorage 膨胀
      LS.setJSON(KEY.read, list.slice(-4000));
    }
  };

  /* 已读标记：用低成本哈希标识一行文本 */
  function lineHash(sceneId, idx, text) {
    const s = sceneId + '|' + idx + '|' + text;
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }

  /* ==========================================================================
   * 模块 3 · State —— 全局状态与 DOM 缓存
   * ========================================================================== */
  const SPEEDS = ['slow', 'medium', 'fast', 'instant'];
  const POSITIONS = ['left', 'center', 'right'];

  const el = {

    cgView: $('#cg-view'),
    cgImage: $('#cg-image'),
    cgCaption: $('#cg-caption'),
    mgRoot: $('#minigame'),
    mgTitle: $('#mg-title'),
    mgLap: $('#mg-lap'),
mgLaps: $('#mg-laps'),
    mgTrack: $('#mg-track'),
    mgSlot: { gz: $('#mg-slot-gz'), jh: $('#mg-slot-jh') },
    mgCutin: $('#mg-cutin'),
    mgCutinImg: $('#mg-cutin-img'),
    mgCutinText: $('#mg-cutin-text'),
    mgResult: $('#mg-result'),
    mgResultWho: $('#mg-result-who'),
    mgNext: $('#mg-next'),
    mgHint: $('#mg-hint'),
    mgBoost: $('#mg-boost'),
    app: $('#app'),
    titleScreen: $('#title-screen'),
    titleMain: $('#title-main'),
    titleSub: $('#title-sub'),
    titleSynopsis: $('#title-synopsis'),
    titleTags: $('#title-tags'),
    titleFoot: $('#title-foot'),
    titleWarn: $('#title-warn'),
    btnStart: $('#btn-start'),
    btnContinue: $('#btn-continue'),
    btnGallery: $('#btn-gallery'),
    btnSettings: $('#btn-settings'),

    coverImage: $('#cover-image'),
    btnAffection: $('#btn-affection'),
    btnRotate: $('#btn-rotate'),
    rotateHint: $('#rotate-hint'),
    rotateHintTurn: $('#rotate-hint-turn'),
    rotateHintDismiss: $('#rotate-hint-dismiss'),

    gameScreen: $('#game-screen'),
    bgA: $('#bg-a'),
    bgB: $('#bg-b'),
    slot: { left: $('#slot-left'), center: $('#slot-center'), right: $('#slot-right') },
    chapterChip: $('#chapter-chip'),
    quickBar: $('.quick-bar'),
    qbLog: $('#qb-log'),
    qbAuto: $('#qb-auto'),
    qbSave: $('#qb-save'),
    qbMenu: $('#qb-menu'),
    dbox: $('#dialogue-box'),
    speaker: $('#speaker-name'),
    dtext: $('#dialogue-text'),
    mark: $('#advance-mark'),
    choiceList: $('#choice-list'),
    toast: $('#toast'),
    bgmToggle: $('#bgm-toggle'),
    bgmTitle: $('#bgm-title'),

    endingScreen: $('#ending-screen'),
    endingKind: $('#ending-kind'),
    endingTitle: $('#ending-title'),
    endingText: $('#ending-text'),
    endingCond: $('#ending-cond'),
    endingVars: $('#ending-vars'),
    btnEndingTitle: $('#btn-ending-title'),
    btnEndingGallery: $('#btn-ending-gallery'),

    modalRoot: $('#modal-root')
  };

  const State = {
    data: null,
    dataErr: '',
    hasSave: false,

    settings: Persist.readSettings(),
    /** v3 音频设置（独立持久化；初值由 meta 覆盖） */
    audio: (() => {
      const a = Persist.readAudioSettings();
      return { bgmVolume: a.bgmVolume, voiceVolume: a.voiceVolume, mute: a.mute, saved: !!a.__saved };
    })(),
    gallery: Persist.readGallery(),
    readSet: new Set(Persist.readRead()),

    phase: 'title',            // title | line | choice | ending
    playMode: 'title',         // title | game | ending（控制显示哪一层屏幕）
    modal: null,               // 当前打开的面板名
    modalReturnFocus: null,
    uiLocked: false,           // 模态打开时禁止推进
    fatal: '',                 // 致命错误文案（写入标题屏提示）

    sceneId: '',
    sceneIdx: -1,
    lineIdx: -1,
    currentLine: null,
    bgId: '',                  // 当前生效的背景 id（含行级 background 覆盖）
    vars: {},
    sprites: {},               // pos -> { charId, key, pose }
    history: [],               // [{ name, color, text, narr }]
    pendingChoice: null,
    choiceOptions: [],
    /** v3：本句带 exit 的角色，等"翻到下一句"时才真正退场（这一句仍然看得见他） */
    deferredExit: Object.create(null),
    endingVarsSnapshot: null,
    endedId: '',
    cg: false,                 // 独立插图显示中：同样屏蔽推进
    minigame: false,           // 小游戏进行中：期间屏蔽剧情推进
    visitedOrder: [],          // 本次游玩经过的场景 id
    steps: 0
  };
  const Runtime = {
    bgVisible: 'a',
    bgCurrent: '',            // 当前已生效的背景 id（存档 / 行级覆盖用）
    bgRendered: '',           // 当前**已渲染**的背景 id（去重用，与 bgCurrent 含义不同）
    bgScene: '',              // 当前场景自身的背景 id
    bgSourceScene: '',        // 决定"当前背景"的那一行所属场景 id
    bgSourceSceneBg: '',      // 该场景自身的背景 id（判断是否被行级覆盖）
    bgRev: 0,                 // 背景切换次数（便于自动化断言"确实换了背景"）
    type: { raf: 0, full: '', shown: 0, done: true, timer: 0 },
    autoTimer: 0,
    autoTextTimer: 0,
    toastTimer: 0
  };

  const hasSaveData = () => !!(Persist.readAuto() || [1, 2, 3].some((i) => Persist.readSlot(i)));

  /* ==========================================================================
   * 模块 4 · Render —— 主题 / 背景 / 立绘 / 对话 / 结局 / 面板
   * ========================================================================== */
  function applyTheme() {
    const t = State.data ? State.data.meta.theme : { primary: '#ff8fb1', accent: '#8fb1ff', bg: '#101425' };
    const r = document.documentElement.style;
    r.setProperty('--cg-primary', t.primary);
    r.setProperty('--cg-accent', t.accent);
    r.setProperty('--cg-bg', t.bg);
    r.setProperty('--cg-primary-soft', hexToRgba(t.primary, 0.2));
    r.setProperty('--cg-accent-soft', hexToRgba(t.accent, 0.2));
  }
  /** #rgb / #rrggbb → rgba()；非 hex 原样返回（允许直接写颜色关键字） */
  function hexToRgba(color, alpha) {
    const s = str(color, '');
    const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(s.trim());
    if (!m) return s || 'rgba(255,143,177,' + alpha + ')';
    let hex = m[1];
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    const n = parseInt(hex, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
  }
  function applyFontSize() { document.documentElement.setAttribute('data-fontsize', State.settings.fontSize); }

  /* ---------------------------- 屏幕切换 ---------------------------- */
  function showScreen(name) {
    State.playMode = name;
    el.titleScreen.classList.toggle('hidden', name !== 'title');
    el.gameScreen.classList.toggle('hidden', name !== 'game');
    el.endingScreen.classList.toggle('hidden', name !== 'ending');
    document.documentElement.setAttribute('data-screen', name);
  }

  function toast(msg, ms) {
    if (!el.toast) return;
    el.toast.textContent = str(msg, '');
    el.toast.classList.add('on');
    clearTimeout(Runtime.toastTimer);
    Runtime.toastTimer = setTimeout(() => el.toast.classList.remove('on'), num(ms, 1800));
  }

  /* ---------------------------- 背景渲染 ---------------------------- */
  /** 按 id 取背景对象；id 非法时不回退（由调用方决定回退策略） */
  function bgById(bgId) {
    const d = State.data;
    if (!d || !bgId) return null;
    return d.bgMap[bgId] || null;
  }
  /** 通用回退：非法/缺失时用第一个背景；完全没背景则返回 null */
  function resolveBackground(bgId) {
    const d = State.data;
    if (!d) return null;
    return bgById(bgId) || d.backgrounds[0] || null;
  }
  /**
   * 应用背景（交叉淡入淡出）；返回真正显示出来的背景对象。
   * 关键：与「当前**已渲染**的背景」相同则直接返回，避免同一场景/同一背景重复切换。
   */
  function applyBackground(bgId) {
    const bg = resolveBackground(bgId);
    const wantId = bg ? bg.id : '';
    // 已经画着同一个背景 → 不重复切换（背景层也不翻转）
    if (wantId && wantId === Runtime.bgRendered) return bg;
    const css = bg && bg.image
      ? { image: bg.image, css: bg.css }
      : { image: null, css: bg ? bg.css : State.data.meta.theme.bg };
    const cur = Runtime.bgVisible === 'a' ? el.bgA : el.bgB;
    const next = Runtime.bgVisible === 'a' ? el.bgB : el.bgA;
    const styleOf = (node) => {
      if (css.image) { node.style.background = ''; node.style.backgroundImage = `url("${css.image}")`; }
      else { node.style.backgroundImage = 'none'; node.style.background = css.css; }
    };
    // 首个背景：直接显示，不做黑场闪烁
    if (!cur.classList.contains('active')) {
      styleOf(cur); cur.classList.add('active');
      Runtime.bgRendered = wantId;
      Runtime.bgCurrent = wantId;
      Runtime.bgRev++;
      return bg;
    }
    styleOf(next);
    next.classList.add('active');
    cur.classList.remove('active');
    Runtime.bgVisible = Runtime.bgVisible === 'a' ? 'b' : 'a';
    Runtime.bgRendered = wantId;
    Runtime.bgCurrent = wantId;
    Runtime.bgRev++;
    return bg;
  }

  /**
   * v2 行级背景覆盖：非 ending 的行可带 background 字段。
   * - 该行有合法 background → 用它
   * - 该行有 background 但 id 非法 → 忽略该字段，**保持当前背景不变**
   * - 该行没有 background → 回到所在场景的背景
   * 顺带更新 State.bgId（存档记录的就是"当时背景"）。
   */
  function applyLineBackground(line) {
    const sc = currentSceneSafe();
    const hasField = line && typeof line === 'object' && str(line.background, '') !== '';
    const lineBg = hasField ? str(line.background, '') : '';
    let want = '';
    if (hasField) {
      // 合法 id 用行级背景；非法 id 视为"保持现状"（契约由后端校验兜底）
      want = bgById(lineBg) ? lineBg : Runtime.bgCurrent;
    } else {
      want = sc ? sc.background : '';
    }
    const bg = applyBackground(want);
    State.bgId = bg ? bg.id : want;
    // 记录"当前背景由哪一行的场景/行级覆盖决定"，供调试接口判断来源
    Runtime.bgSourceScene = sc ? sc.id : '';
    Runtime.bgSourceSceneBg = sc ? sc.background : '';
    return bg;
  }
  /** 供 applyLineBackground 使用的当前场景（避免与 currentScene 的声明顺序耦合） */
  function currentSceneSafe() {
    return (State.data && State.data.sceneMap[State.sceneId]) || null;
  }

  /* ---------------------------- 立绘渲染 ---------------------------- */
  const spriteCache = new Map(); // charId|key -> 立绘片段（不含变换）

  /**
   * v3 立绘取图：sprite 键不存在时回退到**该角色的第一张立绘**，
   * 只有该角色完全没有立绘时才回退到 emoji + 渐变占位。
   * 返回 { src, key }（key 为实际使用的立绘名，用于切换条/调试断言）
   */
  function pickSprite(ch, wantKey) {
    const sprites = obj(ch.sprites);
    const want = str(wantKey, '') || 'default';
    const keys = Object.keys(sprites).filter((k) => typeof sprites[k] === 'string' && sprites[k]);
    if (!keys.length) return { src: '', key: '' };                       // 没有任何立绘 → 占位
    if (sprites[want]) return { src: sprites[want], key: want };          // 指定键存在
    return { src: sprites[keys[0]], key: keys[0] };                      // 回退第一张
  }

  function spriteMarkup(ch, wantKey) {
    const picked = pickSprite(ch, wantKey);
    const cacheKey = ch.id + '|' + picked.key;
    if (spriteCache.has(cacheKey)) return spriteCache.get(cacheKey);
    let html;
    if (picked.src) {
      html = `<div class="sprite-inner"><img class="sprite-img" alt="${esc(ch.name)}" src="${esc(picked.src)}"></div>`;
    } else {
      // 回退：emoji + 渐变占位（sprites 为空对象时的必备路径）
      const ph = obj(ch.placeholder);
      const colors = arr(ph.colors);
      const bg = str(ph.gradient, '') || str(ph.fallback, '') || `linear-gradient(160deg,${State.data.meta.theme.primary},${State.data.meta.theme.accent})`;
      const grains = colors.length
        ? `<div class="sprite-grain" aria-hidden="true">${colors.map((c) => `<i style="background:${esc(c)}"></i>`).join('')}</div>`
        : '';
      html = `<div class="sprite-inner">${grains}`
        + `<div class="sprite-placeholder" style="background:${esc(bg)}">`
        + `<span class="sprite-emoji">${esc(str(ph.emoji, '👤'))}</span></div>`
        + `<span class="sprite-name">${esc(ch.name)}</span></div>`;
    }
    spriteCache.set(cacheKey, html);
    return html;
  }

  function spriteEntry(pos) { return State.sprites[pos] || null; }
  /** 该角色当前占用的槽位（没有则返回 null） */
  function slotOfChar(charId) {
    for (let i = 0; i < POSITIONS.length; i++) {
      const e = spriteEntry(POSITIONS[i]);
      if (e && e.charId === charId) return POSITIONS[i];
    }
    return null;
  }

  /**
   * 该角色**当前正用着**的立绘名（不在台上则返回空串）。
   *
   * 用途：台词没有写 sprite 字段时**沿用当前表情**，而不是重置成第一张。
   * 修之前的行为是 `line.sprite || 'default'` → 找不到 default → 回退第一张，
   * 于是"模型没写 sprite 的那些台词"全都显示同一张图
   * （实测某作品里李杰 5 张表情图，s2 被用了 107 次、另两张一次没用）。
   * 立绘演出本来就该是"表情保持到下一次改变"。
   */
  function currentSpriteKeyOf(charId) {
    const pos = slotOfChar(charId);
    if (!pos) return '';
    const e = spriteEntry(pos);
    return (e && e.key) ? e.key : '';
  }

  /** 把变换写到内层元素上（入场/退场动画在外层 .sprite-slot，二者互不干扰） */
  function applyTransformToSlot(pos, t) {
    const slot = el.slot[pos];
    if (!slot) return;
    const inner = slot.querySelector('.sprite-inner');
    if (inner) {
      inner.style.transform = transformStr(t);
      inner.style.transformOrigin = '50% 100%';   // 缩放/位移围绕底部中心，符合立绘习惯
    }
    slot.setAttribute('data-transform', transformStr(t));
  }

  /** 真正绘制到 slot：animate=true 播放入场动画 */
  function drawSprite(pos, entry, animate) {
    const slot = el.slot[pos];
    if (!slot) return;
    if (!entry) {
      if (slot.childElementCount) {
        slot.classList.remove('in');
        const old = slot;
        setTimeout(() => { if (!spriteEntry(pos)) { old.innerHTML = ''; old.classList.remove('leaving'); } }, 340);
      }
      return;
    }
    const ch = State.data.charMap[entry.charId];
    if (!ch) return;
    const picked = pickSprite(ch, entry.key);
    const sig = entry.charId + '|' + picked.key;
    if (slot.getAttribute('data-sig') !== sig) {
      slot.innerHTML = spriteMarkup(ch, entry.key);
      slot.setAttribute('data-sig', sig);
    }
    slot.setAttribute('data-char', entry.charId);
    entry.key = picked.key;                       // 记录实际使用的立绘名（快照/断言用）
    applyTransformToSlot(pos, entry.transform || spriteTransformOf(ch, null));
    slot.classList.remove('leaving');
    if (animate) {
      slot.classList.remove('in');
      void slot.offsetWidth;  // 强制重排，让 transition 重新生效
      slot.classList.add('in');
    } else {
      slot.classList.add('in');
    }
  }

  /**
   * v3 舞台规则：把角色放到 pos 槽位。
   * - 该角色已在别的槽 → 从旧槽**移走**（移动而非复制）
   * - pos 被别的角色占着 → 那个角色退场
   * - exit:true → 从**所有**槽位移除
   */
  /**
   * v4 单人舞台：让除 keepId 之外的所有角色退场。
   * 竖屏（手机）下几个立绘并排会互相重叠、糊成一团，横屏则没这个问题，
   * 所以由 meta.soloStage 控制，默认不开（不影响别的作品）。
   */
  function clearOtherChars(keepId) {
    for (const p of POSITIONS) {
      const s = State.sprites[p];
      if (s && s.charId !== keepId) removeSprite(p, true);
    }
  }

  function stagePlace(pos, ch, key, line, animate) {
    // v4：单人舞台 —— 任何人上台之前先让其他人退场，画面上永远只留一个角色。
    // 放在 stagePlace 里而不是各个调用点，是因为所有「让人上台」的路径都汇集到这里
    // （正常推进、静默回放、读档恢复），只改调用点一定会漏。
    if (State.data.meta.soloStage === true) clearOtherChars(ch.id);
    const t = spriteTransformOf(ch, line);
    const existing = slotOfChar(ch.id);
    if (existing && existing !== pos) {
      // 移动：旧槽立即清掉，不做退场动画（视觉上是"走位"）
      State.sprites[existing] = null;
      const old = el.slot[existing];
      if (old) { old.innerHTML = ''; old.classList.remove('in', 'leaving'); old.removeAttribute('data-sig'); }
    }
    // 目标槽被其他人占着 → 让他退场
    const occupant = spriteEntry(pos);
    if (occupant && occupant.charId !== ch.id) {
      removeSprite(pos, true);
    }
    State.sprites[pos] = { charId: ch.id, key: str(key, 'default') || 'default', pose: pos, transform: t };
    drawSprite(pos, State.sprites[pos], animate !== false);
    return t;
  }

  function removeSprite(pos, animate) {
    if (POSITIONS.indexOf(pos) < 0) return;
    State.sprites[pos] = null;
    const slot = el.slot[pos];
    if (!slot) return;
    if (animate === false) {
      slot.innerHTML = ''; slot.classList.remove('in', 'leaving');
      slot.removeAttribute('data-sig'); slot.removeAttribute('data-char'); slot.removeAttribute('data-transform');
      return;
    }
    slot.classList.add('leaving');
    slot.classList.remove('in');
    setTimeout(() => {
      if (!spriteEntry(pos)) {
        slot.innerHTML = ''; slot.classList.remove('leaving');
        slot.removeAttribute('data-sig'); slot.removeAttribute('data-char'); slot.removeAttribute('data-transform');
      }
    }, 400);
  }

  /** 把某个角色从**所有**槽位移除（exit:true 用） */
  function removeCharEverywhere(charId, animate) {
    let n = 0;
    POSITIONS.forEach((p) => { const e = spriteEntry(p); if (e && e.charId === charId) { removeSprite(p, animate); n++; } });
    return n;
  }

  /** v3：登记"这句说完了就退场"（本句仍正常绘制立绘） */
  function queueDeferredExit(charId) {
    const id = str(charId, '');
    if (!id) return;
    State.deferredExit[id] = true;
  }
  /**
   * v3：结算"上一句登记过的退场"。
   * 必须在渲染下一句**之前**调用：这样上一句全程都看得见角色，
   * 而下一句渲染时他已经不在台上（不会多站一句，也不会闪一下）。
   */
  function flushDeferredExit(animate) {
    const ids = Object.keys(State.deferredExit);
    if (!ids.length) return 0;
    State.deferredExit = Object.create(null);
    let n = 0;
    ids.forEach((id) => { n += removeCharEverywhere(id, animate !== false); });
    return n;
  }
  function clearDeferredExit() { State.deferredExit = Object.create(null); }

  function clearSprites() {
    POSITIONS.forEach((p) => {
      State.sprites[p] = null;
      const s = el.slot[p];
      if (s) {
        s.innerHTML = ''; s.classList.remove('in', 'leaving');
        s.removeAttribute('data-sig'); s.removeAttribute('data-char'); s.removeAttribute('data-transform');
      }
    });
  }

  /** 立绘状态快照（存档用） */
  function spriteSnapshot() {
    const out = {};
    POSITIONS.forEach((p) => {
      const s = spriteEntry(p);
      if (!s) return;
      const t = s.transform || { scale: 1, x: 0, y: 0 };
      out[p] = { charId: s.charId, key: s.key, pose: s.pose, scale: t.scale, x: t.x, y: t.y };
    });
    return out;
  }
  /** 从存档恢复立绘（无动画，精确按快照） */
  function restoreSprites(snap) {
    clearSprites();
    const s = obj(snap);
    POSITIONS.forEach((p) => {
      const v = obj(s[p]);
      if (!v.charId || !State.data.charMap[v.charId]) return;
      const ch = State.data.charMap[v.charId];
      const t = spriteTransformOf(ch, {
        spriteScale: ('scale' in v) ? v.scale : undefined,
        spriteX: ('x' in v) ? v.x : undefined,
        spriteY: ('y' in v) ? v.y : undefined
      });
      State.sprites[p] = { charId: str(v.charId, ''), key: str(v.key, 'default'), pose: str(v.pose, p), transform: t };
      drawSprite(p, State.sprites[p], false);
    });
  }

  /* ---------------------------- 对话渲染 ---------------------------- */
  function clearAutoTimers() {
    clearTimeout(Runtime.autoTimer); Runtime.autoTimer = 0;
    clearTimeout(Runtime.autoTextTimer); Runtime.autoTextTimer = 0;
  }
  function stopTypewriter() {
    if (Runtime.type.raf) cancelAnimationFrame(Runtime.type.raf);
    Runtime.type.raf = 0;
  }
  function speedMs() {
    const v = SPEED_MS[State.settings.textSpeed];
    return typeof v === 'number' ? v : SPEED_MS.medium;
  }

  /** 打字机；instant=true 或速度档为 instant 时立即完成 */
  function typeText(text, instant) {
    const full = str(text, '');
