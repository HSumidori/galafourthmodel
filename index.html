  /* --------------------- v2 全屏横屏 / 旋转提示 --------------------- */
  /**
   * 进入全屏并尽量锁定横屏。
   * 全屏与屏幕方向锁都可能不被支持（桌面浏览器 / 无用户手势 / 权限不足），
   * 因此整段用 try/catch + Promise catch 兜住：失败只给提示，绝不抛错。
   */
  function enterFullscreenLandscape() {
    const root = document.documentElement;
    try {
      const req = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
      if (typeof req === 'function') {
        const p = req.call(root);
        if (p && typeof p.then === 'function') {
          p.then(function () { tryLockLandscape(); }).catch(function () { toast('全屏被浏览器拒绝，可直接旋转设备'); });
        } else {
          setTimeout(tryLockLandscape, 120);
        }
      } else {
        toast('当前环境不支持全屏，可直接旋转设备');
      }
    } catch (e) {
      toast('当前环境不支持全屏，可直接旋转设备');
    }
    // 全屏按钮也算一种「我知道了」，收起提示条
    dismissRotateHint();
  }
  /** 尝试锁定横屏；不支持时静默失败 */
  function tryLockLandscape() {
    try {
      const so = screen.orientation;
      if (so && typeof so.lock === 'function') {
        const p = so.lock('landscape');
        if (p && typeof p.catch === 'function') p.catch(function () { /* 未全屏或无权限：忽略 */ });
      }
    } catch (e) { /* 忽略：只全屏不锁方向 */ }
  }
  function dismissRotateHint() {
    // 仅本次会话内记住：刷新后仍会再提示一次，避免玩家永久失去「全屏横屏」引导
    if (el.rotateHint) el.rotateHint.classList.add('dismissed');
  }

  /* ------------------------------ 自动播放状态 ------------------------------ */
  function updateAutoButton() {
    if (!el.qbAuto) return;
    const on = !!State.settings.autoPlay && State.phase !== 'title' && !State.uiLocked;
    el.qbAuto.textContent = on ? '❚❚' : '▶';
    el.qbAuto.classList.toggle('on', on);
    el.qbAuto.title = on ? '自动播放中（点击停止）' : '自动播放（A）';
    if (!on) clearAutoTimers();
  }
  /** 文本打完后，若开启自动播放则安排推进 */
  function scheduleAuto() {
    if (!State.settings.autoPlay || State.uiLocked || State.phase !== 'line') return;
    clearTimeout(Runtime.autoTextTimer);
    Runtime.autoTextTimer = setTimeout(() => { if (State.phase === 'line' && !State.uiLocked) advance(); }, State.settings.autoInterval);
  }
  function toggleAuto() {
    if (State.phase === 'title') return;
    State.settings.autoPlay = !State.settings.autoPlay;
    Persist.writeSettings();
    updateAutoButton();
    toast(State.settings.autoPlay ? '自动播放：开' : '自动播放：关');
    if (State.settings.autoPlay && Runtime.type.done && State.phase === 'line') scheduleAuto();
  }

  /* ==========================================================================
   * 模块 8 · Input —— 鼠标 / 触屏 / 键盘
   * ========================================================================== */
  function bindEvents() {
    // ---- 标题画面 ----
    el.btnStart.addEventListener('click', (ev) => { ev.stopPropagation(); startGame(); });
    el.btnContinue.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (State.playMode !== 'title') State.playMode = 'title';
      const auto = Persist.readAuto();
      if (auto) { loadFrom(auto); return; }
      const slot = [1, 2, 3].map((i) => Persist.readSlot(i)).filter(Boolean)[0];
      if (slot) { loadFrom(slot); return; }
      toast('暂无可读取的存档');
    });
    el.btnGallery.addEventListener('click', (ev) => { ev.stopPropagation(); openGallery(); });
    el.btnSettings.addEventListener('click', (ev) => { ev.stopPropagation(); openSettings(); });
    if (el.btnAffection) el.btnAffection.addEventListener('click', (ev) => { ev.stopPropagation(); openAffection(); });
    if (el.btnRotate) el.btnRotate.addEventListener('click', (ev) => { ev.stopPropagation(); enterFullscreenLandscape(); });
    if (el.rotateHintDismiss) el.rotateHintDismiss.addEventListener('click', (ev) => { ev.stopPropagation(); dismissRotateHint(); });
    if (el.rotateHintTurn) el.rotateHintTurn.addEventListener('click', (ev) => { ev.stopPropagation(); enterFullscreenLandscape(); });

    // ---- 结局画面 ----
    el.btnEndingTitle.addEventListener('click', (ev) => { ev.stopPropagation(); backToTitle(''); });
    el.btnEndingGallery.addEventListener('click', (ev) => { ev.stopPropagation(); openGallery(); });

    // ---- 快捷工具条 ----
    el.qbLog.addEventListener('click', (ev) => { ev.stopPropagation(); openHistory(); });
    el.qbAuto.addEventListener('click', (ev) => { ev.stopPropagation(); toggleAuto(); });
    el.qbSave.addEventListener('click', (ev) => { ev.stopPropagation(); saveToSlot(1); });
    el.qbMenu.addEventListener('click', (ev) => { ev.stopPropagation(); openMenu(); });

    // ---- v3 音乐图标 / 曲名 ----
    if (el.bgmToggle) el.bgmToggle.addEventListener('click', (ev) => { ev.stopPropagation(); openBgmPanel(); });
    if (el.bgmTitle) el.bgmTitle.addEventListener('click', (ev) => { ev.stopPropagation(); openBgmPanel(); });

    // ---- 点击画面推进（对话框 / 立绘区域 / 整屏） ----
    const tapAdvance = (ev) => {
      if (State.modal || State.uiLocked) return;
      const t = ev.target;
      if (t instanceof Element && t.closest('button, .modal, #choice-list, a')) return;
      advance();
    };
    el.dbox.addEventListener('click', (ev) => { ev.stopPropagation(); tapAdvance(ev); });
    el.gameScreen.addEventListener('click', tapAdvance);

    // ---- v3：任意一次真实用户手势即解锁音频（浏览器自动播放策略） ----
    const unlockOnce = () => {
      unlockAudio();
      document.removeEventListener('pointerdown', unlockOnce, true);
      document.removeEventListener('keydown', unlockOnce, true);
      document.removeEventListener('touchstart', unlockOnce, true);
    };
    document.addEventListener('pointerdown', unlockOnce, true);
    document.addEventListener('keydown', unlockOnce, true);
    document.addEventListener('touchstart', unlockOnce, true);


    // ---- 小游戏：连打加速 / 结束时继续 ----
    document.addEventListener('keydown', (ev) => {
      if (!MiniGame.active) return;
      if (ev.key === ' ' || ev.key === 'Spacebar' || ev.key === 'Enter') {
        ev.preventDefault();
        if (MiniGame.ended) { closeMinigame(); return; }
        MiniGame.hold = true;
        if (!ev.repeat) mgBump();
      }
    });
    document.addEventListener('keyup', (ev) => {
      if (MiniGame.active && (ev.key === ' ' || ev.key === 'Spacebar')) MiniGame.hold = false;
    });
    el.mgRoot.addEventListener('pointerdown', (ev) => {
      if (!MiniGame.active || MiniGame.ended) return;
      ev.preventDefault();
      MiniGame.hold = true;
      mgBump();
    });
    el.mgRoot.addEventListener('pointerup', () => { MiniGame.hold = false; });
    el.mgRoot.addEventListener('pointercancel', () => { MiniGame.hold = false; });
    // ---- 独立插图：点哪都能关 ----
    el.cgView.addEventListener('click', () => closeCg());
    el.mgNext.addEventListener('click', (ev) => { ev.stopPropagation(); closeMinigame(); });
    // ---- 键盘 ----
    document.addEventListener('keydown', (ev) => {
      const tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : '';
      const typing = tag === 'input' || tag === 'textarea' || (ev.target && ev.target.isContentEditable);
      if (ev.ctrlKey && (ev.key === 's' || ev.key === 'S')) {
        ev.preventDefault();
        if (State.playMode === 'game') saveToSlot(1); else toast('现在没有进行中的进度');
        return;
      }
      if (ev.key === 'Escape') {
        ev.preventDefault();
        if (State.modal) closeModal();
        else if (State.playMode === 'game') openMenu();
        return;
      }
      if (typing) return;
      if (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'Spacebar') {
        if (State.modal) {
          // 面板中：回车/空格关闭（避免阻塞推进）
          if (ev.key === 'Enter') { ev.preventDefault(); closeModal(); }
          return;
        }
        ev.preventDefault();
        advance();
        return;
      }
      const k = ev.key.toLowerCase();
      if (k === 'l' && State.playMode === 'game') { openHistory(); return; }
      if (k === 'a' && State.playMode === 'game') { toggleAuto(); return; }
      if (k === 's' && State.playMode === 'game') { saveToSlot(1); return; }
      if (State.phase === 'choice' && /^[1-9]$/.test(k)) {
        const idx = Number(k) - 1;
        const btns = el.choiceList.querySelectorAll('.choice-btn');
        if (btns[idx]) btns[idx].click();
        return;
      }
      if (k === 'h' && State.playMode === 'game') { openHistory(); return; }
    });

    // ---- 视口变化：重新贴合高度（iOS 地址栏 / 旋屏） ----
    const syncHeight = () => {
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      if (h) document.documentElement.style.setProperty('--cg-app-h', Math.round(h) + 'px');
      if (State.phase === 'choice') requestAnimationFrame(positionChoiceList);
    };
    window.addEventListener('resize', syncHeight);
    window.addEventListener('orientationchange', () => setTimeout(syncHeight, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncHeight);
    syncHeight();
  }

  /* ==========================================================================
   * 模块 9 · Boot —— 启动流程
   * ========================================================================== */
  function readQuery() {
    const q = { fast: false, autostart: false, scene: '', line: 0 };
    try {
      const sp = new URLSearchParams(location.search || '');
      q.fast = sp.get('fast') === '1' || sp.get('fast') === 'true';
      q.autostart = sp.get('autostart') === '1' || sp.get('autostart') === 'true';
      q.scene = str(sp.get('scene'), '');
      q.line = Math.max(0, int(sp.get('line'), 0));
      if (sp.get('instant') === '1') q.fast = true;
    } catch (e) { /* file:// 下 URLSearchParams 依旧可用，异常时忽略 */ }
    return q;
  }

  /**
   * 跳到某一幕的某一行（编辑器预览用）。
   *
   * 关键点：不能只 `enterScene(id, line)` 就完事——那样前面几行摆过的立绘不会出现在舞台上，
   * 作者看到的画面是错的。所以这里先把 0..line-1 **静默回放**一遍（不播音、不进历史、不记已读），
   * 把舞台/背景/变量推进到位，再正常渲染目标行；
   * 中途遇到选项就停在选项上（选择之前不该继续执行后面的行）。
   */
  function jumpToLine(sceneId, lineIdx) {
    const sc = State.data.sceneMap[str(sceneId, '')];
    if (!sc || !sc.lines.length) return false;
    const target = Math.max(0, Math.min(int(lineIdx, 0), sc.lines.length - 1));
    clearAutoTimers();
    stopTypewriter();
    clearSprites();
    State.sceneId = sc.id;
    State.sceneIdx = State.data.scenes.indexOf(sc);
    State.visitedOrder = [sc.id];
    State.lineIdx = 0;
    Runtime.bgScene = sc.background;
    const bg = applyBackground(sc.background);
    State.bgId = bg ? bg.id : sc.background;
    el.chapterChip.textContent = sc.name;
    el.chapterChip.classList.toggle('hidden', !sc.name);
    el.gameScreen.setAttribute('data-has-chapter', sc.name ? '1' : '0');
    playBgm(sc);

    Runtime.previewing = true;               // 回放期间不播语音
    try {
      for (let i = 0; i < target; i++) {
        const ln = sc.lines[i];
        if (!ln || typeof ln !== 'object') continue;
        const t = str(ln.type, '');
        if (t === 'narration' || t === 'dialogue') {
          if (ln.clear === true) clearSprites();
          applyLineBackground(ln);
          renderTextLine(ln);
        } else if (t === 'set') {
          applyEffects(ln.effects);
        } else if (t === 'choice') {
          // 选项之前就停下，让作者能看到选项界面
          State.lineIdx = i;
          State.phase = 'choice';
          State.pendingChoice = ln;
          renderChoiceFor(ln);
          Runtime.previewing = false;
          return true;
        }
      }
    } finally {
      Runtime.previewing = false;
    }
    State.lineIdx = target;
    execLine();
    return true;
  }

  /**
   * 拆分素材的产物（素材是 assets/xxx 这样的相对路径）**不能用 file:// 双击打开**：
   * 浏览器会以跨源策略拒绝本地页面去读同目录的文件，结果是"能打开、但图片和音乐全没有"。
   * 这种情况下页面会静默地坏掉，谁都看不出原因——所以这里主动说清楚。
   * 单文件产物素材全内联，不受影响，不会触发这段。
   */
  function warnIfFileProtocol() {
    if (location.protocol !== 'file:') return;
    const d = State.data;
    if (!d) return;
    // 找出"不是内联 data: 的素材引用"，有就说明这是拆分素材的产物
    const external = [];
    if (typeof d.meta.cover === 'string' && d.meta.cover && d.meta.cover.indexOf('data:') !== 0) external.push('封面');
    for (const b of d.backgrounds || []) {
      if (typeof b.image === 'string' && b.image && b.image.indexOf('data:') !== 0) { external.push('背景图'); break; }
    }
    for (const c of d.characters || []) {
      const sp = Object.values(c.sprites || {});
      if (sp.some((v) => typeof v === 'string' && v && String(v).indexOf('data:') !== 0)) { external.push('立绘'); break; }
    }
    for (const sc of d.scenes || []) {
      if (sc.bgm && typeof sc.bgm.data === 'string' && sc.bgm.data.indexOf('data:') !== 0) { external.push('背景音乐'); break; }
    }
    if (!external.length) return;   // 素材全内联，file:// 也能正常工作

    State.fileWarning = external;
    try {
      const box = document.createElement('div');
      box.setAttribute('data-testid', 'file-protocol-warning');
      box.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;'
        + 'padding:22px;background:rgba(10,11,16,.93);backdrop-filter:blur(3px)';
      box.innerHTML = ''
        + '<div style="max-width:620px;background:#1b1d28;border:1px solid #7a6220;border-radius:16px;padding:22px 24px;'
        + 'font:14px/1.8 system-ui,-apple-system,\'Segoe UI\',sans-serif;color:#e8ecf7">'
        + '<div style="font-size:17px;font-weight:700;color:#ffdf9b;margin-bottom:10px">⚠ 请通过网址打开，不要双击文件</div>'
        + '<div>这个版本把素材（' + external.join('、') + '）放在了 <code style="background:#0d0e13;padding:1px 5px;'
        + 'border-radius:5px">assets/</code> 目录里，而浏览器出于安全策略，'
        + '<b>不允许用 <code style="background:#0d0e13;padding:1px 5px;border-radius:5px">file://</code> 双击打开时读取旁边的文件</b>，'
        + '所以画面和声音都出不来。</div>'
        + '<div style="margin-top:12px;color:#9be3b5">✔ 解决办法：把文件放到静态托管（如 GitHub Pages）后，用它的网址打开。</div>'
        + '<div style="margin-top:6px;color:#8b93a7;font-size:12.5px">只想本地点开看看的话，在文件所在目录起一个本地服务器：'
        + '<code style="background:#0d0e13;padding:1px 5px;border-radius:5px">python -m http.server 8000</code>'
        + '，然后用浏览器访问本机的 8000 端口（地址填 127.0.0.1:8000 即可）。'
        + '另外「单文件版」的素材是内联的，双击就能玩。</div>'
        + '<button type="button" style="margin-top:18px;padding:9px 20px;border-radius:10px;border:none;cursor:pointer;'
        + 'font:inherit;font-weight:700;background:linear-gradient(135deg,#ff8fb1,#ffb45a);color:#1a1220" '
        + 'onclick="this.closest(\'div[data-testid]\').remove()">我知道了，继续（仍然没图没声音）</button>'
        + '</div>';
      document.body.appendChild(box);
    } catch (e) { /* 提示失败不影响游戏逻辑 */ }
  }

  function init() {
    // 1) 读数据，失败也要能渲染标题画面（绝不白屏）
    const res = readRawData();
    if (res.ok) State.data = normalizeData(res.data);
    else {
      State.dataErr = res.err;
      State.data = normalizeData({});
      State.fatal = res.err;
    }
    // 1.5) file:// 打开拆分素材产物时，把原因说清楚（否则就是"能打开但没图没声"）
    warnIfFileProtocol();
    // 2) 主题 / 字号 / 设置
    applyTheme();
    applyFontSize();
    // v3：未被用户保存过音频设置时，用 meta 的默认音量
    applyMetaAudio();
    // 3) 测试友好参数
    const q = readQuery();
    if (q.fast) State.settings.textSpeed = 'instant';
    // 4) 渲染标题（始终先渲染，保证 DOM 可截图）
    State.phase = 'title';
    showScreen('title');
    renderTitleScreen();
    bindEvents();
    updateAutoButton();
    updateBgmUi();
    updateBgmTitle();
    // 5) autostart：跳过标题直接进入 start 场景
    if (q.autostart && State.data.scenes.length) {
      if (q.scene && State.data.sceneMap[q.scene]) { startGame(); jumpToLine(q.scene, q.line); }
      else startGame();
    }
    if (State.dataErr) console.warn('[galgame] 数据异常：' + State.dataErr);
    if (State.data.warnings.length) console.warn('[galgame] 数据提示：', State.data.warnings);
    // 编辑器预览：允许父页面用 postMessage 让预览跳到指定行（不整页重载）
    window.addEventListener('message', (ev) => {
      const d = ev && ev.data;
      if (!d || typeof d !== 'object' || d.type !== 'galgame:goto') return;
      try {
        if (State.phase === 'title') startGame();
        jumpToLine(str(d.scene, ''), int(d.line, 0));
      } catch (err) {
        console.warn('[galgame] 跳转失败：', err);
      }
    });

    document.documentElement.setAttribute('data-ready', '1');
    // 便于自动化 / 调试读取内部状态（只读导出）
    window.GALGAME = {
      version: '1.0.0',
      state: State,
      advance,
      startGame,
      backToTitle,
      openHistory,
      openSettings,
      openGallery,
      openSaves,
      openAffection,
      enterFullscreenLandscape,
      evalConditions,
      resolveEndingByCondition,
      applyEffects,
      saveToSlot,
      loadFrom,
      getVars: () => clone(State.vars),
      /** 跳到某一幕某一行（编辑器预览用；会先静默回放前面的行以还原舞台） */
      goto: jumpToLine,
      getPosition: () => ({ sceneId: State.sceneId, lineIdx: State.lineIdx, phase: State.phase }),
      /** 当前背景 id（含行级 background 覆盖的结果） */
      getBg: () => State.bgId,
      /** 背景切换次数：便于断言“确实换了背景” */
      getBgRev: () => Runtime.bgRev,
      /** 当前背景来自哪一行：'line'（行级覆盖）/ 'scene'（沿用场景背景） */
      getBgSource: () => (State.bgId && State.sceneId === Runtime.bgSourceScene
        && State.bgId !== Runtime.bgSourceSceneBg ? 'line' : 'scene'),
      /* ---- v3 舞台 / 音频 调试接口（只读） ---- */
      /** 各槽位当前角色：{ left: charId|null, center: ..., right: ... } */
      getStage: () => {
        const o = {};
        POSITIONS.forEach((p) => { const e = spriteEntry(p); o[p] = e ? e.charId : null; });
        return o;
      },
      /** 某角色当前占用的槽位（null 表示不在舞台上） */
      getSlotOf: (charId) => slotOfChar(str(charId, '')),
      /** 槽位上的实际立绘 key / 变换 */
      getSpriteInfo: (pos) => {
        const e = spriteEntry(pos);
        if (!e) return null;
        const t = e.transform || { scale: 1, x: 0, y: 0 };
        return { charId: e.charId, key: e.key, scale: t.scale, x: t.x, y: t.y, transform: transformStr(t) };
      },
      /** 音频状态：背景音 key/是否在播/音量，语音是否在播 */
      getAudio: () => ({
        bgmKey: Audio2.bgmKey,
        bgmSrcHead: Audio2.bgmSrc ? Audio2.bgmSrc.slice(0, 40) : '',
        bgmPaused: Audio2.bgmEl ? Audio2.bgmEl.paused : null,
        bgmVolume: Audio2.bgmEl ? Audio2.bgmEl.volume : null,
        bgmLoop: Audio2.bgmEl ? Audio2.bgmEl.loop : null,
        voicePaused: Audio2.voiceEl ? Audio2.voiceEl.paused : null,
        voiceVolume: Audio2.voiceEl ? Audio2.voiceEl.volume : null,
        voiceSrcHead: (Audio2.voiceEl && Audio2.voiceEl.src) ? Audio2.voiceEl.src.slice(0, 40) : '',
        unlocked: Audio2.unlocked,
        blocked: Audio2.blocked,
        mute: State.audio.mute,
        // <audio> 元素**实际**用的 src。内联产物会给它一个 blob: URL（见 toPlayableUrl），
        // 所以这里和 bgmSrcHead（保留的原始 data URL）会不一样，这是预期行为。
        bgmElSrcHead: Audio2.bgmEl && Audio2.bgmEl.src ? Audio2.bgmEl.src.slice(0, 40) : '',
        bgmElIsBlob: !!(Audio2.bgmEl && Audio2.bgmEl.src && Audio2.bgmEl.src.indexOf('blob:') === 0),
        voiceElIsBlob: !!(Audio2.voiceEl && Audio2.voiceEl.src && Audio2.voiceEl.src.indexOf('blob:') === 0),
        lastError: Audio2.lastError || null,
        settings: { bgmVolume: State.audio.bgmVolume, voiceVolume: State.audio.voiceVolume }
      }),
      getBgmTitle: () => {
        const sc = currentScene();
        const has = !!(Audio2.bgmKey && Audio2.bgmEl && Audio2.bgmEl.src);
        return has && sc ? bgmTitle(sc) : '';
      },
      setAudioVolume,
      toggleMute,
      playVoice
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
