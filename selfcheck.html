":15},{"p":"assets/a-f70f44fd97988577.mp3","kb":6}];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('env').innerHTML =
  '页面地址：<code>' + esc(location.href) + '</code><br>协议：<code>' + esc(location.protocol) + '</code>';

// 把响应体开头的几十字节读成文本，用来识别"发回来的不是素材"
async function sniff(res) {
  try {
    const buf = await res.clone().arrayBuffer();
    const head = new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(buf).subarray(0, 200));
    return { head: head.replace(/[^\x20-\x7e\u4e00-\u9fa5]/g, '.'), size: buf.byteLength };
  } catch (e) { return { head: '', size: 0, err: e.message }; }
}

function decodeImage(url) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res({ ok: true, w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => res({ ok: false });
    im.src = url;
    setTimeout(() => res({ ok: false, timeout: true }), 8000);
  });
}
function decodeAudio(url) {
  return new Promise((res) => {
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => res({ ok: true, dur: a.duration });
    a.onerror = () => res({ ok: false, code: a.error ? a.error.code : null });
    a.src = url;
    setTimeout(() => res({ ok: false, timeout: true }), 10000);
  });
}

(async () => {
  const rows = [];
  let bad = 0, lfs = 0, tiny = 0;
  for (const a of ASSETS) {
    const isImg = /\.(png|jpe?g|webp|gif|avif|svg)$/i.test(a.p);
    let status = '—', got = 0, verdict = '', okRow = false, snip = '';
    try {
      const r = await fetch(a.p, { cache: 'no-store' });
      status = r.status;
      if (r.ok) {
        const sn = await sniff(r);
        got = sn.size;
        snip = sn.head;
        // Git LFS：仓库里存的是指针文本，Pages 把这段文本当成素材发出来
        if (/git-lfs\.github\.com\/spec/.test(sn.head)) { verdict = '✖ 这是 Git LFS 指针，不是素材本身'; lfs++; }
        else if (/^\s*<(!doctype|html)/i.test(sn.head)) { verdict = '✖ 服务器返回的是 HTML 页面（路径不对）'; }
        else if (got < a.kb * 1024 * 0.5) { verdict = '✖ 内容比预期小很多（' + Math.round(got / 1024) + ' KB / 预期 ' + a.kb + ' KB）'; tiny++; }
        else {
          const d = isImg ? await decodeImage(a.p) : await decodeAudio(a.p);
          if (d.ok) { verdict = isImg ? ('✔ 解码成功 ' + d.w + '×' + d.h) : ('✔ 可播放 ' + (d.dur ? d.dur.toFixed(0) + ' 秒' : '')); okRow = true; }
          else verdict = '✖ 拿到了数据但解不开' + (d.code ? '（音频错误码 ' + d.code + '）' : '');
        }
      } else { verdict = '✖ HTTP ' + status; }
    } catch (e) { status = 'ERR'; verdict = '✖ ' + e.message; }
    if (!okRow) bad++;
    rows.push({ ...a, status, got, verdict, ok: okRow, snip });
  }

  document.getElementById('tb').innerHTML = rows.map((r) => {
    const cls = r.ok ? 'g' : 'r';
    return '<tr><td class="s ' + cls + '">' + r.status + '</td>'
      + '<td>' + esc(r.p) + '<br><span class="' + cls + '">' + esc(r.verdict) + '</span>'
      + (r.snip && !r.ok ? '<pre>' + esc(r.snip.slice(0, 160)) + '</pre>' : '')
      + '</td><td class="n">' + (r.got ? Math.round(r.got / 1024) + ' KB' : '') + '</td></tr>';
  }).join('');

  const top = document.getElementById('top');
  if (location.protocol === 'file:') {
    top.className = 'big warn';
    top.textContent = '⚠ 你是用 file:// 直接双击打开的。浏览器会因跨源策略拒绝加载素材 —— 这不是部署的问题，请通过 https 访问站点。';
  } else if (lfs > 0) {
    top.className = 'big bad';
    top.textContent = '✖ 有 ' + lfs + ' 个文件是 Git LFS 指针而不是素材本身。'
      + 'GitHub Pages **不提供 LFS 内容**，所以图片和音乐都出不来。'
      + '解决：换用「单文件保底版」（所有素材内联，不受影响），或者关掉 LFS 重新提交这些文件。';
  } else if (bad === ASSETS.length) {
    top.className = 'big bad';
    top.textContent = '✖ 全部 ' + ASSETS.length + ' 个素材都取不到 —— 最可能是 assets/ 目录没有跟着传上去。';
  } else if (bad > 0) {
    top.className = 'big bad';
    top.textContent = '✖ ' + bad + ' / ' + ASSETS.length + ' 个素材有问题（看下表）。';
  } else {
    top.className = 'big ok';
    top.textContent = '✔ ' + ASSETS.length + ' 个素材全部正常（能取到、能解码）。如果游戏里还是看不到，请把这一页截图发我。';
  }
})();
